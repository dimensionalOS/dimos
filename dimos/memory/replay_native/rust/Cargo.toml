[package]
name = "dimos-memory-replay"
version = "0.1.0"
edition = "2021"
description = "Native replay of a DimOS memory recording (.db or .mcap): one output per recorded stream"
license = "Apache-2.0"

[[bin]]
name = "memory_replay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "6663bcb6e5e18f43a6cb9cf77ccbec613e310443" }
lz4_flex = "0.14.0"
mcap = { version = "0.25.0", default-features = false, features = ["zstd", "lz4"] }
memmap2 = "0.9"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
