[package]
name = "dimos-realsense"
version = "0.1.0"
edition = "2021"
description = "Native RealSense D4xx camera module for dimos"
license = "Apache-2.0"

[[bin]]
name = "realsense_native"
path = "src/main.rs"

[workspace]

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "93ca305d24721f49bd30d580a8ec353619560744" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
realsense-rust = "1.3"
realsense-sys = "2.56"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[build-dependencies]
pkg-config = "0.3"
