[package]
name = "dimos-realsense"
version = "0.1.0"
edition = "2021"
description = "Native RealSense D4xx camera module for dimos"
license = "Apache-2.0"

[[bin]]
name = "realsense_native"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
[package.metadata.dimos.module.realsense]
path = "dimos_realsense::RealSense"
python = "dimos.hardware.sensors.camera.realsense.camera:RealSenseCamera"

[package.metadata.dimos.module.realsense.inputs]
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.realsense.outputs]
color_image = "sensor_msgs.Image"
depth_image = "sensor_msgs.Image"
infrared_left = "sensor_msgs.Image"
infrared_right = "sensor_msgs.Image"
imu = "sensor_msgs.Imu"
imu_info = "sensor_msgs.ImuInfo"
pointcloud = "sensor_msgs.PointCloud2"
camera_info = "sensor_msgs.CameraInfo"
depth_camera_info = "sensor_msgs.CameraInfo"
infrared_left_camera_info = "sensor_msgs.CameraInfo"
infrared_right_camera_info = "sensor_msgs.CameraInfo"

[dependencies]
dimos-module.workspace = true
lcm-msgs.workspace = true
realsense-rust = "1.3"
realsense-sys = "2.56"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde.workspace = true
tracing.workspace = true
validator.workspace = true

[build-dependencies]
pkg-config = "0.3"
