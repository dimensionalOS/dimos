[package]
name = "dimos-livox"
version = "0.1.0"
edition = "2021"
description = "Livox SDK2 wire protocol and Mid-360 driver for dimos"
license = "Apache-2.0"

[lib]

[[bin]]
name = "mid360_native"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
[package.metadata.dimos.module.mid360]
path = "dimos_livox::module::Mid360"
python = "dimos.hardware.sensors.lidar.livox.module:Mid360"

[package.metadata.dimos.module.mid360.outputs]
lidar = "sensor_msgs.PointCloud2"
imu = "sensor_msgs.Imu"

[dependencies]
crc = "3"
dimos-module = { path = "../../../../../../native/rust/dimos-module" }
etherparse = "0.21.0"
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
pcap-parser = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
