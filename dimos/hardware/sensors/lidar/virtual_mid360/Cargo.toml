[package]
name = "dimos-virtual-mid360"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "virtual_mid360"
path = "src/main.rs"

[dependencies]
# Direct dependencies of the copied livox wire/pipeline/pcap modules. See src/main.rs.
crc = "3"
etherparse = "0.21.0"
pcap-parser = "0.17.0"
dimos-module = { git = "https://github.com/dimensionalOS/dimos", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
