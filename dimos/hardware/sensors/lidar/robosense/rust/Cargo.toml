[package]
name = "dimos-robosense"
version = "0.1.0"
edition = "2021"
description = "RoboSense Airy lidar native module for dimos"
license = "Apache-2.0"

[lib]

[[bin]]
name = "airy_native"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
[package.metadata.dimos.module.airy]
path = "dimos_robosense::module::Airy"
python = "dimos.hardware.sensors.lidar.robosense.module:Airy"

[package.metadata.dimos.module.airy.outputs]
lidar = "sensor_msgs.PointCloud2"
imu = "sensor_msgs.Imu"

[dependencies]
robosense-airy = "0.1"
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "9ac42e97ac754f026fc418b5534960dba71c2c0f" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
