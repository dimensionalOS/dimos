[package]
name = "dimos-robosense"
version = "0.1.0"
edition = "2021"
description = "RoboSense lidar (Airy, Helios, Bpearl, RS32, E1) native module for dimos"
license = "Apache-2.0"

[lib]

[[bin]]
name = "robosense_native"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
[package.metadata.dimos.module.robosense_lidar]
path = "dimos_robosense::module::RoboSenseLidar"
python = "dimos.hardware.sensors.lidar.robosense.module:RoboSenseLidar"

[package.metadata.dimos.module.robosense_lidar.outputs]
lidar = "sensor_msgs.PointCloud2"
imu = "sensor_msgs.Imu"

[dependencies]
robosense-lidar = { git = "https://github.com/jeff-hykin/robosense-lidar", rev = "a88211e9835711718f47793e167815fef7835f56" }
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "6663bcb6e5e18f43a6cb9cf77ccbec613e310443" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
