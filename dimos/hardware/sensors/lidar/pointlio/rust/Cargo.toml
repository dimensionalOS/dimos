[package]
name = "dimos-pointlio"
version = "0.1.0"
edition = "2021"
description = "Point-LIO native module for dimos (PointCloud2 + Imu in, odometry + body cloud out)"
license = "Apache-2.0"

[lib]

[[bin]]
name = "pointlio_replay"
path = "src/bin/replay.rs"

[[bin]]
name = "pointlio_native"
path = "src/bin/native.rs"

[dependencies]
livox-wire = { git = "https://github.com/dimensionalOS/livox-wire", rev = "441c4a16dbe2adb0683ece976cc800c6d7fbc790" }
# Direct dependencies of the copied livox wire/pipeline/pcap modules. See src/lib.rs.
pointlio-core = { git = "https://github.com/dimensionalOS/dimos-module-pointlio.git", rev = "22a5403f827d030b248ae473c2808b5d405b3d55" }
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "a83b1e8f06a5010dfcfb498f6d09d9d725c54b8b" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
