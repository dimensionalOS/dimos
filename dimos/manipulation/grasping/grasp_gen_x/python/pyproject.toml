[project]
name = "dimos-graspgenx-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["graspgenx", "matplotlib>=3.7.1"]

[tool.uv]
package = false
required-version = ">=0.9.25"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Keep the previously validated GraspGenX recipe local to this environment.
override-dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "yourdfpy>=0.0.60",
    "trimesh>=4.12",
    "numpy>=2",
    "timm>=1.0.17",
    "huggingface-hub>=0.30,<1",
    "diffusers>=0.29",
    "pyopengl>=3.1.5",
]

[tool.uv.sources]
graspgenx = { git = "https://github.com/NVlabs/GraspGenX.git", rev = "b9429097728cb1c430dd78b92edf17ba318aad03" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
sharedarray = ["setuptools>=45,<78"]
