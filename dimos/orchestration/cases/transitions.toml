state_machine = "transitions.toml"

[[step]]
start = true
effects = [
  { publish = "log", value = "enter top" },
  { publish = "log", value = "enter left" },
]
active = ["top", "left"]

[[step]]
external = "go"
data = { fast = true }
effects = [
  { publish = "log", value = "exit left" },
  { call = "robot.hurry", goal_id = "g-1", args = { a = 1, speed = 2.0 }, nowait = true },
  { publish = "log", value = "enter right" },
]
active = ["top", "right"]

[[step]]
external = "again"
effects = [
  { publish = "log", value = "exit right" },
  { publish = "log", value = "enter right" },
]
active = ["top", "right"]

[[step]]
external = "go"
effects = [
  { publish = "log", value = "exit right" },
  { publish = "log", value = "exit top" },
  { publish = "log", value = "top go" },
  { publish = "log", value = "enter top" },
  { publish = "log", value = "enter right" },
]
active = ["top", "right"]

[[step]]
external = "swap"
active = ["top", "right"]
vars = { a = 2, b = 1 }

[[step]]
input = "level"
msg = { data = 0.9 }
effects = [
  { publish = "log", value = "exit right" },
  { publish = "log", value = "exit top" },
  { publish = "log", value = "enter far" },
]
active = ["far"]

[[step]]
input = "level"
msg = { data = 0.1 }
effects = [
  { publish = "log", value = "enter top" },
  { publish = "log", value = "enter left" },
]
active = ["top", "left"]

[[step]]
external = "go"
effects = [
  { publish = "log", value = "exit left" },
  { publish = "log", value = "exit top" },
  { publish = "log", value = "enter far" },
  { publish = "log", value = "enter top" },
  { publish = "log", value = "enter left" },
]
active = ["top", "left"]

[[step]]
external = "spin"
error = "more than 100 when transitions in a row"
