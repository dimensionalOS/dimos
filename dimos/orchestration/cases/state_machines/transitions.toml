[machine]
name = "transitions"
initial = "top"

[vars]
a = 1
b = 2
count = 0
loop = false

[inputs]
level = "std_msgs.Float32"

[outputs]
log = "std_msgs.String"

[events]
go = {}
again = {}
swap = {}
spin = {}

[[state]]
name = "top"
initial = "left"
entry = [{ publish = "log", value = "'enter top'" }]
exit = [{ publish = "log", value = "'exit top'" }]

[[state.transition]]
event = "go"
to = "right"
run = [{ publish = "log", value = "'top go'" }]

[[state.transition]]
event = "swap"
set = { a = "vars.b", b = "vars.a" }

[[state.transition]]
event = "spin"
set = { loop = true }

[[state.transition]]
when = "vars.loop"
set = { count = "vars.count + 1" }

[[state]]
name = "left"
parent = "top"
entry = [{ publish = "log", value = "'enter left'" }]
exit = [{ publish = "log", value = "'exit left'" }]

[[state.transition]]
event = "go"
if = "event.data.fast"
to = "right"
run = [{ call = "robot.hurry", args = { a = "vars.a", speed = 2.0 } }]

[[state.transition]]
event = "go"
to = "far"

[[state]]
name = "right"
parent = "top"
entry = [{ publish = "log", value = "'enter right'" }]
exit = [{ publish = "log", value = "'exit right'" }]

[[state.transition]]
event = "again"
to = "right"

[[state.transition]]
event = "level"
if = "event.msg.data > 0.5"
to = "far"

[[state]]
name = "far"
entry = [{ publish = "log", value = "'enter far'" }]

[[state.transition]]
when = "inputs.level.data < 0.2"
to = "top"
