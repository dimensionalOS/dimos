# Patrol a route and go charge when the battery runs low.
# Shows conditions on a stream value (`battery_level`), an outer transition that interrupts everything inside it, `after`
# timers, and a list read through a var (`route[index]`).
root = "Mission"
resources = ["base"]

[constants]
route = ["lobby", "lab", "kitchen", "office"]
low_battery = 0.3
full_battery = 0.9
pause_s = 1.5

[vars]
index = 0

[[stream_value]]
name = "battery_level"
stream = "ToyRobot.battery"
field = "percentage"

[[activity]]
name = "drive"
start = "ToyRobot.drive_to"
cancel = "ToyRobot.stop_driving"
uses = ["base"]

[[activity]]
name = "charge"
start = "ToyRobot.start_charging"
cancel = "ToyRobot.stop_charging"

[[node]]
name = "Mission"
children = ["Patrolling", "Charging"]
initial = "Patrolling"

[[node]]
name = "Patrolling"
children = ["NextWaypoint", "Driving", "Pausing"]
initial = "NextWaypoint"

[[node.transition]]
if = "battery_level < low_battery"
goto = "Charging"

[[node]]
name = "NextWaypoint"

[[node.transition]]
if = "index < size(route)"
goto = "Driving"

[[node.transition]]
goto = "Driving"
set = { index = 0 }

[[node]]
name = "Driving"
activity = "drive"
args = { place = "route[index]" }

[[node.transition]]
on = "succeeded"
goto = "Pausing"
set = { index = "index + 1" }

[[node.transition]]
on = "failed"
goto = "Pausing"
set = { index = "index + 1" }

[[node]]
name = "Pausing"

[[node.transition]]
after = "pause_s"
goto = "NextWaypoint"

[[node]]
name = "Charging"
children = ["GoingHome", "OnCharger"]
initial = "GoingHome"
outcomes = ["done"]

[[node.transition]]
on = "done"
goto = "Patrolling"

[[node]]
name = "GoingHome"
activity = "drive"
args = { place = "'charger'" }

[[node.transition]]
on = "succeeded"
goto = "OnCharger"

[[node]]
name = "OnCharger"
activity = "charge"

[[node.transition]]
if = "battery_level >= full_battery"
goto = "done"
