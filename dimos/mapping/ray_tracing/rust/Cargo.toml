[package]
name = "dimos-voxel-ray-tracing"
version = "0.1.0"
edition = "2021"
description = "Native Rust voxel-map module with raycast clearing for dimos"
license = "Apache-2.0"

[lib]
name = "dimos_voxel_ray_tracing"
path = "src/lib.rs"

[[bin]]
name = "voxel_ray_tracing"
path = "src/main.rs"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "93ca305d24721f49bd30d580a8ec353619560744" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
arrayvec = "0.7"
rayon = "1"
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }
nalgebra = "0.35.0"

[workspace]
members = ["py"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
