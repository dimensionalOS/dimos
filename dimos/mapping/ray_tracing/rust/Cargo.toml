[package]
name = "dimos-voxel-ray-tracing"
version = "0.1.0"
edition = "2021"
description = "Native Rust voxel-map module with raycast clearing for dimos"
license = "Apache-2.0"

[lib]
# Must match the #[pymodule] fn name in python.rs.
name = "dimos_voxel_ray_tracing"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voxel_ray_tracing"
path = "src/main.rs"

# Registry entry read by `dimos bake` (graph + codegen) and cross-checked at
# compile time by #[module(name = "ray_tracing")].
[package.metadata.dimos.module.ray_tracing]
path = "dimos_voxel_ray_tracing::module::RayTracingVoxelMap"
python = "dimos.mapping.ray_tracing.module:RayTracingVoxelMap"
threads = 1

[package.metadata.dimos.module.ray_tracing.inputs]
lidar = "sensor_msgs.PointCloud2"
odometry = "nav_msgs.Odometry"

[package.metadata.dimos.module.ray_tracing.outputs]
global_map = "sensor_msgs.PointCloud2"
local_map = "sensor_msgs.PointCloud2"
region_bounds = "geometry_msgs.PoseStamped"

[features]
# pyo3 is only needed for the python extension module. `dimos bake` links this
# crate into a host binary with default-features off so no pyo3 objects (and
# their libpython symbols) reach a statically linked build.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
dimos-module = { path = "../../../../native/rust/dimos-module" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
arrayvec = "0.7"
rayon = "1"
tracing = "0.1"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.25", optional = true }
validator = { version = "0.20", features = ["derive"] }
nalgebra = "0.35.0"

[profile.release]
lto = "thin"
codegen-units = 1
