[package]
name = "dimos-voxel-ray-tracing-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the voxel ray tracing module"
license = "Apache-2.0"

[lib]
name = "dimos_voxel_ray_tracing_py"
crate-type = ["cdylib"]

[dependencies]
dimos-voxel-ray-tracing = { path = ".." }
numpy.workspace = true
pyo3.workspace = true
validator.workspace = true
