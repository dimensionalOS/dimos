[package]
name = "dimos-hyperspace"
version = "0.1.0"
edition = "2021"
description = "Open-vocabulary 3D semantic querying (Hyperspace) as a dimos native module"
license = "Apache-2.0"

[lib]
name = "dimos_hyperspace"
path = "src/lib.rs"

[[bin]]
name = "hyperspace"
path = "src/main.rs"

# Offline driver for the Python CLI: ingest an exported recording, run queries,
# print voxels as JSON. Not a module, so it is not in the registry below.
[[bin]]
name = "hyperspace_offline"
path = "src/bin/hyperspace_offline.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
# threads = 2 so a query never stalls frame ingest.
[package.metadata.dimos.module.hyperspace]
path = "dimos_hyperspace::module::Hyperspace"
python = "dimos.mapping.hyperspace.module:Hyperspace"
threads = 2

[package.metadata.dimos.module.hyperspace.inputs]
color_image = "sensor_msgs.Image"
depth_image = "sensor_msgs.Image"
camera_info = "sensor_msgs.CameraInfo"
depth_camera_info = "sensor_msgs.CameraInfo"
tf = "tf2_msgs.TFMessage"
query = "std_msgs.String"

[package.metadata.dimos.module.hyperspace.outputs]
query_result = "sensor_msgs.PointCloud2"
scene_map = "sensor_msgs.PointCloud2"

[dependencies]
hyperspace = { path = "hyperspace" }
dimos-module = { path = "../../../../native/rust/dimos-module" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nalgebra = "0.35.0"
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[features]
default = []
# Real models. Off by default so CI builds (and any GPU-less machine) get the
# stub backends and no model download.
siglip = ["hyperspace/siglip"]
depth2depth = ["hyperspace/depth2depth"]
cuda = ["hyperspace/cuda"]
cudnn = ["hyperspace/cudnn"]
