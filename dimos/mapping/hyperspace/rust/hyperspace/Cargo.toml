[package]
name = "hyperspace"
version = "0.1.0"
edition = "2021"
description = "Open-vocabulary 3D semantic querying over camera recordings"
license = "Apache-2.0"

# Vendored from github.com/jeff-hykin/hyperspace (see README.md in this directory).
# Library only: the upstream binaries, web viewer and export tools stay upstream.

[lib]
name = "hyperspace"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
half = { version = "2.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
depth2depth = { version = "0.2.2", optional = true }

[features]
default = []
# SigLIP2 on candle (CPU unless `cuda`).
siglip = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]
# Depth-Anything-V2 fused with the sensor depth (github.com/jeff-hykin/depth2depth).
depth2depth = ["dep:depth2depth", "dep:candle-core", "dep:candle-nn"]
cuda = ["siglip", "depth2depth", "candle-core/cuda", "candle-nn/cuda", "depth2depth/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "depth2depth/cudnn"]
