[package]
name = "dim-slam-module"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dim_slam"
path = "src/main.rs"

[dependencies]
# tag, not rev: nix's fetchGit only searches the ref the url names, so a bare rev is
# unfetchable. Cargo.lock still pins the exact commit.
dim_slam = { git = "https://github.com/dimensionalOS/dimSLAM", tag = "v0.4.1" }
# Unused directly, but cargo hands DEP_CUVSLAM_LIB_DIR only to immediate dependents
# and build.rs needs it for the rpath.
cu_vslam_rs = "0.2.0"
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "3a510eb7a6d59a4c983055c30142ad7c51c5717f" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
# native_config expands to ::serde and ::validator derives, so both must be direct deps.
serde = { version = "1", features = ["derive"] }
validator = { version = "0.21", features = ["derive"] }

[profile.release]
lto = true

[workspace]

# zenoh main at a fixed commit: 1.10.1 plus fixes no release has yet, e.g. the startup deadlock (eclipse-zenoh/zenoh issue 2581).
[patch.crates-io]
zenoh = { git = "https://github.com/eclipse-zenoh/zenoh", rev = "467f138d26533079d010597136aadacc00dac49b" }
