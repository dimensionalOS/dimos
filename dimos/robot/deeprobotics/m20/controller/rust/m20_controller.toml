    { src = "gait", field = "sign", scale = 1.0 },
    { src = "gait", field = "remaining", scale = 5.0 },
    { src = "foot", leg = 0, axis = "x" },
    { src = "foot", leg = 0, axis = "y" },
    { src = "foot", leg = 1, axis = "x" },
    { src = "foot", leg = 1, axis = "y" },
    { src = "foot", leg = 2, axis = "x" },
    { src = "foot", leg = 2, axis = "y" },
