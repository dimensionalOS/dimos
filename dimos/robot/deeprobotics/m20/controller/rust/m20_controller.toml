# M20 motor controller configuration: the rl_deploy v1.5.8 pipeline as decoded (see
# dimos/simulation/m20_policy_sim/SPEC.md). Read by the Rust controller and by the Python reference sim.
# Joint order everywhere ("robot order"): fl, fr, hl, hr x (hipx, hipy, knee, wheel); index = leg * 4 + joint.
# A 4-element per-joint array is tiled over the 4 legs; a 1-element array is broadcast.

[robot]
joint_names = [
    "fl_hipx_joint", "fl_hipy_joint", "fl_knee_joint", "fl_wheel_joint",
    "fr_hipx_joint", "fr_hipy_joint", "fr_knee_joint", "fr_wheel_joint",
    "hl_hipx_joint", "hl_hipy_joint", "hl_knee_joint", "hl_wheel_joint",
    "hr_hipx_joint", "hr_hipy_joint", "hr_knee_joint", "hr_wheel_joint",
]
# position limits (rad), rl_deploy PolicyRunnerBase == the vendor MJCF ranges; wheels unlimited
joint_lower = [
    -0.436, -2.286, -2.809, -1e9,
    -0.611, -2.286, -2.809, -1e9,
    -0.436, -2.583, -2.792, -1e9,
    -0.611, -2.583, -2.792, -1e9,
]
joint_upper = [
    0.611, 2.583, 2.792, 1e9,
    0.436, 2.583, 2.792, 1e9,
    0.611, 2.286, 2.809, 1e9,
    0.436, 2.286, 2.809, 1e9,
]
# policy hipx targets are clamped to mid +- this fraction of the half range
hipx_limit_fraction = 0.75
# wheel velocity target clamp (rad/s)
wheel_velocity_limit = 79.3
# motor torque limit (N m)
torque_limit = [76.4, 76.4, 76.4, 21.6]
# front-leg (hipx, hipy, knee) range the stand-up / lie-down IK clamps to before mirroring (rl_deploy ControlParameters;
# IK(0.03 m) lands on the knee's 2.793)
ik_lower = [-0.4363, -2.2864, -2.81]
ik_upper = [0.6109, 2.583, 2.793]
# thigh and shank length (m), for the stand-up / lie-down height IK
thigh_length = 0.25
shank_length = 0.25

[timing]
# motor command loop rate
control_hz = 1000
# control ticks per policy step (50 Hz)
policy_decimation = 20

# the 1 kHz loop and the policy thread each own an isolated A76 core (AOS isolcpus 0,4-7) at SCHED_FIFO; the
# controller refuses to run unless both are placed and confirmed (a 20 ms bus gap off a shared core faults the stand)
[realtime]
control_cpu = 4
control_fifo_priority = 80
policy_cpu = 5
policy_fifo_priority = 70

[safety]
# no faults are raised for this long after start (rl_deploy SafeController grace)
startup_grace_s = 1.0
# no fresh hardware / IMU state for this long -> fault (joint damping)
state_timeout_s = 0.02
# no operator command for this long -> velocity axes zeroed (the state is kept)
command_timeout_s = 0.15
# a joint this far beyond its range -> fault
joint_limit_margin_rad = 0.1
# joint-damping ticks sent on shutdown before the controller exits
shutdown_damping_ticks = 500

# rl_deploy's states (decoded from v1.5.8, see SPEC.md). Gains: 4-element arrays are (hipx, hipy, knee, wheel) per leg.
[states.enable]
# rl_deploy's SetJointEnable() x3: on entering these states the first `ticks` frames are all zero with the enable
# control word ([ecan] enable_control_word); the state's own clock already runs (seen on the robot)
ticks = 3
on_enter = ["stand_up", "lie_down", "rl_control", "start_damping"]

[states.passive]
# Idle: all-zero command (motors limp)
kp = [0.0]
kd = [0.0]
# stand-up is accepted only this long after start
min_s_before_stand = 2.0
max_tilt_deg = 20.0

[states.start_damping]
# rl_deploy's state after a (re)start until stand-up (it leaves it like passive does). Captured on the robot
# (2026-11-20, 17:22 and 18:17 restarts, from 23 s after entry): all-zero commands; the disassembly suggested
# kd = 0.5 x damping, which the bus never showed
kp = [0.0]
kd = [0.0]

[states.joint_damping]
kp = [0.0]
kd = [4.0, 4.0, 4.0, 1.0]
# back to passive after this long, or at once when the operator asks for anything else (and no fault is active)
min_s = 2.0

[states.stand_up]
kp = [200.0, 200.0, 200.0, 0.0]
kd = [4.0, 4.0, 4.0, 2.0]
# phase 1: per-joint cubic from the current pose to the leg-IK pose for crouch_height; phase 2: cubic height ramp
# crouch_height -> stand_height through the IK; each phase lasts phase_s; leaving is allowed after both
crouch_height = 0.12
stand_height = 0.38
phase_s = 1.5
hipx = 0.0
max_tilt_deg = 45.0

[states.lie_down]
kp = [300.0, 300.0, 300.0, 0.0]
kd = [4.5, 4.5, 4.5, 2.0]
# cubic to the leg-IK pose for lie_height over phase_s, then damping only for phase_s, then all zero
lie_height = 0.03
phase_s = 2.0
hipx = 0.0

[states.rl_control]
# gait codes accepted on entry; others become entry_fallback_gait ("protect to basic flat gait")
entry_gaits = [0x1001, 0x3001, 0x3004, 0xf003]
entry_fallback_gait = 0x1001
# runner for gait codes no runner lists (rl_deploy's default branch)
fallback_runner = "basic_flat"
max_roll_deg = 45.0
max_pitch_deg = 65.0

# a stand policy runs first when rl_control starts on these gaits (and, with on_switch, whenever the gait changes to
# them): first_s on the first rl_control entry, later_s after; then settle_s with settle_params; then the gait's runner
# BasicFlat's is the decoded 3 s + 0.5 s (a fresh rl_deploy's first entry, robot 16:37); one later entry (14:17) ran
# 6.14 s, mode 0 for 3 s: what stretches it then is unknown
[[states.rl_control.stand_in]]
gait = 0x1001
runner = "six_axis_stand"
on_entry = true
on_switch = false
first_s = 3.0
later_s = 1.5
params = { mode = 0.0 }
settle_s = 0.5
settle_params = { mode = -1.0 }

# switching to NaviCharge runs the stand policy 1.5 s first; entering rl_control on NaviCharge does not (robot, 2026-11-20)
[[states.rl_control.stand_in]]
gait = 0x3001
runner = "six_axis_stand"
on_entry = false
on_switch = true
first_s = 1.5
later_s = 1.5
params = { mode = -1.0 }
settle_s = 0.0
settle_params = {}

# ---------------------------------------------------------------------------------------------------------------
# Policy runners. real_steer_divisor: a metric velocity command (/REAL_STEER, /NAV_CMD; m/s, rad/s) becomes the
# normalized axes by dividing by it, per gait as rl_deploy's HandlerVel does (Extre uses 0x2001 Move's; 0x2002-0x2004
# divide by (2, 1, 2); the stand runners and "other" gaits (2, 0.4, 0.6)).
# kind "frames": network input [current frame, `history` past frames oldest->newest]; kind
# "sequence": state [1, 36, frame] (oldest first), plus `command` and `uncertain` inputs.
# obs blocks (in order): gyro, gravity, accel, command, constant, phase, joint_pos, joint_vel, last_action,
# height_map. joints: legs_by_type (hipx x4, hipy x4, knee x4), legs_per_leg, wheels, all_per_leg.
# action layout: legs_by_type_then_wheels (12 + 4) or per_leg (interleaved 16); leg_mode offset (default + scale * a)
# or absolute (the ONNX already outputs the target).

[runners.basic_flat]
gaits = [0x1001]
policy = "policy_m20_50.onnx"
kind = "frames"
history = 5
frame = 53
default_pose = [-0.1, -0.8, 1.6, 0.0, 0.1, -0.8, 1.6, 0.0, -0.1, 0.8, -1.6, 0.0, 0.1, 0.8, -1.6, 0.0]
kp = [80.0, 80.0, 80.0, 0.0]
kd = [6.0, 6.0, 6.0, 0.6]
command_max = [2.0, 1.0, 2.0]
# the decoded HandlerVel table says (2, 0.8, 1.5) for 0x1001, but /NAV_CMD replays against the robot match (2, 1, 2)
real_steer_divisor = [2.0, 1.0, 2.0]
command_slew = [0.025, 0.025, 0.04]
# |wz| clamped to this while vx > wz_clamp_above_vx
wz_clamp = 0.8
wz_clamp_above_vx = 1.0
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "joint_pos", joints = "legs_by_type", relative = true },
    { kind = "joint_vel", joints = "legs_by_type", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.05] },
    { kind = "last_action" },
]
action = { layout = "legs_by_type_then_wheels", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.basic_plat]
gaits = [0x1002]
policy = "policy_ca9bplatform.onnx"
max_pitch_deg = 90.0
kind = "frames"
history = 5
frame = 53
default_pose = [0.1, -0.6, 1.05, 0.0, -0.1, -0.6, 1.05, 0.0, 0.1, 0.6, -1.05, 0.0, -0.1, 0.6, -1.05, 0.0]
kp = [80.0, 100.0, 100.0, 0.0]
kd = [2.5, 2.5, 2.5, 2.0]
command_max = [1.5, 0.5, 1.5]
real_steer_divisor = [1.5, 0.5, 1.5]
