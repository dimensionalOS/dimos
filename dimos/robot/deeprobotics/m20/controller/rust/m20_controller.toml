# M20 motor controller configuration: the rl_deploy v1.5.8 pipeline as decoded (see
# dimos/simulation/m20_policy_sim/SPEC.md). Read by the Rust controller and by the Python reference sim.
# Joint order everywhere ("robot order"): fl, fr, hl, hr x (hipx, hipy, knee, wheel); index = leg * 4 + joint.
# A 4-element per-joint array is tiled over the 4 legs; a 1-element array is broadcast.

[robot]
joint_names = [
    "fl_hipx_joint", "fl_hipy_joint", "fl_knee_joint", "fl_wheel_joint",
    "fr_hipx_joint", "fr_hipy_joint", "fr_knee_joint", "fr_wheel_joint",
    "hl_hipx_joint", "hl_hipy_joint", "hl_knee_joint", "hl_wheel_joint",
    "hr_hipx_joint", "hr_hipy_joint", "hr_knee_joint", "hr_wheel_joint",
]
# position limits (rad), rl_deploy PolicyRunnerBase == the vendor MJCF ranges; wheels unlimited
joint_lower = [
    -0.436, -2.286, -2.809, -1e9,
    -0.611, -2.286, -2.809, -1e9,
    -0.436, -2.583, -2.792, -1e9,
    -0.611, -2.583, -2.792, -1e9,
]
joint_upper = [
    0.611, 2.583, 2.792, 1e9,
    0.436, 2.583, 2.792, 1e9,
    0.611, 2.286, 2.809, 1e9,
    0.436, 2.286, 2.809, 1e9,
]
# rl_deploy's policy target clamp (PolicyRunnerBase::limit_goal_pos_vel, after every runner's step; its compiled-in
# f32 ranges, which hold for every runner): hipx and wheel-velocity targets to [policy_limit_lower,
# policy_limit_upper], hipx's widened by policy_hipx_widen of its width at each end (f32(1.25 lo - 0.25 hi) ..
# f32(1.25 hi - 0.25 lo)): fl hipx -0.698 .. 0.873 rad (robot 2026-11-20: rl_deploy sent fl hipx 0.628, past the joint
# range and within this); hipy and knee to the range as is; wheels +-79.3 rad/s
policy_limit_lower = [
    -0.43633198738098145, -2.286400079727173, -2.809999942779541, -79.30000305175781,
    -0.6108649969100952, -2.286400079727173, -2.809999942779541, -79.30000305175781,
    -0.43633198738098145, -2.5829999446868896, -2.7929999828338623, -79.30000305175781,
    -0.6108649969100952, -2.5829999446868896, -2.7929999828338623, -79.30000305175781,
]
policy_limit_upper = [
    0.6108649969100952, 2.5829999446868896, 2.7929999828338623, 79.30000305175781,
    0.43633198738098145, 2.5829999446868896, 2.7929999828338623, 79.30000305175781,
    0.6108649969100952, 2.286400079727173, 2.809999942779541, 79.30000305175781,
    0.43633198738098145, 2.286400079727173, 2.809999942779541, 79.30000305175781,
]
policy_hipx_widen = 0.25
# false: no clamp at all (not rl_deploy's)
policy_target_clamp = true
# motor torque limit (N m)
torque_limit = [76.4, 76.4, 76.4, 21.6]
# front-leg (hipx, hipy, knee) range the stand-up / lie-down IK clamps to before mirroring (rl_deploy ControlParameters;
# IK(0.03 m) lands on the knee's 2.793)
ik_lower = [-0.4363, -2.2864, -2.81]
ik_upper = [0.6109, 2.583, 2.793]
# thigh and shank length (m), for the stand-up / lie-down height IK
thigh_length = 0.25
shank_length = 0.25
# ControlParameters::GenerateM20Parameters 0x974b8: +8, the hip's lateral offset; GetBodyHeight's MotionInfo height
hip_offset = 0.10075
# GetBodyHeight 0x170cc0: DAT_001e1b90, added to the shank (the wheel radius)
motion_height_wheel = 0.09

[timing]
# motor command loop rate
control_hz = 1000
# control ticks per policy step (50 Hz)
policy_decimation = 20
# stand-up / lie-down splines and their 3 s / 4 s limits on rl_deploy's clock: f32(stamp) - f32(stamp at entry), the
# stamp being seconds since the bus opened (rl_deploy: since it started), so the targets step at that f32's resolution
# (under 1 ms for 4.5 h, 15.6 ms from 1.5 days; robot 2026-11-24). false: control ticks
f32_state_clock = true
# ours (rl_deploy: false): the stand / StepMove gait clocks' f32 step counter restarts at each period's wrap; rl_deploy's
# grows while it stands until at 2^24 steps (93 h in one gait) +1 is lost and the gait clock freezes
gait_clock_wrap = true
# rl_deploy's f32 is seconds since it started, so its splines step 1/64 s after 1.5 days and 1/16 s after 6 (its
# stand-up / lie-down stutter until a restart; up 11.2 days on 2026-11-17). false: the f32 counts from the state's entry
f32_state_clock_from_start = false

# the 1 kHz loop and the policy thread each own an isolated A76 core (AOS isolcpus 0,4-7) at SCHED_FIFO; the
# controller refuses to run unless both are placed and confirmed (a 20 ms bus gap off a shared core faults the stand)
[realtime]
control_cpu = 4
control_fifo_priority = 80
policy_cpu = 5
policy_fifo_priority = 70

[safety]
# no operator command for this long -> velocity axes zeroed (the state is kept): rl_deploy's MonitorSteer checks
# IsUpdate(150 ms) every 10 ms, so its zeroing lands 150-160 ms after the last sample (recordings: from 155 ms)
command_timeout_s = 0.155
# joint-damping ticks sent on shutdown before the controller exits
shutdown_damping_ticks = 500
# ours, on exit: stand-up 3 s + the 0x1001 stand-in 3.5 s (no lie-down in either) + lie-down 4 s, rounded up
shutdown_lie_down_max_s = 11.0
# ours (rl_deploy: false): a NaN / inf axis, velocity or param from the operator is 0 (a param: ignored) and axes are
# clipped to [-1, 1] on receipt; rl_deploy clips the axes in the runner, where a NaN survives into the policy
finite_commands = true
# ours (rl_deploy: none): runners with no command_slew of their own get basic_stair's (bin M20BasicStairRunner ctor), so
# an axis jumping from +1 to -1 ramps over 25 policy steps (sim matrix: basic_plat tipped 51 deg on that reversal)
default_command_slew = [0.04, 0.04, 0.08]
# ours (rl_deploy: each runner's command_max alone): every runner's command clamped to basic_server.toml's navigation
# limits (the fastest maxSpeedX 2.0, [Nav.COMMON] maxSpeedY 1.0, maxTheta 1.0): at the full axes (1, -1, 1) extre
# (3 m/s, 2 rad/s) and step_move stepped 1.6-1.9 rad and saturated in the sim
command_limit = [2.0, 1.0, 1.0]
# ours (rl_deploy: only a status bit past 20 ms, SafeController's IMU check): a fault when the newest IMU sample is
# older than 5 policy periods (the policies run that long on one gravity reading; a late DDS sample alone is not one)
imu_timeout_s = 0.1
# ours (rl_deploy: none): a fault after this many motor-board replies missed in a row, PubMotionStatus's "joint data
# not updated for 50 ms" (关节数据50ms未更新) at 1 kHz
missed_replies = 50
# ours (rl_deploy: none): a policy fault after this many policy periods (20 ms) with no result; the robot's worker
# answers within a tick or two
policy_missed_steps = 5

# rl_deploy's states (decoded from v1.5.8, see SPEC.md). Gains: 4-element arrays are (hipx, hipy, knee, wheel) per leg.
[states.enable]
# rl_deploy's SetJointEnable() x3: on entering these states the first `ticks` frames are all zero with the enable
# control word ([ecan] enable_control_word); the state's own clock already runs (seen on the robot)
ticks = 3
on_enter = ["stand_up", "lie_down", "rl_control", "start_damping"]

[states.passive]
# Idle: all-zero command (motors limp)
kp = [0.0]
kd = [0.0]
# stand-up is accepted only this long after start
min_s_before_stand = 2.0

[states.start_damping]
# rl_deploy's state after a (re)start until stand-up (it leaves it like passive does). Captured on the robot
# (2026-11-20, 17:22 and 18:17 restarts, from 23 s after entry): all-zero commands; the disassembly suggested
# kd = 0.5 x damping, which the bus never showed
kp = [0.0]
kd = [0.0]

[states.joint_damping]
kp = [0.0]
kd = [4.0, 4.0, 4.0, 1.0]
# back to passive after this long, or at once when the operator asks for anything else (and no fault is active)
min_s = 2.0
# ours (rl_deploy: false, damping at once): a fault the motors can still act on (tilt, temperatures, joint data, the
# policy) stops and lies the robot down as a lie-down does, then damps; a driver status-word fault damps at once.
# The sim matrix: damping at once from strafing tipped basic_flat, basic_plat and basic_stair over
lie_down_first = true
# ours (rl_deploy: false): the operator's joint damping (motion 2) lies down first too; the hardware e-stop is not this
lie_down_first_on_command = true
# ours: a fault in what a stop reads (the joint data, the IMU, the motor board's replies, the policy, the tilt) lies down
# at once, no stop first; false: damps at once
sensor_fault_lies_down = true

[states.stand_up]
kp = [200.0, 200.0, 200.0, 0.0]
kd = [4.0, 4.0, 4.0, 2.0]
# ours (rl_deploy: false, its start-up state sends all-zero gains): a controller that starts with the legs above
# crouch_height (a restart while the motors still hold a stand) lies them down from where they are, then the usual states
lie_down_at_start_when_up = true
# phase 1: per-joint cubic from the current pose to the leg-IK pose for crouch_height; phase 2: cubic height ramp
# crouch_height -> stand_height through the IK; each phase lasts phase_s; leaving is allowed after both
crouch_height = 0.12
stand_height = 0.38
phase_s = 1.5
hipx = 0.0

[states.lie_down]
kp = [300.0, 300.0, 300.0, 0.0]
kd = [4.5, 4.5, 4.5, 2.0]
# cubic to the leg-IK pose for lie_height over phase_s, then damping only for phase_s, then all zero
lie_height = 0.03
phase_s = 2.0
hipx = 0.0

[states.rl_control]
# gait codes accepted on entry; others become entry_fallback_gait ("protect to basic flat gait")
entry_gaits = [0x1001, 0x3001, 0x3004, 0xf003]
entry_fallback_gait = 0x1001
# runner for gait codes no runner lists (rl_deploy's default branch)
fallback_runner = "basic_flat"
# update_policy_ptr (0x179960): a gait switch waits until normalized |vx| + |vy| + |wz| is below DAT_001e1ba8
switch_below_speed = 0.01
# RLControlState::Run on basic_flat: a hot standstill (still_ticks, above rest_c) runs the 0xf001 stand-in once
overheat = { rest_c = 70.0, abort_motor_c = 100.0, abort_driver_c = 90.0, still_ticks = 1000, still_body_speed = 0.08 }

# ours (rl_deploy: none): at a zero operator and ramped command the policies' wheel targets carry a common-mode bias
# (sim: basic_stair +0.04 m/s, navi_orienteer +0.06, basic_backknee +0.09, navi_flat +0.03), so the robot creeps; its
# mean is subtracted (the differential stays for balance), and with hold_kp > 0 the wheels are held where they were
[states.rl_control.zero_command]
cancel_wheel_drift = true
hold_kp = 0.0

# a stand policy runs first when rl_control starts on these gaits (and, with on_switch, whenever the gait changes to
# them): first_s on the first rl_control entry, later_s after; then settle_s with settle_params; then the gait's runner
# BasicFlat's is the decoded 3 s + 0.5 s (a fresh rl_deploy's first entry, robot 16:37); one later entry (14:17) ran
# 6.14 s, mode 0 for 3 s: what stretches it then is unknown
[[states.rl_control.stand_in]]
gait = 0x1001
runner = "six_axis_stand"
on_entry = true
on_switch = false
first_s = 3.0
later_s = 1.5
# rl_deploy's first phase (0x144 = 1) clears the mode byte at the switch; the second sets it; both fix the feet
params = { mode_byte = 0.0, feet_fixed = 1.0, warm_hold = 1.0 }
settle_s = 0.5
settle_params = { mode_byte = 1.0, feet_fixed = 1.0, warm_hold = 0.0 }

# switching to NaviCharge runs the stand policy 1.5 s first; entering rl_control on NaviCharge does not (robot, 2026-11-20)
[[states.rl_control.stand_in]]
gait = 0x3001
runner = "six_axis_stand"
on_entry = false
on_switch = true
first_s = 1.5
later_s = 1.5
# the switch clears the mode byte (0x148 = 1) and the feet move freely
params = { mode_byte = 0.0, feet_fixed = 0.0, warm_hold = 0.0 }
settle_s = 0.0
settle_params = {}

# ours, not rl_deploy's (ROBUSTNESS.md; remove the table for rl_deploy's switch): the runner switches the sim matrix
# (tests/robustness.rs) showed upsetting the robot run `bridge` first, the stand policy rl_deploy itself runs before
# NaviCharge; then every runner switch blends the leg targets from the last command over blend_s
[states.rl_control.safe_switch]
# (from, to), "*" any: basic_flat's tall stance is outside navi_flat's distribution (SPEC "switch: basic_flat ->
# navi_flat", the robot faulted at hr_hipy -2.688) and navi_orienteer's (sim: 2 rad target jump, 7 rad/s); basic_backknee's hind knees bend the other way from every other
# runner's, so its switches swing the hind legs through; height_gap's stance (sim) is far from the rest; step_move
# steps from its first step (navi_flat -> step_move after strafing jumped 1.6 rad)
bridge_pairs = [
    ["basic_flat", "navi_flat"],
    ["basic_flat", "navi_orienteer"],
    ["basic_backknee", "*"],
    ["*", "basic_backknee"],
    ["height_gap", "*"],
    ["*", "height_gap"],
    ["*", "step_move"],
]
# the 0x3001 switch's stand-in above, as is
bridge = { gait = 0, runner = "six_axis_stand", on_entry = false, on_switch = true, first_s = 1.5, later_s = 1.5, params = { mode_byte = 0.0, feet_fixed = 0.0, warm_hold = 0.0 }, settle_s = 0.0, settle_params = {} }
# sim matrix: rl_deploy's first-step jumps at a switch reach 1.0-1.4 rad (basic_flat -> extre 1.25); 0.1 s (5 policy
# steps) takes them under the walking runners' own 0.6 rad per step
blend_s = 0.1
# a switch (rl_deploy: once the command is still) also waits for the body: in the sim matrix switching to a stand gait
# (0x3001's stand-in, 0x3004, 0xf001, 0xf002, extre) while still rolling at 1-2 m/s fell; standing in any runner the
# sim's wheels' mean rim speed stays under 0.05 m/s and the body under 0.3 rad/s at least a tick at a time (step_move
# steps in place: its legs and single wheels never stop). Wheel radius: GetBodyHeight's 0.09
still = { wheel_radius_m = 0.09, wheel_m_s = 0.1, gyro_rad_s = 0.5 }
# rl_deploy lies down at once: from 1-2 m/s that tipped extre, navi_flat, basic_plat and step_move over in the sim;
# ours zeroes the command and lies once still
lie_down_when_still = true
# a lie-down also waits for every leg joint under this (rad/s): basic_plat lay down mid-step after strafing and fell;
# standing, the sim's legs stay under 0.3 rad/s. Or it lies once the wheels stop slowing with the policy's command at
# zero (a slope it cannot stop on), checked once per policy step
lie_leg_rad_s = 0.5
# where the robot cannot stop (a slope, height_gap's 0.15 m/s drift at a zero command in the sim) a switch or lie-down
# goes ahead once the wheels stop slowing under this: height_gap lay down still decelerating from 2 m/s and fell
settle_below_m_s = 0.3
# stopping in the sim the wheels slow at 1-3.5 m/s^2; height_gap's drift fades at 0.05 m/s^2 and never ends
settle_decel_m_s2 = 0.2
# runners that step in place at a zero command stand on the bridge before lying (step_move tipped over lying mid-step)
lie_bridge_from = ["step_move"]
# rl_deploy loses a gait sent during a stand-in (SPEC; M20Connection resends): a 0x3001 sent between two others, or a
# gait spam ending on one, left the sim robot on navi_charge; ours switches to the last gait sent once the stand-in ends
keep_gait_during_stand_in = true

# ---------------------------------------------------------------------------------------------------------------
# Policy runners (a metric velocity command becomes the normalized axes by [real_steer], per commanded gait).
# kind "frames": network input [current frame, `history` past frames oldest->newest]; kind
# "sequence": state [1, 36, frame] (oldest first), plus `command` and `uncertain` inputs.
# obs blocks (in order): gyro, gravity, accel, command, constant, phase, joint_pos, joint_vel, last_action,
# height_map. joints: legs_by_type (hipx x4, hipy x4, knee x4), legs_per_leg, wheels, all_per_leg.
# action layout: legs_by_type_then_wheels (12 + 4) or per_leg (interleaved 16); leg_mode offset (default + scale * a)
# or absolute (the ONNX already outputs the target).

[runners.basic_flat]
gaits = [0x1001]
policy = "policy_m20_50.onnx"
kind = "frames"
history = 5
frame = 53
default_pose = [-0.1, -0.8, 1.6, 0.0, 0.1, -0.8, 1.6, 0.0, -0.1, 0.8, -1.6, 0.0, 0.1, 0.8, -1.6, 0.0]
kp = [80.0, 80.0, 80.0, 0.0]
kd = [6.0, 6.0, 6.0, 0.6]
command_max = [2.0, 1.0, 2.0]
# ours: under safety.command_limit, vy at rl_deploy's own 0x1001 HandlerVel maximum (0.8, [real_steer]): at (-1, -1, -1)
# basic_flat stepped 1.7 rad in the sim with vy 1.0
command_limit = [2.0, 0.8, 1.0]
# the decoded HandlerVel table says (2, 0.8, 1.5) for 0x1001, but /NAV_CMD replays against the robot match (2, 1, 2)
# bin M20BasicFlatRunner ctor (0x54..0x5c): limit_cmd_vel's per-step slew in normalized axes, before command_max
command_slew = [0.025, 0.025, 0.04]
# |wz| clamped to this while vx > wz_clamp_above_vx
wz_clamp = 0.8
wz_clamp_above_vx = 1.0
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "joint_pos", joints = "legs_by_type", relative = true },
    { kind = "joint_vel", joints = "legs_by_type", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.05] },
    { kind = "last_action" },
]
action = { layout = "legs_by_type_then_wheels", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.basic_plat]
gaits = [0x1002]
policy = "policy_ca9bplatform.onnx"
kind = "frames"
history = 5
frame = 53
default_pose = [0.1, -0.6, 1.05, 0.0, -0.1, -0.6, 1.05, 0.0, 0.1, 0.6, -1.05, 0.0, -0.1, 0.6, -1.05, 0.0]
kp = [80.0, 100.0, 100.0, 0.0]
kd = [2.5, 2.5, 2.5, 2.0]
command_max = [1.5, 0.5, 1.5]
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "joint_pos", joints = "legs_per_leg", relative = true },
    { kind = "joint_vel", joints = "legs_per_leg", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.01] },
    { kind = "last_action" },
]
action = { layout = "per_leg", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.basic_stair]
gaits = [0x1003, 0x3003]
policy = "policy_m20_5.onnx"
kind = "frames"
history = 5
frame = 53
default_pose = [-0.1, -0.8, 1.6, 0.0, 0.1, -0.8, 1.6, 0.0, -0.1, 0.8, -1.6, 0.0, 0.1, 0.8, -1.6, 0.0]
kp = [80.0, 80.0, 80.0, 0.0]
kd = [3.0, 3.0, 3.0, 0.6]
command_max = [2.0, 1.0, 2.0]
# bin M20BasicStairRunner ctor (0x54..0x5c): limit_cmd_vel's per-step slew in normalized axes, before command_max
command_slew = [0.04, 0.04, 0.08]
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "joint_pos", joints = "legs_by_type", relative = true },
    { kind = "joint_vel", joints = "legs_by_type", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.05] },
    { kind = "last_action" },
]
action = { layout = "legs_by_type_then_wheels", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.basic_backknee]
gaits = [0x1004]
policy = "policy_m20_backknee6.onnx"
kind = "frames"
history = 5
frame = 53
default_pose = [-0.1, -0.8, 1.6, 0.0, 0.1, -0.8, 1.6, 0.0, -0.1, -0.8, 1.6, 0.0, 0.1, -0.8, 1.6, 0.0]
kp = [80.0, 80.0, 80.0, 0.0]
kd = [3.0, 3.0, 3.0, 0.6]
command_max = [2.0, 0.8, 1.5]
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "joint_pos", joints = "legs_by_type", relative = true },
    { kind = "joint_vel", joints = "legs_by_type", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.05] },
    { kind = "last_action" },
]
action = { layout = "legs_by_type_then_wheels", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.navi_charge]
gaits = [0x3001]
policy = "m20_navi_charge_v8_0_isaaclab.onnx"
# leg kp / kd x start_gain_scale for the first start_gain_steps policy steps (wheels unscaled; seen on the robot)
start_gain_scale = 1.3
start_gain_steps = 29
kind = "frames"
history = 5
frame = 60
default_pose = [0.0, -0.8, 1.6, 0.0, 0.0, -0.8, 1.6, 0.0, 0.0, 0.8, -1.6, 0.0, 0.0, 0.8, -1.6, 0.0]
kp = [60.0, 60.0, 60.0, 0.0]
kd = [1.5, 1.5, 1.5, 0.6]
command_max = [0.5, 0.3, 0.5]
obs = [
    { kind = "gyro", scale = [0.25] },
    { kind = "gravity" },
    { kind = "command", scale = [1.0, 1.0, 0.25] },
    { kind = "phase", frequency = 1.5 },
    { kind = "constant", values = [1.5, 0.5, 0.0, 0.0, 0.5] },
    { kind = "joint_pos", joints = "legs_by_type", relative = true },
    { kind = "joint_vel", joints = "legs_by_type", scale = [0.05] },
    { kind = "joint_vel", joints = "wheels", scale = [0.01] },
    { kind = "last_action" },
]
action = { layout = "legs_by_type_then_wheels", clip = 100.0, leg_mode = "offset", leg_scale = [0.25], wheel_scale = 10.0 }

[runners.navi_flat]
gaits = [0x3002]
policy = "m20_navi_flat_v4_2.onnx"
kind = "frames"
history = 5
frame = 54
default_pose = [0.0, -0.8, 1.6, 0.0, 0.0, -0.8, 1.6, 0.0, 0.0, 0.8, -1.6, 0.0, 0.0, 0.8, -1.6, 0.0]
kp = [60.0, 60.0, 60.0, 0.0]
kd = [1.5, 1.5, 1.5, 0.6]
