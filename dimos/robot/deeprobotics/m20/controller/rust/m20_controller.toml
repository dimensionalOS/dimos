# ---------------------------------------------------------------------------------------------------------------
# Docking (src/dock): DeepRobotics charge_manager v4.0.30 and reflective_column_node (NOS
# /opt/robot/share/charge_manager/bin), decompiled. Their config file, charge_manager.toml, is read at startup (src/dock/
# vendor.rs; module config charge_manager_toml); only what the binaries compile in is here. "bin:" = the binary (function
# / address), "rl_deploy:" = rl_deploy's /STEER handling (SPEC.md [C], m20_policy_sim/replay.py), "driver:" = NOS
# /opt/robot/share/node_driver/config/config.yaml, "recording:" / "sim:" = measured here, not the vendor's.
[dock.detector]
# reflective_column_node's numbers, per ProcessPointCloudData step, in the float type it compares in. driver: the front
# Airy's x y z, roll pitch yaw (rs_driver's RSTransformParam floats; its DIFOP angles are 0); the node reads /LIDAR/POINTS
# already in base_link
driver_xyz = [0.32028, 0.0, -0.013]
driver_rpy = [0.0, -1.57079, -3.14159]
# bin ReciAndTransformPoints: intensity > (float)230 (Location ctor +0xac = 0xe6), (double)x > 0.4 (0x17f7f0), x < 4.0f,
# |y| < 2.0f, -1.1 (0x17f818) < (double)z < 0.1 (0x17f808), |(double)atan2f(y, x)| <= pi/4 (0x17f820)
min_intensity = 230.0
x_min = 0.4
x_max = 4.0
y_max = 2.0
z_min = -1.1
z_max = 0.1
half_angle_rad = 0.7853981633974483
# bin ProcessPointCloudData: VoxelGrid setLeafSize(0.01f, 0.01f, 0.01f) (0x17f828, 0x3c23d70a); then, on 20 points or
# more (size > 0x13f bytes), RadiusOutlierRemoval radius 0.3f (ctor +0xb0 = 0x3e99999a), min neighbours 15 (+0xb4 = 0xf)
voxel_leaf = 0.01
outlier_min_cloud = 20
outlier_radius = 0.3
outlier_min_neighbors = 15
# bin PointsCloudClustering(cloud, clusters, 0.05f, 30): EuclideanClusterExtraction tolerance 0.05, 30 to 20000 points
# (0x4e20), on a sorted KdTree (KdTree(true))
cluster_tolerance = 0.05
cluster_min = 30
cluster_max = 20000
# bin FilterReflectiveColumn: |z extent| / |y extent| > 1.8f (0x3fe66666)
column_min_ratio = 1.8
# bin FindTargetRefleColu: |sqrtf(centroid distance) - 0.4| (0x17f7f0) < 0.18 (0x17f800), 60 < |angle deg| < 120
# (immediates), the best pair taken below 0.1 (0x17f808)
post_spacing = 0.4
spacing_tolerance = 0.18
pair_angle_deg = [60.0, 120.0]
pair_max_off = 0.1
# bin FilterOutSuctionPoints: x < centroid x, |y - centroid y| < 0.02 (0x17f7e0), |z - centroid z| < 0.08 (0x17f7e8)
suction_y = 0.02
suction_z = 0.08
# bin CalculateCenter: centre x = centroid x + 0.045 (0x17f7d0) x sinf|atan2f(x, y)| (an FMA), y = centroid y
center_push = 0.045

[dock.filter]
# bin reflective_column_node ProcessPointCloudData: the lidar position kept only for x in [-4, -0.05] (0x17f830) and
# |y| <= 1.5, and pubPose adds 0.76 (0x17f7d8, f32) to x
x_range = [-4.0, -0.05]
max_y = 1.5
pose_offset_x = 0.7599999904632568
# bin: the first 15 positions after the service's start (Location ctor 0x110 = 0xf) go to FilterPositionData (the last
# within 3 sigma of their mean); then a position more than 0.8 m (0x17f838) from the one before is not published
start_sweeps = 15
start_sigmas = 3.0
max_jump_m = 0.8

[dock.obstacle]
# driver: min_distance 0.2 on both Airys (the obstacle check reads the driver's merged /LIDAR/POINTS)
min_lidar_range_m = 0.2
# sim (world.py WHEEL_RADIUS): ObstacleDetection takes MotionInfo.height (rl_deploy's, not decoded); ours is base_link
# above the wheel axles from the joints plus this
wheel_radius_m = 0.09
# ours: the body height crosses to the detector module (NOS) when it moves this far (m), not every 1 kHz tick
body_height_step_m = 0.0005

[dock.sequence]
# bin: WideWalk "Enable Charge Gait" 0x3001, setFineTuneStandMode 0x3004, NarrowWalk "BasicFlat" 0x1001, and
# RobotCommander's initial mInitRobotGaitStatus_ 0x1001 (restored after an undock no dock this run set)
approach_gait = 0x3001
finetune_gait = 0x3004
basic_flat_gait = 0x1001
default_restore_gait = 0x1001
# recording: base_link 0.735 m out from the posts' axes' midpoint docked (186 sweeps lying on the dock, dock_compare.py,
# a circle fit's x minus charge_manager's); the detector puts the dock docked_x_m - filter.pose_offset_x nearer than
# reflective_column_node's post centres, so charge_manager's x is the vendor's
docked_x_m = 0.735
# bin ChargeManager ctor: VelocityController(1.2, 0, 0.2) for x and y, (1.4, 0, 0.1) for yaw
pid_x = [1.2, 0.0, 0.2]
pid_y = [1.2, 0.0, 0.2]
pid_yaw = [1.4, 0.0, 0.1]
# bin goToPileAction: the start point is the least-|y| of the first 6 poses with x > 0 (`5 < local_4b8`)
start_samples = 5
# bin goToPileAction: staging reached inside delta + (0.04, 0.08, 0.03) (0x20d778-88); limitSpeed(x, 0.8, 0.35),
# (y, 1.0, 0.45), (yaw, 0.8, min_speed_yaw)
staging_margin = [0.04, 0.08, 0.03]
staging_max = [0.8, 1.0, 0.8]
staging_min = [0.35, 0.45]
# bin goToPileAction: fine point reached inside delta + (0.003, 0.003, 0.015) (0x20d770, 0x20d790); limitSpeed(x,
# 0.7, min_speed_x), (y, 0.8, min_speed_y), (yaw, 0.4, min_speed_yaw)
fine_margin = [0.003, 0.003, 0.015]
fine_max = [0.7, 0.8, 0.4]
# bin exitPileAction: limitSpeed(*, 0.7, ext_min_speed_*); the exit staging point passed at x > pre_exitPile_point_x
# - 0.1 (0x20d768)
exit_max = [0.7, 0.7, 0.7]
exit_staging_margin = 0.1
# bin goToPileAction: z = k * -0.05 (0x20d798), k from 2, held at 20 once past 19; done inside delta after 3000 ms or
# after 4000 ms; then (0, 0, 0, -1.1) and sleep(1) before SitDown
finetune_z_step = -0.05
finetune_z_last = 20
finetune_min_ms = 3000
finetune_max_ms = 4000
sit_z = -1.1
sit_hold_ms = 1000
# bin setFineTuneStandMode: waits 5 s (5000000000 ns) for gait 0x3004, then returns regardless
finetune_gait_wait_ms = 5000
# rl_deploy: FinetuneStand (0x3004) reads /STEER as pose inputs dx = -24 x, dy = -18 y, yaw = 7 yaw, height = max(-z, 0)
finetune_pose_scale = [-24.0, -18.0, 7.0]
# bin: Steer x 0xbf4ccccd (-0.8) written five times before exitPileAction's loop and after a retry's stand-up
back_off_x = -0.8
# bin: "more than 1 min" (60000 ms) for the approach and the undock; an obstacle stop fails past 10000 ms (0x2711)
approach_limit_ms = 60000
exit_limit_ms = 60000
obstacle_limit_ms = 10000
# bin: each wait for a pose is a 200 ms pthread_cond_timedwait; a timeout calls stopMove
pose_wait_ms = 200
# rl_deploy: the steer is zeroed 0.15 s after the last one
steer_timeout_ms = 150
# bin: sleep(2) after WideWalk, after a retry's StandUp2WideWalk, and between restoreInitRobotStatus and
# restoreInitRobotGaitStatus
gait_settle_ms = 2000
retry_settle_ms = 2000
restore_ms = 2000
# bin: Open12vPower(3) after SitDown: three charge-enable writes with sleep(2) after each, then the charge check
power_on_ms = 6000
# bin Open12vPower: sleep(2) after each charge-enable write; Start, charging: a 3 s (3000000000 ns) wait, then
# Open12vPower(1), so a write every 5 s (an undock asked for in the sleep waits for its end)
charge_sleep_ms = 2000
charge_wait_ms = 3000
# bin ObstacleDetection::Open: nanosleep 10 ms (0x20f2a0: 0 s, 10000000 ns) when it opens the check
obstacle_open_ms = 10
# bin StandUp2WideWalk: MotionState 1, sleep(2), MotionState 17 and Gait 0x3001, then the wait for 0x3001
stand_rl_control_ms = 2000
# bin exitPileAction: the -0.8 back-off kick is written 5 times
back_off_writes = 5
# recording 2026-11-24: charge_manager's 18 missed pose waits in a row were logged 200.17-200.29 ms apart (mean
# 200.216): each next 200 ms wait starts 216 us after the last one ended (its warning and stopMove)
pose_wait_overhead_us = 216
# charge_manager closes / opens its detector process over a DDS service (OpenMarkerProcess, CloseMarkProcess) and waits
# 53-83 ms for each reply (2026-11-24); ours runs in the module, so nothing to wait for (true: wait for replies fed in)
detector_service = false
# ours (the vendor retries a command 3 more times, 5-6 s each, 0xe4): a stand-up, gait switch or lie-down not done
# in this long fails the sequence
transition_limit_s = 21.0

[inference]
# rl_deploy runs the policies on ONNX Runtime 1.20 (one intra-op thread, all graph optimizations): its library on AOS
# gives its outputs to the bit (tract's differ by up to 5e-5). Used when the file is there, else tract (the log says
# which). $M20_ONNXRUNTIME overrides; empty: tract.
onnxruntime = "/opt/robot/share/rl_deploy/lib/onnxruntime/libonnxruntime.so.1.20.0"

# The eth1 motor bus (backends "ecan" and "bus"); everything not set here takes the values seen on the robot.
[ecan]
# backend "bus": commands carrying kp / kd reach the motors only with this on; off, the controller runs but every
# command goes out as rl_deploy's sitting command. Never on on the robot without an operator's go.
allow_gains = false
# the BMS charge-enable request from m20-battery's rule (docked, lying)
charge_enable = false
