# ctrlmcu.service drop-in: hide tailscale0 from ctrlmcu_node so its .104/.106 IP guard passes on restarts.
# Install: /etc/systemd/system/ctrlmcu.service.d/hide-tailscale.conf + /opt/robot/vendor_fixes/hide_tailscale.so, then daemon-reload.
# Remove: sudo rm /etc/systemd/system/ctrlmcu.service.d/hide-tailscale.conf && sudo systemctl daemon-reload && sudo systemctl restart ctrlmcu
[Service]
Environment=LD_PRELOAD=/opt/robot/vendor_fixes/hide_tailscale.so
