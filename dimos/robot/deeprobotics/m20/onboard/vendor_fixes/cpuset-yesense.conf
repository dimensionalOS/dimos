# yesense.service drop-in: keep this vendor node off rl_deploy's RT cores 4-5 (its script pins it to 4-7, which made rl_deploy's 1 kHz cycle run late).
# Install/remove: vendor_fixes/install_cpuset.sh [--remove]
[Service]
ExecStart=
ExecStart=/opt/robot/vendor_fixes/in_cpuset.sh 6-7 /opt/robot/share/node_driver/scripts/yesense_run.sh
