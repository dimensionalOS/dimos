# ctrlmcu.service drop-in: run ctrlmcu_node in its open-print debug mode so every MCU frame and reply lands in /var/opt/robot/data/ctrlmcu_frames/ctrlmcu.log (rotated by logrotate-ctrlmcu-frames).
# Install/remove: vendor_fixes/install_ctrlmcu_frames.sh [--remove]; the hide-tailscale drop-in stays separate.
[Service]
ExecStartPre=/bin/mkdir -p /var/opt/robot/data/ctrlmcu_frames
ExecStart=
ExecStart=/bin/bash -c 'cd /opt/robot/share/node_driver/bin && exec stdbuf -oL taskset -c 1,2,3 ./ctrlmcu_node open-print >> /var/opt/robot/data/ctrlmcu_frames/ctrlmcu.log 2>&1'
