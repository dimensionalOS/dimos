[package]
name = "dimos-m20-body-imu-sniff"
version = "0.1.0"
edition = "2021"
description = "Native Rust module: the Deep Robotics M20's body IMU as sensor_msgs Imu, sniffed passively off the vendor yesense_node's DDS samples"
license = "Apache-2.0"

[lib]
name = "dimos_m20_body_imu_sniff"
path = "src/lib.rs"

[[bin]]
name = "m20_body_imu_sniff"
path = "src/bin/m20_body_imu_sniff.rs"

[package.metadata.dimos.module.m20_body_imu_sniff]
path = "dimos_m20_body_imu_sniff::module::M20BodyImuSniff"
python = "dimos.robot.deeprobotics.m20.body_imu_sniff.module:M20BodyImuSniff"

[package.metadata.dimos.module.m20_body_imu_sniff.inputs]
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.m20_body_imu_sniff.outputs]
imu = "sensor_msgs.Imu"
imu_rpy = "geometry_msgs.Vector3"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "16957513ebc78c67c95bbbc866135e4a8d9ec0dc" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.dev]
debug = 0

[profile.test]
debug = 0
