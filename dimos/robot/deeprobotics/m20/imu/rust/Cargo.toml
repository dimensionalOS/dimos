[package]
name = "dimos-m20-imu"
version = "0.1.0"
edition = "2021"
description = "Native Rust module: the Deep Robotics M20's body IMU (Yesense, on the AOS board's /dev/ttyS9) as sensor_msgs Imu"
license = "Apache-2.0"

[lib]
name = "dimos_m20_imu"
path = "src/lib.rs"

[[bin]]
name = "m20_imu"
path = "src/bin/m20_imu.rs"

[package.metadata.dimos.module.m20_imu]
path = "dimos_m20_imu::module::M20Imu"
python = "dimos.robot.deeprobotics.m20.imu.module:M20Imu"

[package.metadata.dimos.module.m20_imu.inputs]
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.m20_imu.outputs]
imu = "sensor_msgs.Imu"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "9ac42e97ac754f026fc418b5534960dba71c2c0f" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
yesense-imu = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.dev]
debug = 0

[profile.test]
debug = 0
