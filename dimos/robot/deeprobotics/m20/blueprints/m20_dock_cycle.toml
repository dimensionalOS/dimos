root = "Mission"
resources = ["base"]

[constants]
cycles = 5
back_m = 8.0
base_height_m = 0.48
pause_s = 5.0
settle_s = 2.0
rest_s = 10.0
retry_s = 1.0
dock_attempts = 3
PREEMPTED = 2
SUCCEEDED = 3
ABORTED = 4

[vars]
"cycle.count" = 0
"dock.tries" = 0
"spot.dock" = { header = { frame_id = "", seq = 0, stamp = { sec = 0, nsec = 0 } }, pose = { position = { x = 0.0, y = 0.0, z = 0.0 }, orientation = { x = 0.0, y = 0.0, z = 0.0, w = 1.0 } } }
"axis.x" = 1.0
"axis.y" = 0.0
"spot.predock" = { header = { frame_id = "", seq = 0, stamp = { sec = 0, nsec = 0 } }, pose = { position = { x = 0.0, y = 0.0, z = 0.0 }, orientation = { x = 0.0, y = 0.0, z = 0.0, w = 1.0 } } }
"spot.position_a" = { header = { frame_id = "", seq = 0, stamp = { sec = 0, nsec = 0 } }, pose = { position = { x = 0.0, y = 0.0, z = 0.0 }, orientation = { x = 0.0, y = 0.0, z = 0.0, w = 1.0 } } }

[[signal]]
name = "nav_status"
stream = "MLSPlannerNative.nav_status"

[[signal]]
name = "odom"
stream = "M20Connection.odom"

[[event]]
name = "arrived"
when = "nav_status.status == SUCCEEDED && nav_status.goal_id.stamp == nav.goal"

[[event]]
name = "gave_up"
when = "(nav_status.status == ABORTED || nav_status.status == PREEMPTED) && nav_status.goal_id.stamp == nav.goal"

[[activity]]
name = "navigate"
start = "MLSPlannerNative.go_to"
cancel = "MLSPlannerNative.stop_navigation"
uses = ["base"]

[[activity]]
name = "dock"
start = "M20Connection.dock"

[[activity]]
name = "undock"
start = "M20Connection.undock"

[[node]]
name = "Mission"
children = ["OnDock", "Undocking", "GoingAway", "AwayRetry", "Pausing", "Returning", "ReturnRetry", "Settling", "Docking", "Resting", "NextCycle"]
initial = "OnDock"
outcomes = ["done", "failed"]

[[node]]
name = "OnDock"

# The robot sits square on the dock, so its pose there gives the dock's axis.
[[node.transition]]
trigger = "odom"
goto = "Undocking"

[node.transition.set]
"spot.dock" = "odom"
"axis.x" = "1.0 - 2.0 * (odom.pose.orientation.y * odom.pose.orientation.y + odom.pose.orientation.z * odom.pose.orientation.z)"
"axis.y" = "2.0 * (odom.pose.orientation.x * odom.pose.orientation.y + odom.pose.orientation.z * odom.pose.orientation.w)"
"dock.tries" = "0"

[[node]]
name = "Undocking"
activity = "undock"

# The predock spot is the undock spot moved onto the dock's axis.
# Position A is back_m farther back along the axis, and both sit on the floor.
[[node.transition]]
trigger = "succeeded"
goto = "GoingAway"

[node.transition.set]
"spot.predock" = "{'header': odom.header, 'pose': {'position': {'x': spot.dock.pose.position.x + ((odom.pose.position.x - spot.dock.pose.position.x) * axis.x + (odom.pose.position.y - spot.dock.pose.position.y) * axis.y) * axis.x, 'y': spot.dock.pose.position.y + ((odom.pose.position.x - spot.dock.pose.position.x) * axis.x + (odom.pose.position.y - spot.dock.pose.position.y) * axis.y) * axis.y, 'z': odom.pose.position.z - base_height_m}, 'orientation': spot.dock.pose.orientation}}"
"spot.position_a" = "{'header': odom.header, 'pose': {'position': {'x': spot.dock.pose.position.x + (((odom.pose.position.x - spot.dock.pose.position.x) * axis.x + (odom.pose.position.y - spot.dock.pose.position.y) * axis.y) - back_m) * axis.x, 'y': spot.dock.pose.position.y + (((odom.pose.position.x - spot.dock.pose.position.x) * axis.x + (odom.pose.position.y - spot.dock.pose.position.y) * axis.y) - back_m) * axis.y, 'z': odom.pose.position.z - base_height_m}, 'orientation': spot.dock.pose.orientation}}"

[[node]]
name = "GoingAway"
activity = "navigate"
args = { pose = "spot.position_a" }
result = "nav.goal"

[[node.transition]]
trigger = "arrived"
goto = "Pausing"

[[node.transition]]
trigger = "gave_up"
goto = "failed"

[[node.transition]]
trigger = "failed"
goto = "AwayRetry"

[[node]]
name = "AwayRetry"

[[node.transition]]
after = "retry_s"
goto = "GoingAway"

[[node]]
name = "Pausing"

[[node.transition]]
after = "pause_s"
goto = "Returning"

[[node]]
name = "Returning"
activity = "navigate"
args = { pose = "spot.predock" }
result = "nav.goal"

[[node.transition]]
trigger = "arrived"
goto = "Settling"

[[node.transition]]
trigger = "gave_up"
goto = "failed"

[[node.transition]]
trigger = "failed"
goto = "ReturnRetry"

[[node]]
name = "ReturnRetry"

[[node.transition]]
after = "retry_s"
goto = "Returning"

[[node]]
name = "Settling"

[[node.transition]]
after = "settle_s"
goto = "Docking"

[[node]]
name = "Docking"
activity = "dock"

[[node.transition]]
trigger = "succeeded"
goto = "Resting"
set = { "cycle.count" = "cycle.count + 1" }

# The robot drifts while standing, so a dock that fails approaches again from position A.
[[node.transition]]
trigger = "failed"
if = "dock.tries + 1 < dock_attempts"
goto = "GoingAway"
set = { "dock.tries" = "dock.tries + 1" }

[[node.transition]]
trigger = "failed"
goto = "failed"

[[node]]
name = "Resting"

[[node.transition]]
after = "rest_s"
goto = "NextCycle"

[[node]]
name = "NextCycle"

[[node.transition]]
if = "cycle.count < cycles"
goto = "OnDock"

[[node.transition]]
goto = "done"
