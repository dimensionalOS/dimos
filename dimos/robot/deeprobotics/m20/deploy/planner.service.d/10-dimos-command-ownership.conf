# DimOS owns /NAV_CMD on M20 integrations. The vendor manual requires its
# planner service to be stopped before an external publisher uses that topic.
# Create /etc/dimos/enable-vendor-m20-planner to deliberately restore the
# vendor planner instead of allowing two command owners by accident.
[Unit]
ConditionPathExists=/etc/dimos/enable-vendor-m20-planner
