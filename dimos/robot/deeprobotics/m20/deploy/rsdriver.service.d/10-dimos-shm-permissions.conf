# GOS runs rslidar as root so it can request real-time scheduling and publish a
# usable Fast DDS writer on this vendor image. Keep root execution, but expose
# only the driver's shared-memory objects to the normal onboard `user` account.
[Service]
Group=user
UMask=0002
ExecStartPost=/usr/local/libexec/dimos-m20-rsdriver-shm-permissions $MAINPID
