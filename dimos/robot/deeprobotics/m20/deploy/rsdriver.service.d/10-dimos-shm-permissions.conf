# GOS runs rslidar as root so it can request real-time scheduling. Fast DDS
# creates its SHM segment with mode 0666 masked by this service's UMask. Keep
# root execution, but let the normal onboard `user` account attach to the DDS
# segment used by the DimOS bridge.
[Service]
Group=user
UMask=0002
ExecStartPost=/usr/local/libexec/dimos-m20-rsdriver-shm-permissions $MAINPID
