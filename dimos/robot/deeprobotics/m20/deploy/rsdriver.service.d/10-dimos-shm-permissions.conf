# GOS runs rslidar as root so it can request real-time scheduling and publish a
# usable Fast DDS writer on this vendor image. Keep root execution, but let the
# normal onboard `user` account attach to the local DDS shared-memory objects.
[Service]
Group=user
UMask=0002
ExecStartPost=/usr/local/libexec/dimos-m20-rsdriver-shm-permissions $MAINPID
