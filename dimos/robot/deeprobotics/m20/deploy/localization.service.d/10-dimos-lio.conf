[Unit]
After=network-online.target rsdriver.service
Conflicts=hsLidar.service
PartOf=rsdriver.service
Requires=rsdriver.service
Wants=network-online.target

[Service]
ExecStart=
ExecStart=/bin/bash -c 'lio=/opt/robot/share/slam/scripts; if [ -x $$lio/boot_lio.sh ]; then exec $$lio/boot_lio.sh; fi; dir=/var/opt/robot/data/maps/_boot_lio; rm -rf $$dir; mkdir -p $$dir/.sessions; exec $$lio/start_dds.sh $$dir indoor'
ExecStartPre=/usr/bin/rm -f /run/dimos-m20-lio-ready
ExecStartPre=/usr/bin/touch /run/dimos-m20-lio-starting
ExecStartPost=/bin/bash -c 'session=/var/opt/robot/data/maps/_boot_lio/.sessions/session_0; for _attempt in {1..300}; do for f in $$session/lio_odom.pose $$session/imu_quat.txt; do if [ $$f -nt /run/dimos-m20-lio-starting ]; then /usr/bin/touch /run/dimos-m20-lio-ready; exit 0; fi; done; sleep 0.1; done; echo "vendor LIO produced no output within 30 seconds" >&2; exit 1'
ExecStopPost=/usr/bin/rm -f /run/dimos-m20-lio-ready /run/dimos-m20-lio-starting
Restart=on-failure
RestartSec=3
TimeoutStartSec=45
