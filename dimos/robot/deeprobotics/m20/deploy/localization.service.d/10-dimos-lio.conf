[Unit]
After=network-online.target rsdriver.service
Conflicts=hsLidar.service
PartOf=rsdriver.service
Requires=rsdriver.service
Wants=network-online.target

[Service]
ExecStart=
ExecStart=/opt/robot/share/slam/scripts/boot_lio.sh
ExecStartPre=/usr/bin/rm -f /run/dimos-m20-lio-ready
ExecStartPre=/usr/bin/touch /run/dimos-m20-lio-starting
ExecStartPost=/bin/bash -c 'for _attempt in {1..300}; do if [ /var/opt/robot/data/maps/_boot_lio/.sessions/session_0/lio_odom.pose -nt /run/dimos-m20-lio-starting ]; then /usr/bin/touch /run/dimos-m20-lio-ready; exit 0; fi; sleep 0.1; done; echo "vendor LIO produced no odometry within 30 seconds" >&2; exit 1'
ExecStopPost=/usr/bin/rm -f /run/dimos-m20-lio-ready /run/dimos-m20-lio-starting
Restart=on-failure
RestartSec=3
TimeoutStartSec=45
