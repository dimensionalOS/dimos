[package]
name = "dimos-go2-webrtc"
version = "0.1.0"
edition = "2021"
description = "The Go2 over its WebRTC link as a dimos native module: cmd_vel and requests in, odometry, lidar and the decoded front camera out"
license = "Apache-2.0"

[lib]
name = "dimos_go2_webrtc"
path = "src/lib.rs"

[[bin]]
name = "go2_webrtc"
path = "src/bin/go2_webrtc.rs"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "6663bcb6e5e18f43a6cb9cf77ccbec613e310443" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }
webrtc = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes = "0.8"
aes-gcm = "0.10"
ecb = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
# the lidar's voxel map arrives LZ4-compressed
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
# the camera arrives as H.264
openh264 = { version = "=0.9.3", features = ["source"] }

[package.metadata.dimos.module.go2_webrtc]
path = "dimos_go2_webrtc::module::Go2WebRtc"
python = "dimos.robot.unitree.go2.connection:GO2Connection"

[package.metadata.dimos.module.go2_webrtc.inputs]
cmd_vel = "geometry_msgs.Twist"
command = "std_msgs.String"

[package.metadata.dimos.module.go2_webrtc.outputs]
odom = "geometry_msgs.PoseStamped"
lidar = "sensor_msgs.PointCloud2"
pointcloud = "sensor_msgs.PointCloud2"
color_image = "sensor_msgs.Image"
camera_info = "sensor_msgs.CameraInfo"
tf = "tf2_msgs.TFMessage"
battery = "sensor_msgs.BatteryState"

[profile.release]
lto = "thin"
codegen-units = 1
# A panicked worker thread takes the process down, so the supervisor sees it.
panic = "abort"

[workspace]
