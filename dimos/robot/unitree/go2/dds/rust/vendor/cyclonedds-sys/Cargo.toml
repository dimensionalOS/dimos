# Vendored from dimensionalOS/cyclonedds-sys @ f30bd8c (no-SHM wrapper, static-link
# patch) with bindgen bumped and the bindings read from OUT_DIR.
[package]
name = "cyclonedds-sys"
version = "0.2.1"
authors = ["Sojan James <Sojan.James@gmail.com>"]
edition = "2018"
links = "ddsc"
build = "build.rs"
description = "Rust bindings for cyclonedds autogenerated by bindgen"
homepage = "https://github.com/sjames/cyclonedds-sys"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
shm = []
default = []

[build-dependencies]
# 0.55 chokes on anonymous unions with clang >= 16; 0.70 names them.
bindgen = "0.70"
glob = "0.3"
cc = "1.0"

[dependencies]
paste = "0.1"
libc = "0.2"
bitmask = "0.5"

# A patch dependency, not a member of the crate above or the repo workspace.
[workspace]
