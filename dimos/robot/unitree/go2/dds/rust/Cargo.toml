[package]
name = "dimos-go2-dds"
version = "0.1.0"
edition = "2021"
description = "The Go2 over CycloneDDS as a dimos native module: sport control in, odometry, L1 cloud and front video out"
license = "Apache-2.0"

[lib]
name = "dimos_go2_dds"
path = "src/lib.rs"

[[bin]]
name = "go2_dds"
path = "src/bin/go2_dds.rs"

[dependencies]
# Our forks, vendored: the robot has no GitHub access. See vendor/*/Cargo.toml.
cyclonedds-rs = { path = "vendor/cyclonedds-rs", default-features = false }
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "a83b1e8f06a5010dfcfb498f6d09d9d725c54b8b" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", tag = "v0.1.6" }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
cdr = "0.2.4"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# A panicked worker thread takes the process down, so the supervisor sees it.
panic = "abort"

[workspace]
exclude = ["vendor/cyclonedds-sys", "vendor/cyclonedds-rs"]
