[package]
name = "dimos-go2-dds"
version = "0.1.0"
edition = "2021"
description = "The Go2 over CycloneDDS as a dimos native module: sport control in, odometry, L1 cloud and front video out"
license = "Apache-2.0"

[lib]
name = "dimos_go2_dds"
path = "src/lib.rs"

[[bin]]
name = "go2_dds"
path = "src/bin/go2_dds.rs"

[dependencies]
# Our forks, vendored: the robot has no GitHub access. See vendor/*/Cargo.toml.
cyclonedds-rs = { path = "vendor/cyclonedds-rs", default-features = false }
dimos-module = { path = "../../../../../../native/rust/dimos-module" }
dimos-generated-messages = { path = "../../../../../../packages/dimos-generated/src/dimos_generated_schemas/package/rust" }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
cdr = "0.2.4"
serde_json = "1"

[package.metadata.dimos.module.go2_dds]
path = "dimos_go2_dds::module::Go2Dds"
python = "dimos.robot.unitree.go2.dds.module:GO2DDS"

[package.metadata.dimos.module.go2_dds.inputs]
cmd_vel = "geometry_msgs/msg/Twist"
command = "std_msgs/msg/String"
tf = "tf2_msgs/msg/TFMessage"

[package.metadata.dimos.module.go2_dds.outputs]
odometry = "nav_msgs/msg/Odometry"
lidar = "sensor_msgs/msg/PointCloud2"
video = "foxglove_msgs/msg/CompressedVideo"
image = "sensor_msgs/msg/CompressedImage"
lidar_raw = "sensor_msgs/msg/PointCloud2"
lidar_imu = "sensor_msgs/msg/Imu"
joint_state = "sensor_msgs/msg/JointState"
imu = "sensor_msgs/msg/Imu"
battery = "sensor_msgs/msg/BatteryState"
joy = "sensor_msgs/msg/Joy"
camera_info = "sensor_msgs/msg/CameraInfo"

[profile.release]
lto = "thin"
codegen-units = 1
# A panicked worker thread takes the process down, so the supervisor sees it.
panic = "abort"

# Own lockfile, like the other native crates: not in the repo's top-level workspace.
[workspace]
exclude = ["vendor/cyclonedds-sys", "vendor/cyclonedds-rs"]
