org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4608M

android.useAndroidX=true
android.nonTransitiveRClass=false
android.disableResourceValidation=true

# Build config — mirrors the MSDK v5.18 sample.
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
MSDK_VERSION=5.18.0

# The DJI App Key is a secret: put the real value in secrets.properties
# (untracked). This tracked default only exists so the project configures.
AIRCRAFT_API_KEY=
