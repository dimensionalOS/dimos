[package]
name = "dimos-r1pro-floor-prior"
version = "0.1.0"
edition = "2021"
description = "Native Rust module: the R1 Pro's head depth, depth2depth_cloud with a floor prior anchoring the near floor it never gets lidar for"
license = "Apache-2.0"

[lib]
name = "dimos_r1pro_floor_prior"
path = "src/lib.rs"

[[bin]]
name = "r1pro_head_depth"
path = "src/bin/r1pro_head_depth.rs"

[workspace]

[dependencies]
dimos-depth2depth-cloud = { path = "../../../../../perception/depth2depth_cloud/rust" }
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "6663bcb6e5e18f43a6cb9cf77ccbec613e310443" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }
nalgebra = "0.35.0"
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }

[features]
tensorrt = ["dimos-depth2depth-cloud/tensorrt"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
