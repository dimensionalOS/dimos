# yaml-language-server: $schema=./robots.schema.json
#
# The hand-written source of robots.json: every robot dimos supports, the directories its code lives in, and what each
# of its blueprints is for, with the settings a person should decide before running it (recommended_config).
#
# Edit this file, then run `python -m dimos.gateway.robots --write` to regenerate robots.json (checked in: dimOS Desktop
# reads it through dimos.yaml's `robots:`, and the dimos gateway serves it resolved at GET /dimos/robots).
# dimos/gateway/test_robots.py fails when robots.json is stale, and checks this file against the code (see
# dimos/gateway/robots.py for every rule).
#
# A recommended setting names a config value by key: `global: <GlobalConfig field>`, or `module: <module>` + `field:`.
# Only write what reflection can't know: GlobalConfig gives each field's type, default and (for a Literal or an Enum)
# its choices. Add a nicer `label`, a `placeholder`, a `docs` link, `required: true`, `kind: recording` (+ `streams`),
# `choices` (each `{value, label}`) for an enum of your own, and `when: {<key>: <value>}` to show it only while those
# config values hold. A pick sets several values at once: a `label` and `choices` that each `set:` them, e.g.
# "Run it on": Robot / Replay / Simulator. On a blueprint, `recommended_config` replaces its robot's defaults; an entry
# for a key the robot's defaults also name inherits that entry's fields.

# Robot types, in the order a launcher groups robots by; each robot's `type` is one of these (or null: not a robot
# dimos drives, listed last under Other).
types:
  dog:
    label: Dogs
  humanoid:
    label: Humanoids
  wheeled:
    label: Wheeled bases
  arm:
    label: Arms
  drone:
    label: Drones
robots:
  go2:
    name: Unitree Go2
    description: 'Unitree''s quadruped: camera, lidar, WebRTC, DDS or a zenoh bridge.'
    type: dog
    manufacturer: Unitree
    dirs:
    - dimos/robot/unitree/go2
    recommended:
    - unitree-go2
    - unitree-go2-agentic
    - unitree-go2-basic
    - teleop-phone-go2
    defaults:
      recommended_config:
      - label: Run it on
        choices:
        - label: Robot
          set:
            replay: false
            simulation: ''
        - label: Replay
          set:
            replay: true
            simulation: ''
        - label: Simulator
          set:
            replay: false
            simulation: mujoco
      - global: robot_ip
        label: Robot IP
        placeholder: 192.168.12.1
        required: true
        docs: https://docs.dimensional.org/platforms/quadruped/go2/setup/#first-time-setup-connecting-to-wifi-finding-robot-ip
        when:
          replay: false
          simulation: ''
      - global: replay_db
        label: Recording
        kind: recording
        streams:
        - - go2_lidar
          - lidar
        - - go2_odom
          - odom
        - - color_image
        when:
          replay: true
          simulation: ''
    blueprints:
      unitree-go2-basic:
        title: Go2 basic
        description: 'Connects to a Go2 and streams its camera, lidar and pose. The simplest way to get a Go2 going: drive
          it from Controller.'
        starter: 1
      unitree-go2:
        title: Go2 with map + navigation
        description: Builds a 3D map and a costmap as it walks; click a spot to send it there, or let it explore on its own.
        starter: 2
      unitree-go2-agentic:
        title: Go2 with an agent
        description: Map and navigation plus an AI agent you can talk to (over MCP), with a memory of what it has seen.
        starter: 3
        recommended_config:
        - label: Run it on
          choices:
          - label: Robot
            set:
              replay: false
              simulation: ''
          - label: Replay
            set:
              replay: true
              simulation: ''
          - label: Simulator
            set:
              replay: false
              simulation: mujoco
        - global: robot_ip
        - global: replay_db
        - global: detection_model
          label: Detection model
      unitree-go2-webrtc-keyboard-teleop:
        title: Go2 keyboard driving
        description: Drive a Go2 with this computer's keyboard, over WebRTC.
      unitree-go2-detection:
        title: Go2 with 3D detection
        description: Map and navigation plus 3D object detection on its camera.
        starter: 5
      teleop-phone-go2:
        title: Go2 phone driving
        description: Drive a Go2 from a phone's touch controls.
        starter: 6
        recommended_config:
        - global: robot_ip
      unitree-go2-agentic-cockpit:
        title: Go2 agent with a cockpit
        description: 'The Go2 agent with an authored cockpit: video over the 3D voxel map.'
      unitree-go2-agentic-huggingface:
        title: Go2 agent (Hugging Face model)
        description: The Go2 agent with its language model served from Hugging Face.
      unitree-go2-agentic-ollama:
        title: Go2 agent (Ollama model)
        description: The Go2 agent with a local language model served by Ollama.
      unitree-go2-cockpit:
        title: Go2 with a cockpit
        description: 'Map and navigation with an authored cockpit: video over the 3D voxel map.'
      unitree-go2-coordinator:
        title: Go2 control coordinator
        description: A Go2 behind dimos's ControlCoordinator (the base for controller experiments).
        recommended_config:
        - global: robot_ip
      unitree-go2-fleet:
        title: Go2 fleet
        description: 'Several Go2s driven together: every command goes to all of them.'
        recommended_config:
        - global: robot_ips
          label: Robot IPs
          placeholder: 192.168.12.1,192.168.12.2
          required: true
          docs: https://docs.dimensional.org/platforms/quadruped/go2/setup/#first-time-setup-connecting-to-wifi-finding-robot-ip
        - global: robot_ip
      unitree-go2-holonomic-benchmark:
        title: Go2 holonomic benchmark
        description: Benchmarks the holonomic full-pose controller on a Go2.
        hidden: true
        recommended_config:
        - global: robot_ip
      unitree-go2-holonomic-controller:
        title: Go2 holonomic controller
        description: A standalone holonomic full-pose controller for a Go2, with keyboard driving.
        recommended_config:
        - global: robot_ip
      unitree-go2-keyboard-teleop:
        title: Go2 keyboard driving (DDS)
        description: Drive a Go2 with the keyboard through the ControlCoordinator over DDS (SDK2).
        recommended_config:
        - global: robot_ip
      unitree-go2-markers:
        title: Go2 with marker detection
        description: Map and navigation plus fiducial marker detection mirrored into TF.
      unitree-go2-memory:
        title: Go2 with memory
        description: Map and navigation, recording everything it sees into dimos memory.
      unitree-go2-mid360-record:
        title: Go2 + Mid-360 recording
        description: Drive a Go2 carrying a Livox Mid-360 and record the lidar, the robot and its pose.
        recommended_config:
        - global: robot_ip
      unitree-go2-mls-htc:
        title: Go2 3D navigation (MLS + holonomic)
        description: '3D navigation: a voxel map, MLS planning and a holonomic controller.'
        recommended_config:
        - global: robot_ip
      unitree-go2-multi:
        title: Several Go2s
        description: Several independent Go2s on one coordinator.
        recommended_config:
        - global: robot_ips
          label: Robot IPs
          placeholder: 192.168.12.1,192.168.12.2
          required: true
          docs: https://docs.dimensional.org/platforms/quadruped/go2/setup/#first-time-setup-connecting-to-wifi-finding-robot-ip
        - global: robot_ip
      unitree-go2-multi-teleop:
        title: Several Go2s, keyboard driving
        description: Several Go2s, with a keyboard driving window per robot.
        recommended_config:
        - global: robot_ips
          label: Robot IPs
          placeholder: 192.168.12.1,192.168.12.2
          required: true
          docs: https://docs.dimensional.org/platforms/quadruped/go2/setup/#first-time-setup-connecting-to-wifi-finding-robot-ip
        - global: robot_ip
      unitree-go2-nav-3d:
        title: Go2 3D navigation (Mid-360)
        description: '3D navigation with a Livox Mid-360 on the Go2: ray-traced voxel map and MLS planning.'
        recommended_config:
        - global: robot_ip
      unitree-go2-nav-3d-relocalization:
        title: Go2 3D navigation in a saved map
        description: 3D navigation (Mid-360) that relocalizes in a map you made before.
        recommended_config:
        - global: robot_ip
      unitree-go2-nav-3d-relocalization-replay:
        title: Go2 3D navigation in a saved map (replay)
        description: The relocalized 3D navigation stack driven by a recording instead of a robot.
        recommended_config:
        - global: robot_ip
      unitree-go2-pgo:
        title: Go2 with loop closure
        description: Map and navigation with live loop closure (pose-graph optimization).
      unitree-go2-relocalization:
        title: Go2 relocalization
        description: Map and navigation that relocalizes in a saved map.
      unitree-go2-ros:
        title: Go2 with ROS
        description: Map and navigation, bridged to ROS.
      unitree-go2-rpp-benchmark:
        title: Go2 RPP benchmark
        description: Benchmarks the regulated pure pursuit path follower on a Go2.
        hidden: true
        recommended_config:
        - global: robot_ip
      unitree-go2-rpp-controller:
        title: Go2 RPP controller
        description: A standalone regulated pure pursuit path-following controller for a Go2.
        recommended_config:
        - global: robot_ip
      unitree-go2-security:
        title: Go2 security patrol
        description: An agent that patrols with the Go2 and watches for people.
      unitree-go2-spatial:
        title: Go2 with spatial memory
        description: Map and navigation plus a spatial memory of what it has seen.
      unitree-go2-temporal-memory:
        title: Go2 agent with temporal memory
        description: The Go2 agent with a memory of when it saw things.
      unitree-go2-typesafe:
        title: Go2 go-to-object
        description: 'Say `go to the <object>`: the Go2 finds it with 2D detection and walks there.'
      unitree-go2-vlm-stream-test:
        title: Go2 VLM stream test
        description: Tests a vision-language model on the Go2's camera stream.
        hidden: true
      unitree-go2-webrtc-rage-keyboard-teleop:
        title: Go2 keyboard driving (rage mode)
        description: Keyboard driving over WebRTC with the Go2's rage mode (faster gaits) on.
        recommended_config:
        - global: robot_ip
      teleop-webxr-go2:
        title: Go2 VR driving
        description: Drive a Go2 from a VR headset's thumbsticks, with its camera in the headset.
        recommended_config:
        - global: robot_ip
      teleop-phone-go2-fleet:
        title: Go2 fleet phone driving
        description: 'Drive a fleet of Go2s from a phone: every command goes to all of them.'
        recommended_config:
        - global: robot_ips
          label: Robot IPs
          placeholder: 192.168.12.1,192.168.12.2
          required: true
          docs: https://docs.dimensional.org/platforms/quadruped/go2/setup/#first-time-setup-connecting-to-wifi-finding-robot-ip
        - global: robot_ip
      teleop-hosted-go2-multicam:
        title: Go2 remote driving (two cameras)
        description: Drive a Go2 from anywhere through the hosted (Cloudflare) teleop broker, with a RealSense as a second
          camera.
        recommended_config:
        - global: robot_ip
      teleop-hosted-go2-transport:
        title: Go2 remote driving
        description: Drive a Go2 from anywhere through the hosted (Cloudflare) teleop broker.
        recommended_config:
        - global: robot_ip
      go2-localize-live:
        title: Go2 localize (recording)
        description: A Go2 recording looped as a live feed, with localization behind an agent skill.
        recommended_config:
        - global: replay_db
        - global: robot_ip
      go2-dds:
        title: 'Go2 over DDS'
        description: 'The Go2''s own streams and driving over DDS, on the Jetson wired to it; also the zenoh router a viewer dials.'
      go2-dds-mid360:
        title: 'Go2 over DDS + Mid-360'
        description: 'DDS Go2 with a Mid-360: Point-LIO odometry in place of the head lidar''s.'
      go2-dds-nav:
        title: 'Go2 over DDS: navigation'
        description: 'DDS Go2 with a Mid-360 (Point-LIO), MLS global planner and local planner; headless, watch it with the nav viewer.'
      go2-dds-nav-viewer:
        title: 'Go2 over DDS: nav viewer'
        description: 'The screen for go2-dds-nav on another machine: dials the Go2''s zenoh router and shows its maps and plans.'
