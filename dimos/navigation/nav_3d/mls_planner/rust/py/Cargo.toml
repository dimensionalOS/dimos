[package]
name = "dimos-mls-planner-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the MLS planner module"
license = "Apache-2.0"

[lib]
name = "dimos_mls_planner_py"
crate-type = ["cdylib"]

[dependencies]
dimos-mls-planner = { path = ".." }
numpy.workspace = true
pyo3.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
validator.workspace = true
