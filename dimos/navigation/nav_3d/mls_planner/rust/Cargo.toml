[package]
name = "dimos-mls-planner"
version = "0.1.0"
edition = "2021"
description = "Native Rust multi-level surface path planner for dimos"
license = "Apache-2.0"

[lib]
name = "dimos_mls_planner"
path = "src/lib.rs"

[[bin]]
name = "mls_planner"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
# threads = 2 so the handle loop keeps dispatching while the planning worker
# runs block_in_place.
[package.metadata.dimos.module.mls_planner]
path = "dimos_mls_planner::module::MlsPlanner"
python = "dimos.navigation.nav_3d.mls_planner.mls_planner_native:MLSPlannerNative"
threads = 2

[package.metadata.dimos.module.mls_planner.inputs]
global_map = "sensor_msgs.PointCloud2"
local_map = "sensor_msgs.PointCloud2"
region_bounds = "geometry_msgs.PoseStamped"
goal = "geometry_msgs.PointStamped"
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.mls_planner.outputs]
surface_map = "sensor_msgs.PointCloud2"
nodes = "sensor_msgs.PointCloud2"
node_edges = "nav_msgs.LineSegments3D"
path = "nav_msgs.Path"

[dependencies]
dimos-module.workspace = true
lcm-msgs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde.workspace = true
ahash.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
validator.workspace = true
image = { version = "0.25", default-features = false }
imageproc = { version = "0.27", default-features = false }
rayon.workspace = true
