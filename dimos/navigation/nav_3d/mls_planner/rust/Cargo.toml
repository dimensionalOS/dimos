[package]
name = "dimos-mls-planner"
version = "0.1.0"
edition = "2021"
description = "Native Rust multi-level surface path planner for dimos"
license = "Apache-2.0"

[lib]
# Must match the #[pymodule] fn name in python.rs.
name = "dimos_mls_planner"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mls_planner"
path = "src/main.rs"

# Registry entry read by `dimos bake` (graph + codegen) and cross-checked at
# compile time by #[module(name = "mls_planner")].
# threads = 2: the handle loop must keep dispatching while the planning worker
# task runs block_in_place, so a current_thread runtime would stall it.
[package.metadata.dimos.module.mls_planner]
path = "dimos_mls_planner::module::MlsPlanner"
python = "dimos.navigation.nav_3d.mls_planner.mls_planner_native:MLSPlannerNative"
threads = 2

[package.metadata.dimos.module.mls_planner.inputs]
global_map = "sensor_msgs.PointCloud2"
local_map = "sensor_msgs.PointCloud2"
region_bounds = "geometry_msgs.PoseStamped"
start_pose = "geometry_msgs.PoseStamped"
goal_pose = "geometry_msgs.PoseStamped"

[package.metadata.dimos.module.mls_planner.outputs]
surface_map = "sensor_msgs.PointCloud2"
nodes = "sensor_msgs.PointCloud2"
node_edges = "nav_msgs.Path"
path = "nav_msgs.Path"

[features]
# pyo3 is only needed for the python extension module. `dimos bake` links this
# crate into a host binary with default-features off so no pyo3 objects (and
# their libpython symbols) reach a statically linked build.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
dimos-module = { path = "../../../../../native/rust/dimos-module" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.20", features = ["derive"] }
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }
rayon = "1"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.25", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
