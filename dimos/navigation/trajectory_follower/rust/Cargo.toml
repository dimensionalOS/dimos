[package]
name = "dimos-trajectory-follower"
version = "0.1.0"
edition = "2021"
description = "The trajectory follower: the hinted law, and the native module behind the module feature"
license = "Apache-2.0"

[lib]
name = "dimos_trajectory_follower"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "trajectory_follower"
path = "src/bin/trajectory_follower.rs"
required-features = ["module"]

[dependencies]
# The body the law is parameterized from.
dimos-local-planner = { path = "../../local_planner/rust", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
dimos-module = { path = "../../../../native/rust/dimos-module", optional = true }
dimos-generated-messages = { path = "../../../../build/message-source/rust", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
validator = { version = "0.21", features = ["derive"], optional = true }

[features]
# Nothing by default: the plain crate holds the law, and the module feature adds the native module.
default = []
module = ["dimos-local-planner/module", "dep:serde", "dep:dimos-module", "dep:dimos-generated-messages", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:validator"]

# `cargo test --features module` also runs the module's own tests.
[dev-dependencies]
dimos-local-planner = { path = "../../local_planner/rust", default-features = false, features = ["test-bodies"] }
serde_json = "1"

[package.metadata.dimos.module.trajectory_follower]
path = "dimos_trajectory_follower::module::follower::TrajectoryFollower"
python = "dimos.navigation.trajectory_follower.native:TrajectoryFollowerNative"
threads = 2

[package.metadata.dimos.module.trajectory_follower.inputs]
path = "nav_msgs/msg/Path"
tf = "tf2_msgs/msg/TFMessage"
tf_static = "tf2_msgs/msg/TFMessage"

[package.metadata.dimos.module.trajectory_follower.outputs]
nav_cmd_vel = "geometry_msgs/msg/Twist"
goal_reached = "std_msgs/msg/Bool"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[workspace]
