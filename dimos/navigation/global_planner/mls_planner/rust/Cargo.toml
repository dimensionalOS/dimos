[package]
name = "dimos-mls-planner"
version = "0.1.0"
edition = "2021"
description = "Native Rust multi-level surface path planner for dimos"
license = "Apache-2.0"

[lib]
name = "dimos_mls_planner"
path = "src/lib.rs"

[[bin]]
name = "mls_planner"
path = "src/main.rs"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "a83b1e8f06a5010dfcfb498f6d09d9d725c54b8b" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.21", features = ["derive"] }
rayon = "1"
smallvec = "1"

[workspace]
members = ["py"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
