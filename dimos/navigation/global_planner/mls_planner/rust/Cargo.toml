[package]
name = "dimos-mls-planner"
version = "0.1.0"
edition = "2021"
description = "Native Rust multi-level surface path planner for dimos"
license = "Apache-2.0"

[lib]
name = "dimos_mls_planner"
path = "src/lib.rs"

[[bin]]
name = "mls_planner"
path = "src/main.rs"

# Bake registry entry, cross-checked at compile time by the module macro.
# threads = 2 so the handle loop keeps dispatching while the planning worker
# runs block_in_place.
[package.metadata.dimos.module.mls_planner]
path = "dimos_mls_planner::module::MlsPlanner"
python = "dimos.navigation.global_planner.mls_planner.mls_planner_native:MLSPlannerNative"
threads = 2

[package.metadata.dimos.module.mls_planner.inputs]
global_map = "sensor_msgs.PointCloud2"
local_map = "sensor_msgs.PointCloud2"
region_bounds = "geometry_msgs.PoseStamped"
seed_map = "sensor_msgs.PointCloud2"
seed_bounds = "geometry_msgs.PoseStamped"
goal = "geometry_msgs.PointStamped"
pose_graph = "sensor_msgs.PointCloud2"
loop_closure_event = "sensor_msgs.PointCloud2"
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.mls_planner.outputs]
surface_map = "sensor_msgs.PointCloud2"
nodes = "sensor_msgs.PointCloud2"
node_edges = "nav_msgs.LineSegments3D"
path = "nav_msgs.Path"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", rev = "8bd6dc95b777043ba17a8b0cf0d1e6816eb8bb08" }
# The loop-closure warp, shared by the ray tracer and the MLS planner.
dimos-reform = { git = "https://github.com/dimensionalOS/dimos", rev = "8bd6dc95b777043ba17a8b0cf0d1e6816eb8bb08" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
ahash = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.21", features = ["derive"] }
rayon = "1"
smallvec = "1"
# Warps the graph through a pose-graph correction (config.reform).
fast-reform = "0.2.1"

[workspace]
members = ["py"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
