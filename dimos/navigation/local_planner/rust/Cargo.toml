[package]
name = "dimos-local-planner"
version = "0.1.0"
edition = "2021"
description = "The SE(2) local planner: the search, the path dialect, and (feature module) the native module"
license = "Apache-2.0"

[lib]
# Must match the #[pymodule] fn name in python.rs.
name = "dimos_local_planner"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_planner"
path = "src/bin/local_planner.rs"
required-features = ["module"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.25", optional = true }
dimos-module = { path = "../../../../native/rust/dimos-module", optional = true }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
validator = { version = "0.21", features = ["derive"], optional = true }

[features]
# `cargo test --no-default-features` runs the pure-Rust tests without linking
# Python; maturin builds with defaults and gets the extension module.
# Nothing by default: `python` is the pyo3 extension the parity tests import,
# `module` the native module that runs on the robot. They never build together.
default = []
python = ["dep:pyo3", "dep:numpy"]
module = ["dep:dimos-module", "dep:lcm-msgs", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:validator"]
# `Emb::fixture()`, a test body for this crate and its dependants.
test-bodies = []

[dev-dependencies]
dimos-local-planner = { path = ".", features = ["test-bodies", "module"] }

[package.metadata.dimos.module.local_planner]
path = "dimos_local_planner::module::planner::LocalPlanner"
python = "dimos.navigation.local_planner.native:LocalPlannerNative"
threads = 2

[package.metadata.dimos.module.local_planner.inputs]
local_map = "sensor_msgs.PointCloud2"
planner_path = "nav_msgs.Path"
tf = "tf2_msgs.TFMessage"

[package.metadata.dimos.module.local_planner.outputs]
path = "nav_msgs.Path"

[profile.release]
lto = "thin"
codegen-units = 1

# Not a member of the repo's top-level cargo workspace: this crate keeps its own
# Cargo.lock, as it did before the workspace root existed.
[workspace]
