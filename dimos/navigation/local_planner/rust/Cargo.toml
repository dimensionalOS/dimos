[package]
name = "dimos-local-planner"
version = "0.1.0"
edition = "2021"
description = "The SE(2) local planner: the search, the path dialect, and (feature module) the native module"
license = "Apache-2.0"

[lib]
name = "dimos_local_planner"
path = "src/lib.rs"

[[bin]]
name = "local_planner"
path = "src/bin/local_planner.rs"
required-features = ["module"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
dimos-module = { path = "../../../../native/rust/dimos-module", features = ["cdr"], optional = true }
dimos-generated-messages = { path = "../../../../build/message-source/rust", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
validator = { version = "0.21", features = ["derive"], optional = true }

[features]
# Nothing by default: `module` is the native module that runs on the robot.
default = []
module = ["dep:dimos-module", "dep:dimos-generated-messages", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:validator"]
# `Emb::fixture()`, a test body for this crate and its dependants.
test-bodies = []

# `cargo test --features module,test-bodies` runs everything; without them the module's and fixture tests skip.
[[test]]
name = "invariants"
required-features = ["test-bodies"]

[package.metadata.dimos.module.local_planner]
path = "dimos_local_planner::module::planner::LocalPlanner"
python = "dimos.navigation.local_planner.native:LocalPlannerNative"
threads = 2

[package.metadata.dimos.module.local_planner.inputs]
local_map = "sensor_msgs/msg/PointCloud2"
planner_path = "nav_msgs/msg/Path"
tf = "tf2_msgs/msg/TFMessage"

[package.metadata.dimos.module.local_planner.outputs]
path = "nav_msgs/msg/Path"

[profile.release]
lto = "thin"
codegen-units = 1
