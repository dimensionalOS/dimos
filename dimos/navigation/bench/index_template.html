<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
body { font: 14px/1.4 system-ui, sans-serif; margin: 2em auto; max-width: 80em; color: #222; }
table { border-collapse: collapse; margin: 1em 0; }
th, td { padding: 0.25em 0.75em; border-bottom: 1px solid #ddd; text-align: left; white-space: nowrap; }
th { background: #f4f4f4; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>{{ title }}</h1>
<table>
<thead><tr><th>suite</th><th class="n">episodes</th><th class="n">succeeded</th><th class="n">feature encountered</th><th>finished</th></tr></thead>
<tbody>
{% for row in rows %}
<tr><td><a href="{{ row.link }}">{{ row.report.suite }}</a></td><td class="n">{{ row.report.rows | length }} of {{ row.report.run.episodes }}</td><td class="n">{{ row.report.successes | length }}</td><td class="n">{{ row.encountered }}</td><td>{{ "yes" if row.report.run.finished else "no" }}</td></tr>
{% endfor %}
</tbody>
</table>
</body>
</html>
