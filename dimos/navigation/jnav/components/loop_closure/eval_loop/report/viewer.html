<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSC Loop Closure Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23d9480f%22/%3E%3C/svg%3E">
<style>
:root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f22; --muted: #6a6f76; --line: #d9dbde; --accent: #2f6fdf;
    --gsc: #d9480f; --ivan: #1971c2; --gt: #2b2f36; --edge-ok: #2b8a3e; --edge-bad: #c92a2a; --edge-other: #e8a317;
    --robot: #111111; --plan: #8f3fd1; --src: #e8590c; --tgt: #1c7ed6; --map-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #131517; --panel: #1c1f22; --ink: #e6e8ea; --muted: #9aa1a9; --line: #33383d; --accent: #6ea8ff;
        --gsc: #ff8a4c; --ivan: #4dabf7; --gt: #f1f3f5; --edge-ok: #51cf66; --edge-bad: #ff6b6b; --edge-other: #ffd43b;
        --robot: #f1f3f5; --plan: #c084fc; --src: #ff922b; --tgt: #4dabf7; --map-bg: #101214;
    }
}
:root[data-theme="dark"] {
    --bg: #131517; --panel: #1c1f22; --ink: #e6e8ea; --muted: #9aa1a9; --line: #33383d; --accent: #6ea8ff;
    --gsc: #ff8a4c; --ivan: #4dabf7; --gt: #f1f3f5; --edge-ok: #51cf66; --edge-bad: #ff6b6b; --edge-other: #ffd43b;
    --robot: #f1f3f5; --plan: #c084fc; --src: #ff922b; --tgt: #4dabf7; --map-bg: #101214;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
header, section { max-width: 1400px; margin: 0 auto; padding: 12px 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; flex: 1; }
h2 { font-size: 17px; margin: 8px 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
button, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
label { white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
.scrub { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.scrub input { flex: 1; min-width: 0; }
.time { font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; color: var(--muted); }
.maps { display: flex; gap: 10px; flex-wrap: wrap; }
.map { flex: 1 1 380px; min-width: 0; position: relative; }
.map canvas { width: 100%; aspect-ratio: 1; max-height: 80vh; display: block; background: var(--map-bg); border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
.map .tag { position: absolute; left: 8px; top: 6px; font-weight: 600; pointer-events: none; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.summary { overflow-x: auto; }
details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.loops { display: flex; gap: 12px; flex-wrap: wrap; }
.loop-list { flex: 1 1 520px; min-width: 0; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.loop-list tr { cursor: pointer; }
.loop-list tr.sel td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.loop-list thead th { position: sticky; top: 0; background: var(--panel); }
.loop-detail { flex: 1 1 380px; min-width: 0; }
.loop-detail canvas { width: 100%; aspect-ratio: 1.4; background: var(--map-bg); border: 1px solid var(--line); border-radius: 6px; display: block; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 12px; font-size: 12px; margin: 6px 0; }
.kv span { color: var(--muted); }
.muted { color: var(--muted); }
.ok { color: var(--edge-ok); } .bad { color: var(--edge-bad); }
.appendix p, .appendix li { max-width: 75ch; line-height: 1.5; }
.appendix h3 { font-size: 15px; margin: 14px 0 6px; }
.table-wrap, .diagram { overflow-x: auto; margin: 8px 0; }
.appendix th[colspan] { text-align: center; }
td.win { font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
code { font-size: 12.5px; }
.help { font: 600 10px/1 system-ui, sans-serif; width: 15px; height: 15px; padding: 0; margin-left: 4px; border-radius: 50%; color: var(--muted); background: transparent; border: 1px solid var(--line); vertical-align: 1px; cursor: help; }
.help:hover, .help:focus-visible { color: var(--accent); border-color: var(--accent); }
#tip { position: fixed; z-index: 10; max-width: min(360px, calc(100vw - 16px)); padding: 8px 10px; font-size: 12.5px; line-height: 1.45; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.18); white-space: normal; }
</style>
</head>
<body>
<header>
    <h1 id="title">GSC vs Ivan PGO</h1>
    <span class="muted" id="built"></span>
    <button id="theme" title="Theme">Theme: auto</button>
</header>
<main id="main"></main>
<script>
"use strict"
const $ = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") { el.className = v } else if (k.startsWith("on")) { el.addEventListener(k.slice(2), v) } else { el.setAttribute(k, v) }
    }
    for (const kid of kids.flat()) { if (kid != null) { el.append(kid) } }
    return el
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim()
const fmt = (v, d = 3) => v == null ? "–" : typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(d)) : String(v)
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`
// metric explanations, shown by every (?) button (data-tip = space-separated keys here); report_sections.py's tables use the same keys
const TIPS = {
    gt: "Per keyframe: the distance (x, y and z) between where the method's map puts the robot and where ground truth puts it, after one best-fit rotation and shift of the whole finished path onto ground truth. The same fit is applied to final, live and raw, so all three are judged in one frame. Shown: the median over keyframes. Drift grows along a loop, so early keyframes are close and late ones far; p95 shows that tail.",
    final: "Final: where the finished pose graph puts each keyframe at the end of the run.",
    live: "Live: where the method had the robot at the moment that keyframe was made (the newest correction then, applied to its odometry). This is what the planner navigates with.",
    raw: "Raw odometry: the odometry alone, with no loop closure, scored the same way. The baseline both methods should beat.",
    tags: "How far repeat sightings of the same AprilTag land from each other (RMS, metres) when each sighting is placed with the method's pose. Needs no ground truth and no alignment; 0 = a perfectly consistent map.",
    shade: "Shading compares with raw odometry. Green: the share of raw odometry\u2019s error the method removed (deep green = all of it). Red: how much worse than raw in absolute terms (deep red = 1 m worse), so a 2 cm loss barely shows.",
    speed: "Recording length divided by replay wall time. Above 1x is faster than real time; GSC replays every scan in lockstep, as fast as the machine allows.",
    dropped: "Scans the method never processed because it was busy when they arrived (Ivan keeps only the newest scan while busy; GSC queues them).",
    busy: "Share of wall time Ivan's module spent processing.",
}
const help = (...keys) => $("button", { class: "help", type: "button", "data-tip": keys.join(" "), "aria-label": "explain" }, "?")
document.addEventListener("click", event => {
    const button = event.target.closest(".help")
    let tip = document.getElementById("tip")
    if (!button) { if (tip && !event.target.closest("#tip")) { tip.hidden = true } return }
    if (!tip) { tip = $("div", { id: "tip", role: "tooltip" }); document.body.append(tip) }
    const same = !tip.hidden && tip.dataset.for === button.dataset.tip && tip.anchor === button
    tip.hidden = same
    if (same) { return }
    tip.textContent = button.dataset.tip.split(" ").map(key => TIPS[key] || "").join(" ")
    tip.dataset.for = button.dataset.tip; tip.anchor = button
    const box = button.getBoundingClientRect()
    tip.style.left = `${Math.max(8, Math.min(innerWidth - Math.min(360, innerWidth - 16) - 8, box.left - 20))}px`
    tip.style.top = `${box.bottom + 6}px`
})
addEventListener("scroll", () => { const tip = document.getElementById("tip"); if (tip) { tip.hidden = true } }, { passive: true })
// cell shading, same scale as report_sections.py: score in [-1, 1], green = good, red = bad
function shade(score) {
    if (score == null || !isFinite(score)) { return "" }
    score = Math.max(-1, Math.min(1, score))
    return `background: color-mix(in srgb, var(${score > 0 ? "--edge-ok" : "--edge-bad"}) ${Math.round(Math.abs(score) * 45)}%, transparent)`
}
// against raw odometry (as report_sections.py): better = share of raw's error removed (all = 1); worse = metres added (1 m = -1)
function vsRaw(value, raw) { return value == null || !raw ? null : value <= raw ? (raw - value) / raw : -(value - raw) / 1.0 }
async function fetchText(path) { const r = await fetch(path); if (!r.ok) { throw new Error(`${path}: ${r.status}`) } return r.text() }
async function fetchB64(path) {
    const text = await fetchText(path), bin = atob(text.trim()), bytes = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i) }
    return bytes.buffer
}
// binary search: number of sorted values <= x
function countLE(values, x) { let lo = 0, hi = values.length; while (lo < hi) { const m = (lo + hi) >> 1; if (values[m] <= x) { lo = m + 1 } else { hi = m } } return lo }
// SE2 helpers: pose = [x, y, yaw]
const compose = (a, b) => { const c = Math.cos(a[2]), s = Math.sin(a[2]); return [a[0] + c * b[0] - s * b[1], a[1] + s * b[0] + c * b[1], a[2] + b[2]] }
const invert = a => { const c = Math.cos(a[2]), s = Math.sin(a[2]); return [-c * a[0] - s * a[1], s * a[0] - c * a[1], -a[2]] }

// ---------- theme ----------
const themes = ["auto", "light", "dark"]
let theme = "auto"
try { theme = localStorage.getItem("pgo-theme") || "auto" } catch (e) { }
function applyTheme() {
    if (theme === "auto") { delete document.documentElement.dataset.theme } else { document.documentElement.dataset.theme = theme }
    document.getElementById("theme").textContent = `Theme: ${theme}`
    for (const r of recordings) { r.redraw() }
}
document.getElementById("theme").onclick = () => {
    theme = themes[(themes.indexOf(theme) + 1) % 3]
    try { localStorage.setItem("pgo-theme", theme) } catch (e) { }
    applyTheme()
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme())

// ---------- data decoding ----------
function decodePoints(buffer, n) {
    const counts = new Uint32Array(buffer.slice(0, 4 * n)), xy = new Int16Array(buffer.slice(4 * n))
    const start = new Uint32Array(n + 1)
    for (let i = 0; i < n; i++) { start[i + 1] = start[i] + counts[i] }
    return { start, xy }
}
function decodeStates(buffer, scale) {
    const view = new DataView(buffer), states = []
    let at = 0
    while (at < buffer.byteLength) {
        const ts = view.getFloat64(at, true), n = view.getUint32(at + 8, true)
        const raw = new Int16Array(buffer.slice(at + 12, at + 12 + 6 * n)), pose = new Float32Array(3 * n)
        for (let i = 0; i < n; i++) { pose[3 * i] = raw[3 * i] * scale; pose[3 * i + 1] = raw[3 * i + 1] * scale; pose[3 * i + 2] = raw[3 * i + 2] / 32767 * Math.PI }
        states.push({ ts, n, pose })
        at += 12 + 6 * n
    }
    return states
}
function decodeIcp(buffer) {
    const view = new DataView(buffer), stages = []
    let at = 4
    const cloud = () => {
        const offset = [view.getFloat32(at, true), view.getFloat32(at + 4, true), view.getFloat32(at + 8, true)], n = view.getUint32(at + 12, true)
        const raw = new Int16Array(buffer.slice(at + 16, at + 16 + 6 * n)), xyz = new Float32Array(3 * n)
        for (let i = 0; i < 3 * n; i++) { xyz[i] = raw[i] / 100 + offset[i % 3] }
        at += 16 + 6 * n
        return xyz
    }
    for (let k = view.getUint32(0, true); k > 0; k--) {
        const keyframes = view.getUint32(at, true), tail = []
        for (let i = 0; i < 13; i++) { tail.push(view.getFloat64(at + 4 + 8 * i, true)) }
        at += 4 + 104
        const source = cloud(), target = cloud()
        stages.push({ keyframes, rotation: tail.slice(0, 9), translation: tail.slice(9, 12), fitness: tail[12], source, target })
    }
    return stages
}

// ---------- one method's belief at time t ----------
class Method {
    constructor(key, meta, states, points) {
        Object.assign(this, { key, meta, states, points })
        this.kfTs = meta.kf_ts
        this.stateTs = states.map(s => s.ts)
        this.plan = null
    }
    // keyframe poses as believed at t (Float32Array 3n) for the first n keyframes made by then
    belief(t) {
        const n = countLE(this.kfTs, t), si = countLE(this.stateTs, t) - 1, raw = this.meta.raw, out = new Float32Array(3 * n)
        let correction = [0, 0, 0], m = 0
        if (si >= 0) {
            const s = this.states[si]
            m = Math.min(n, s.n)
            out.set(s.pose.subarray(0, 3 * m))
            const j = s.n - 1
            correction = compose([s.pose[3 * j], s.pose[3 * j + 1], s.pose[3 * j + 2]], invert(raw[j]))
        }
        for (let i = m; i < n; i++) { const p = compose(correction, raw[i]); out[3 * i] = p[0]; out[3 * i + 1] = p[1]; out[3 * i + 2] = p[2] }
        return { n, poses: out, correction, state: si }
    }
    gtPoses(n) {
        if (!this.meta.gt) { return null }
        const out = new Float32Array(3 * n).fill(NaN)
        for (let i = 0; i < n; i++) { const g = this.meta.gt[i]; if (g) { out[3 * i] = g[0]; out[3 * i + 1] = g[1]; out[3 * i + 2] = g[2] } }
        return out
    }
}

// ---------- recording section ----------
const recordings = []
class Recording {
    constructor(info) {
        this.info = info
        this.t = 0; this.playing = false; this.speed = 30
        this.show = { mode: innerWidth > 900 ? "both" : "gsc", gt: false, edges: true, path: true, plan: true }
        this.view = null; this.selected = null
        this.el = $("section", { id: `rec-${info.name}` }, $("h2", {}, info.label), $("p", { class: "muted" }, "loading…"))
        document.getElementById("main").append(this.el)
        recordings.push(this)
    }
    redraw() { if (this.methods) { this.draw() } }
    async load() {
        const base = `${this.info.name}/`
        try {
            const meta = this.meta = JSON.parse(await fetchText(base + "meta.json"))
            this.methods = {}
            for (const [key, m] of Object.entries(meta.methods)) {
                const [sb, pb] = await Promise.all([fetchB64(base + m.states), fetchB64(base + m.points)])
                this.methods[key] = new Method(key, m, decodeStates(sb, m.xy_scale), decodePoints(pb, m.keyframes))
            }
            for (const [key, file] of Object.entries(meta.plan || {})) {
                try { if (this.methods[key]) { this.methods[key].plan = JSON.parse(await fetchText(base + file)) } } catch (e) { console.warn(e) }
            }
            this.t = meta.duration_s
            this.build()
        } catch (e) {
            this.el.querySelector("p").textContent = `failed to load: ${e.message}`
            console.error(e)
        }
    }
    build() {
        const meta = this.meta, el = this.el
        el.querySelector("p").remove()
        el.append(this.summaryTable())
        const toggle = (label, key, disabled = false) => {
            const box = $("input", { type: "checkbox" })
            box.checked = this.show[key] && !disabled; box.disabled = disabled
            box.onchange = () => { this.show[key] = box.checked; this.draw() }
            return $("label", { title: disabled ? "no data for this recording" : "" }, box, ` ${label}`)
        }
        const modeButtons = ["gsc", "ivan", "both"].filter(k => k === "both" ? Object.keys(this.methods).length > 1 : this.methods[k]).map(k => {
            const b = $("button", { onclick: () => { this.show.mode = k; this.layout() } }, k === "both" ? "Side by side" : k === "gsc" ? "GSC" : "Ivan")
            b.dataset.mode = k
            return b
        })
        this.modeButtons = modeButtons
        const hasPlan = Object.values(this.methods).some(m => m.plan)
        el.append($("div", { class: "controls" }, ...modeButtons,
            toggle("GT map", "gt", !meta.gt), toggle("loop edges", "edges"), toggle("trajectory", "path"), toggle("planner path", "plan", !hasPlan),
            $("span", { class: "muted" }, meta.gt ? `GT: ${meta.gt}` : "no GT")))
        this.slider = $("input", { type: "range", min: 0, max: meta.duration_s, step: 0.1, value: this.t, "aria-label": "time" })
        this.slider.oninput = () => { this.t = +this.slider.value; this.draw() }
        this.timeLabel = $("span", { class: "time" })
        this.playButton = $("button", { onclick: () => this.togglePlay() }, "▶ Play")
        const speed = $("select", { "aria-label": "speed" }, ...[10, 30, 100, 300].map(s => $("option", { value: s }, `${s}×`)))
        speed.value = this.speed; speed.onchange = () => { this.speed = +speed.value }
        el.append($("div", { class: "scrub" }, this.playButton, this.slider, this.timeLabel, speed))
        this.panels = {}
        const maps = $("div", { class: "maps" })
        for (const key of Object.keys(this.methods)) {
            const canvas = $("canvas", { role: "img", "aria-label": `${key} map` })
            const panel = $("div", { class: "map" }, canvas, $("div", { class: "tag", style: `color: var(--${key})` }, key === "gsc" ? "GSC" : "Ivan"))
            this.panels[key] = { panel, canvas, info: $("div", { class: "legend" }) }
            maps.append(panel)
            this.attachPanZoom(canvas)
        }
        el.append(maps, $("div", { class: "legend" },
            ...Object.keys(this.methods).map(k => $("span", {}, $("span", { class: "sw", style: `background: var(--${k})` }), k === "gsc" ? "GSC map" : "Ivan map")),
            $("span", {}, $("span", { class: "sw", style: "background: var(--gt)" }), "GT map"),
            $("span", {}, $("span", { class: "sw", style: "background: var(--edge-ok)" }), "loop applied"),
            $("span", {}, $("span", { class: "sw", style: "background: var(--edge-bad)" }), "loop GNC-rejected"),
            $("span", {}, $("span", { class: "sw", style: "background: var(--plan)" }), "planner"),
            $("span", {}, "drag to pan, wheel/pinch to zoom, double-click to reset"),
            this.methods.ivan ? $("span", {}, "Ivan's loop pairs are not logged, so it has no edges") : null))
        this.statusLine = $("div", { class: "legend" })
        el.append(this.statusLine)
        if (meta.loops) { this.loopDetails = this.loopSection(); el.append(this.loopDetails) }
        new ResizeObserver(() => this.draw()).observe(maps)
        this.layout()
        this.applyHash()
    }
    // deep link: #rec=NAME&t=SECONDS&gt=1&mode=gsc|ivan|both&loop=CANDIDATE_INDEX
    applyHash() {
        const q = new URLSearchParams(location.hash.slice(1))
        if (q.get("rec") && q.get("rec") !== this.info.name) { return }
        if (q.has("mode") && this.panels[q.get("mode")] || q.get("mode") === "both") { this.show.mode = q.get("mode"); this.layout() }
        if (q.has("gt") && this.meta.gt) { this.show.gt = q.get("gt") === "1"; this.el.querySelectorAll(".controls input")[0].checked = this.show.gt }
        if (q.has("t")) { this.t = Math.min(this.meta.duration_s, +q.get("t")); this.slider.value = this.t }
        this.draw()
        if (q.has("loop") && this.loopDetails) {
            this.loopDetails.open = true
            this.loopDetails.dispatchEvent(new Event("toggle"))
            const row = [...this.loopDetails.querySelectorAll("tbody tr")].find(tr => tr.firstChild.textContent === q.get("loop"))
            if (row) { row.click() } else { this.showLoop(+q.get("loop"), this.loopDetails.querySelector(".loop-detail")) }
        }
    }
    summaryTable() {
        const s = this.meta.summary, keys = Object.keys(s)
        const rows = [
            ["keyframes", k => s[k].keyframes], ["graph states", k => s[k].states],
            [["final error median / p95 (m)", help("gt","final")], k => s[k].score && `${fmt(s[k].score.final.median_m)} / ${fmt(s[k].score.final.p95_m)}`, k => s[k].score && vsRaw(s[k].score.final.median_m, s[k].score.raw.median_m)],
            [["live error median / p95 (m)", help("gt","live")], k => s[k].score && `${fmt(s[k].score.live.median_m)} / ${fmt(s[k].score.live.p95_m)}`, k => s[k].score && vsRaw(s[k].score.live.median_m, s[k].score.raw.median_m)],
            [["raw error median / p95 (m)", help("raw")], k => s[k].score && `${fmt(s[k].score.raw.median_m)} / ${fmt(s[k].score.raw.p95_m)}`],
            [["tag spread final / live (m)", help("tags")], k => s[k].tag_spread_m && `${fmt(s[k].tag_spread_m.final)} / ${fmt(s[k].tag_spread_m.live)}`, k => s[k].tag_spread_m && vsRaw(s[k].tag_spread_m.final, s[k].tag_spread_m.raw)],
            ["runtime / busy (s)", k => fmt(s[k].runtime_s ?? s[k].busy_s, 1)],
        ]
        const extra = s.gsc && s.gsc.gate_counts ? $("div", { class: "legend" }, "GSC gate: " + Object.entries(s.gsc.gate_counts).map(([k, v]) => `${k} ${v}`).join(", ")) : null
        return $("div", { class: "summary" }, $("table", {},
            $("thead", {}, $("tr", {}, $("th", {}, `${clock(this.meta.duration_s)} of recording`), ...keys.map(k => $("th", { style: `color: var(--${k})` }, k === "gsc" ? "GSC" : "Ivan")))),
            $("tbody", {}, ...rows.map(([label, f, score]) => $("tr", {}, $("td", {}, ...[label].flat()), ...keys.map(k => $("td", { style: score ? shade(score(k)) : "" }, fmt(f(k) ?? null))))))), extra)

    layout() {
        for (const b of this.modeButtons) { b.classList.toggle("on", b.dataset.mode === this.show.mode) }

    fitView() {

    robotPose(correction, t, gt) {

    drawMap(canvas, m, b, colors) {

        const splat = (poses, n, color, sparse = false) => {
            const c = rgba(color), { start, xy } = m.points

    }
    // ---------- loop analysis ----------
    loopSection() {
        const L = this.meta.loops, col = Object.fromEntries(L.diag_columns.map((c, i) => [c, i]))

        const filter = $("select", { "aria-label": "filter by outcome" }, $("option", { value: "*" }, "all outcomes"), $("option", { value: "clouds" }, "with ICP clouds"),
            $("option", { value: "rejected" }, "all rejects"), ...outcomes.map(o => $("option", { value: o }, `${o} (${L.diag.filter(r => r[0] === o).length})`)))

                    $("td", {}, String(i)), $("td", { class: cls }, r[0]), $("td", {}, `${r[col.source_id]}→${r[col.target_id]}`), $("td", {}, r[col.source_time] == null ? "–" : clock(r[col.source_time])),
                    $("td", {}, fmt(r[col.candidate_distance], 2)), $("td", {}, fmt(r[col.icp_fitness], 3)), $("td", {}, fmt(r[col.icp_overlap], 2)), $("td", {}, fmt(r[col.degeneracy_min], 3)),
                    $("td", {}, r[col.confidence] == null ? "–" : `${fmt(r[col.confidence], 2)} / ${fmt(r[col.required_confidence], 2)}`), $("td", {}, fmt(r[col.yank_z], 2)),
                    $("td", {}, fmt(r[col.extended_fitness], 3)), $("td", {}, L.icp[i] ? "●" : ""))

            $("div", { class: "loops" }, list, detail))

    }
    async showLoop(i, detail) {
        const L = this.meta.loops, row = L.diag[i], d = Object.fromEntries(L.diag_columns.map((c, j) => [c, row[j]]))
        this.selected = { source: d.source_id, target: d.target_id }

        const btn = (label, onclick) => $("button", { onclick: ev => { onclick(); paint(); for (const b of ev.target.parentElement.querySelectorAll("button")) { b.classList.toggle("on", b === ev.target) } } }, label)
        const row1 = $("div", { class: "controls" }, ...stages.map((s, j) => btn(s.keyframes === 1 ? "single" : `extended ×${s.keyframes}`, () => { state.stage = j })))
        const row2 = $("div", { class: "controls" }, btn("after ICP", () => { state.aligned = true }), btn("before", () => { state.aligned = false }))
        const row3 = $("div", { class: "controls" }, btn("top", () => { state.side = false }), btn("side", () => { state.side = true }),
            $("span", { class: "legend" }, $("span", {}, $("span", { class: "sw", style: "background: var(--src)" }), "source"), $("span", {}, $("span", { class: "sw", style: "background: var(--tgt)" }), "target")))

}

// ---------- boot ----------
fetchText("report.json").then(text => {
    const report = JSON.parse(text)
    document.getElementById("title").textContent = report.title || "GSC vs Ivan PGO"
    document.title = report.title || document.title
    document.getElementById("built").textContent = report.built ? `built ${report.built}` : ""
    for (const info of report.recordings) { new Recording(info) }
    applyTheme()
    // one at a time, top first, so the first map shows quickly
    return recordings.reduce((chain, r) => chain.then(() => r.load()), Promise.resolve())
}).catch(e => { document.getElementById("main").append($("section", {}, `Could not load report.json (${e.message}). Serve this folder over http.`)) })
</script>
