[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-message-build"
version = "0.1.0"
description = "Standalone DimOS message build backend"
requires-python = ">=3.10"
dependencies = ["rosbags==0.11.0", "empy==4.2", "lark==1.2.2", "setuptools>=70", "wheel", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
native = ["catkin-pkg==1.1.0", "PyYAML==6.0.2"]

[tool.setuptools]
packages = ["dimos_message_build", "dimos_message_build._vendor"]
package-dir = {"dimos_message_build" = "."}
include-package-data = false

[tool.setuptools.package-data]
"dimos_message_build" = ["py.typed", "schemas/**/*", "templates/*", "sources.json", "native_sources.json", "_vendor/*.pyi", "_vendor/LICENSE", "_vendor/*.xml"]
