<!DOCTYPE html>
<!-- Shared-publish @dimos/sdk page: the browser half of the human_input
     example (Python half: Channel("human_input", str, dir="tx",
     encoding="text.json.v1", publish="shared")). Every publish() settles:
     an ack proves the bridge published onto the DimOS stream; a rejection
     names its outcome ("rejected" vs "unknown") and code.
     Run:  dimos run <blueprint> --local-relay --serve-dir web/examples/chat-input -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DimOS chat input</title>
    <style>
      body {
        font-family: monospace;
        margin: 1rem;
      }
      #log div {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>DimOS chat input</h1>
    <div id="status">status: connecting</div>
    <p>
      <input id="text" size="40" value="salut din browser" />
      <button id="send">Send</button>
      <button id="send-bad">Send a number (bridge rejects it)</button>
    </p>
    <div id="log"></div>
    <script type="module">
      import { connect } from "/sdk.js";

      const statusEl = document.querySelector("#status");
      const logEl = document.querySelector("#log");
      const textEl = document.querySelector("#text");

      const session = connect();
      session.status.subscribe(() => {
        statusEl.textContent = `status: ${session.status.get().transport.phase}`;
      });

      const log = (text) => {
        const line = document.createElement("div");
        line.textContent = text;
        logEl.append(line);
      };

      const publish = async (value) => {
        try {
          const receipt = await session.publish("human_input", value, {
            clientTs: Date.now() / 1000,
          });
          log(`acked ${receipt.ch} bridgeTs=${receipt.bridgeTs}`);
        } catch (e) {
          log(`${e.outcome ?? "failed"} ${e.code ?? ""}: ${e.message}`);
        }
      };

      document.querySelector("#send").addEventListener(
        "click",
        () => publish(textEl.value),
      );
      document.querySelector("#send-bad").addEventListener("click", () => publish(12.5));
    </script>
  </body>
</html>
