[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dimos-topic-runtime"
version = "0.1.0"
description = "Isolated, robot-independent runtime for the DimOS topic provider"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aioquic==1.3.0",
    "eclipse-zenoh==1.10.1",
    "pydantic==2.12.5",
    "requests==2.32.5",
    "structlog==25.5.0",
    "numpy==2.3.5",
    "pillow==12.2.0",
    # Upstream cryptography 49+ no longer publishes Intel macOS wheels.
    # Keep an explicit compatible pair for this still-supported Desktop target.
    "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyopenssl==26.2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography==50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyopenssl==26.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "uvloop==0.23.0",
]

[project.scripts]
dimos-topic-service = "dimos.web.relay_bridge.topic_service:main"

# Build the low-level modules from their canonical sources. Desktop installs
# this wheel only into its own versioned runtime environment, never alongside
# the full dimos distribution. No coordinator, typed messages, or robot modules
# are shipped. NumPy/Pillow load lazily for explicitly requested media only.
[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "dimos_topic_runtime-LICENSE"
"../../dimos/__init__.py" = "dimos/__init__.py"
"../../dimos/constants.py" = "dimos/constants.py"
"../../dimos/utils/logging_config.py" = "dimos/utils/logging_config.py"
"../../dimos/web/relay_bridge/manifest.py" = "dimos/web/relay_bridge/manifest.py"
"../../dimos/web/relay_bridge/protocol.py" = "dimos/web/relay_bridge/protocol.py"
"../../dimos/web/relay_bridge/_wt_session.py" = "dimos/web/relay_bridge/_wt_session.py"
"../../dimos/web/relay_bridge/wt_client.py" = "dimos/web/relay_bridge/wt_client.py"
"../../dimos/web/relay_bridge/topic_protocol.py" = "dimos/web/relay_bridge/topic_protocol.py"
"../../dimos/web/relay_bridge/topic_transport.py" = "dimos/web/relay_bridge/topic_transport.py"
"../../dimos/protocol/service/zenoh_wire.py" = "dimos/protocol/service/zenoh_wire.py"
"../../dimos/web/relay_bridge/topic_mailbox.py" = "dimos/web/relay_bridge/topic_mailbox.py"
"../../dimos/web/relay_bridge/topic_catalog.py" = "dimos/web/relay_bridge/topic_catalog.py"
"../../dimos/web/relay_bridge/topic_metadata.py" = "dimos/web/relay_bridge/topic_metadata.py"
"../../dimos/web/relay_bridge/topic_service.py" = "dimos/web/relay_bridge/topic_service.py"
"../../dimos/web/relay_bridge/topic_put.py" = "dimos/web/relay_bridge/topic_put.py"
"../../dimos/web/relay_bridge/topic_guard.py" = "dimos/web/relay_bridge/topic_guard.py"
"../../dimos/web/relay_bridge/topic_profiles.py" = "dimos/web/relay_bridge/topic_profiles.py"
"../../dimos/web/relay_bridge/topic_transform.py" = "dimos/web/relay_bridge/topic_transform.py"
"../../dimos/web/relay_bridge/topic_media.py" = "dimos/web/relay_bridge/topic_media.py"
