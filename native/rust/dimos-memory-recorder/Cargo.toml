[package]
name = "dimos-memory-recorder"
version = "0.1.0"
edition = "2021"
description = "Native stream recorder for dimos memory SQLite stores"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
dimos-module = { path = "../dimos-module" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
lz4_flex = "0.14.0"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
turbojpeg = "1.5.1"

[dev-dependencies]
tempfile = "3"
