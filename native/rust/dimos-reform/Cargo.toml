[package]
name = "dimos-reform"
version = "0.1.0"
edition = "2021"
description = "Pose-graph keyframe corrections turned into a fast-reform warp, shared by the ray tracer and the MLS planner"
license = "Apache-2.0"

[workspace]

[dependencies]
ahash = "0.8"
fast-reform = "0.2.1"
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
validator = { version = "0.21", features = ["derive"] }
