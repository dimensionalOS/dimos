[package]
name = "dimos-module"
version = "0.2.0"
edition = "2021"
description = "Rust native module SDK for dimos NativeModule framework"
license = "Apache-2.0"

[workspace]

[dependencies]
dimos-generated-messages = { path = "../../../build/message-source/rust" }
transforms = { version = "=2.2.0", git = "https://github.com/TomCC7/transforms", rev = "5ae9563de0c02638c04e393aadfad28444a4398e" }
cdr = { version = "=0.2.4", git = "https://github.com/TomCC7/cdr-rs", rev = "38a4368255d408faf374726653b39d4a4e9735cb" }
dimos-lcm = { git = "https://github.com/dimensionalOS/dimos-lcm.git", rev = "04d78e8622500244123ba9cefa4c51b4cb454549" }
dimos-module-macros = { version = "=0.1.0", path = "../dimos-module-macros" }
nalgebra = "0.35.0"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
# Without preserve_order a Value::Object is a BTreeMap, so parsing the stdin line
# alphabetises every key before the config struct ever sees it.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
validator = { version = "0.21", features = ["derive"] }
# Default features pull in ring via QUIC/TLS, which breaks static musl cross-linking.
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp", "transport_udp", "unstable", "shared-memory"] }

[dev-dependencies]
tracing-test = "0.2"

[[example]]
name = "transport_bench"
