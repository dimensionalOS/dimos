[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-dreamlabs-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The full official library contains dream_ik, required even for YAM joint-head FK.
    "dreamlabs==1.0.1",
    "dreamlabs-client==1.0.1",
]

[dependency-groups]
tests = ["pytest==8.3.5", "pytest-mock>=3.14", "mypy==1.19.0"]

[tool.pytest.ini_options]
python_files = ["*_tests.py"]
addopts = "--confcutdir=."

[tool.setuptools.packages.find]
where = ["."]
include = ["dimos_dreamlabs*"]

[tool.uv]
default-groups = []
override-dependencies = [
    # DimOS already owns cv2 through the contrib wheel.
    "opencv-python-headless; sys_platform == 'never'",
]
