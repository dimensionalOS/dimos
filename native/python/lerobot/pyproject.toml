[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-lerobot-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # DimOS module, transport, and message dependencies (host installed without deps).
    "dimos-lcm @ git+https://github.com/dimensionalOS/dimos-lcm.git@dd2159513ebfaa7ebc5fc32bf60209cd09aa1ca5",
    "eclipse-zenoh>=1.10.1,<2",
    "numpy>=1.26.4",
    "scipy>=1.10",
    "pydantic>=2",
    "pydantic-settings>=2",
    "reactivex>=4",
    "structlog>=25,<26",
    "typer>=0.19,<1",
    "python-dotenv",
    "annotation-protocol>=1.4",
    "plum-dispatch==2.5.7",
    "sortedcontainers",
    "toolz",
    "psutil>=7",
    "PyTurboJPEG==1.8.2",
    "typing-extensions",
    "rich",
    "PyYAML",
    "filelock",

    "lerobot[dataset,viz]==0.6.0",
    "mcap>=1.2",
    "opencv-contrib-python>=4.8,<5",
    "transformers[torch]>=5.4,<5.6",
]

[dependency-groups]
tests = [
    "mypy==1.19.0",
    "pytest==8.3.5",
    "pytest-mock>=3.14",
]

[tool.uv]
default-groups = []
override-dependencies = [
    # LeRobot's headless OpenCV wheel owns the same cv2/ tree as DimOS's
    # opencv-contrib-python dependency. Contrib is the required superset.
    "opencv-python-headless; sys_platform == 'never'",
    # LeRobot selects TorchCodec whenever it is importable, but its native wheel
    # cannot load against newer system FFmpeg ABIs. Use LeRobot's PyAV backend.
    "torchcodec; sys_platform == 'never'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dimos_lerobot*"]

[tool.pytest.ini_options]
testpaths = ["dimos_lerobot"]
python_files = ["*_tests.py"]
addopts = "--confcutdir=."

[tool.mypy]
files = ["dimos_lerobot/"]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "../../.."

[[tool.mypy.overrides]]
module = [
    "lerobot.configs.policies",
    "lerobot.datasets",
    "lerobot.datasets.lerobot_dataset",
    "lerobot.policies.factory",
    "lerobot.policies.pretrained",
    "lerobot.policies.utils",
    "lerobot.processor",
    "lerobot.types",
    "lerobot.utils.import_utils",
]
follow_untyped_imports = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcap", "mcap.*"]
follow_imports = "skip"
