[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-lerobot-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[dataset,viz]==0.6.0",
    "mcap>=1.2",
    "opencv-contrib-python>=4.8,<5",
    "transformers[torch]>=5.4,<5.6",
]

[dependency-groups]
learning = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "reactivex>=4,<7",
    "dimos-lcm>=0.1.6",
    "plum-dispatch>=2.5,<3",
    "python-dotenv>=1,<2",
    "structlog>=25,<27",
    "lz4>=4,<5",
    "scipy>=1.16,<2",
    "sortedcontainers>=2.4,<3",
    "PyTurboJPEG>=2,<3",
    "typing-inspect>=0.9,<1",
    "diskcache>=5,<6",
    "cloudpickle>=3,<4",
    "orjson>=3,<4",
    "pycdr2>=1,<2",
    "eclipse-zenoh>=1,<2",
    "pint>=0.25,<1",
    "loguru>=0.7,<1",
    "pyquaternion>=0.9,<1",
    "tenacity>=9,<10",
    "msgpack>=1,<2",
]
tests = [
    "mypy==1.19.0",
    "pytest==8.3.5",
    "pytest-mock>=3.14",
]

[tool.uv]
default-groups = []
override-dependencies = [
    # LeRobot's headless OpenCV wheel owns the same cv2/ tree as DimOS's
    # opencv-contrib-python dependency. Contrib is the required superset.
    "opencv-python-headless; sys_platform == 'never'",
    # LeRobot selects TorchCodec whenever it is importable, but its native wheel
    # cannot load against newer system FFmpeg ABIs. Use LeRobot's PyAV backend.
    "torchcodec; sys_platform == 'never'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dimos_lerobot*"]

[tool.pytest.ini_options]
testpaths = ["dimos_lerobot"]
addopts = "--confcutdir=."

[tool.mypy]
files = ["dimos_lerobot/"]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "../../.."

[[tool.mypy.overrides]]
module = [
    "lerobot.configs.policies",
    "lerobot.configs.types",
    "lerobot.datasets",
    "lerobot.datasets.lerobot_dataset",
    "lerobot.policies.factory",
    "lerobot.policies.pretrained",
    "lerobot.policies.utils",
    "lerobot.processor",
    "lerobot.types",
    "lerobot.utils.import_utils",
    "lerobot.utils.feature_utils",
]
follow_untyped_imports = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcap", "mcap.*"]
follow_imports = "skip"
