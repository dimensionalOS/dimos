[project]
name = "dimos-graspgenx-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["graspgenx", "matplotlib>=3.7.1"]

[dependency-groups]
lint = ["mypy==1.19.0"]
tests = ["pytest==8.3.5", "pytest-mock==3.15.0", "pytest-timeout==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["graspgenx_runtime"]
addopts = "--confcutdir=. --import-mode=importlib --timeout=60 -ra"

[tool.mypy]
files = ["graspgenx_runtime"]
python_version = "3.10"
strict = true
explicit_package_bases = true
exclude = "test_.*[.]py$"
# Check this project's code, while using imported dependencies for type information.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["dimos", "dimos.*", "graspgenx", "graspgenx.*"]
# Both packages ship annotated source without a py.typed marker.
follow_untyped_imports = true


[tool.uv]
default-groups = []
package = false
required-version = ">=0.9.25"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",
]
override-dependencies = [
    "torch==2.7.1; platform_machine == 'x86_64'",
    "torchvision==0.22.1; platform_machine == 'x86_64'",
    "numpy>=2; platform_machine == 'x86_64'",
    # JetPack 6 (Orin, CUDA 12.6): NVIDIA's torch is cp310-only and built on NumPy 1.x.
    "torch==2.8.0; platform_machine == 'aarch64'",
    "torchvision==0.23.0; platform_machine == 'aarch64'",
    "numpy>=1.26.4,<2; platform_machine == 'aarch64'",
    "yourdfpy>=0.0.60",
    "trimesh>=4.12",
    "timm>=1.0.17",
    "huggingface-hub>=0.30,<1",
    "diffusers>=0.29",
    "pyopengl>=3.1.5",
    # scene-synthesizer[recommend] wants usd-core, which has no cp310 aarch64 wheel; unused at inference.
    "usd-core; platform_machine == 'x86_64'",
    # scene-synthesizer also wants triangle, whose only aarch64 candidate is a 2020 sdist that no longer compiles; unused at inference.
    "triangle; platform_machine == 'x86_64'",
]

[tool.uv.sources]
graspgenx = { git = "https://github.com/NVlabs/GraspGenX.git", rev = "b9429097728cb1c430dd78b92edf17ba318aad03" }
torch = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "jetson-cu126", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "jetson-cu126", marker = "platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple"
explicit = true

[tool.uv.extra-build-dependencies]
sharedarray = ["setuptools>=45,<78"]
