[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-abc-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # DimOS module, transport, and message dependencies (host installed without deps).
    "dimos-lcm @ git+https://github.com/dimensionalOS/dimos-lcm.git@dd2159513ebfaa7ebc5fc32bf60209cd09aa1ca5",
    "eclipse-zenoh>=1.10.1,<2",
    "scipy>=1.10",
    "pydantic>=2",
    "pydantic-settings>=2",
    "reactivex>=4",
    "structlog>=25,<26",
    "typer>=0.19,<1",
    "python-dotenv",
    "annotation-protocol>=1.4",
    "plum-dispatch==2.5.7",
    "sortedcontainers",
    "toolz",
    "psutil>=7",
    "PyTurboJPEG==1.8.2",
    "typing-extensions",
    "rich",
    "PyYAML",
    "filelock",
    "numpy>=2,<3",
    "torch==2.11.0+cu128",
    "ftfy",
    "regex",
    "requests",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
tests = ["pytest==8.3.5", "pytest-mock>=3.14", "mypy==1.19.0"]

[tool.uv]
default-groups = []

[tool.setuptools.packages.find]
where = ["."]
include = ["dimos_abc*", "abc_minimal*"]

[tool.setuptools.package-data]
abc_minimal = ["UPSTREAM.md", "third_party/dinov3/LICENSE.md", "third_party/clip/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["dimos_abc"]
python_files = ["*_tests.py"]
addopts = "--confcutdir=."

[tool.mypy]
files = ["dimos_abc/"]
exclude = ["_tests[.]py$"]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "../../.."

[[tool.mypy.overrides]]
module = ["abc_minimal", "abc_minimal.*"]
follow_imports = "skip"
