schema: spec-driven

# Shown to AI when creating artifacts. Kept terse — the full rule sheet is
# openspec/CONVENTIONS.md; per-feature context lives in openspec/changes/<slug>/.
context: |
  dimos: DimensionalOS robot operating system (Python monorepo). Modules
  communicate via typed streams; blueprints compose them into robot stacks.
  Domains: hosted teleop (Go2 quadruped, xArm), manipulation (GraspGenX),
  perception, navigation, control, memory, simulation.

  MUST READ before implementing: openspec/CONVENTIONS.md (distilled dos/don'ts,
  commands, CI gates). Canonical long-form: AGENTS.md, docs/coding-agents/.

  Workflow essentials:
  - Always GIT_LFS_SKIP_SMUDGE=1 on git operations.
  - This branch (ruthwik/main) is a personal baseline; commits touching openspec/
    are prefixed "spec:" and must never reach origin/main
    (strip before PR: git rebase --onto origin/main ruthwik/main <feature-branch>).
  - One feature = one worktree; feature context goes in
    openspec/changes/<slug>/context.md (template: openspec/templates/feature-context.md).
  - Task status on Agent Board (`board` CLI): in_progress when starting,
    in_review when implemented; only the human moves cards to done.

  High-level direction: openspec/ROADMAP.md.

