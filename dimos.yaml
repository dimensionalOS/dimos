# What dimOS Desktop reads to install and run this version of dimos (fetched over HTTP per tag, no git needed).
name: dimos
version: "0.0.14"
requires:
  dimos-desktop: ">=0.2 <0.3"
  dimcode: ">=0.1 <0.2"
# env: REF (this tag/branch), COMMIT (its commit), DIMOS_DIR (checkout to create), NON_INTERACTIVE=1 when no one can answer prompts
install: |
  set -euo pipefail
  script="$(mktemp)"
  # at an exact commit the raw file is never stale; a branch's raw file stays cached for minutes after a push, so
  # without a commit ask GitHub's API (rate-limited without a token), then fall back to raw
  raw="https://raw.githubusercontent.com/dimensionalOS/dimos/${COMMIT:-$REF}/scripts/install.sh"
  if [ -n "${COMMIT:-}" ] && [ "$COMMIT" != "$REF" ]; then
    curl -fsSL "$raw" -o "$script"
  else
    curl -fsSL -H "Accept: application/vnd.github.raw" ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} \
      "https://api.github.com/repos/dimensionalOS/dimos/contents/scripts/install.sh?ref=$REF" -o "$script" \
      || curl -fsSL "$raw" -o "$script"
  fi
  bash "$script" --mode dev --branch "$REF" --project-dir "$DIMOS_DIR" --skip-tests ${NON_INTERACTIVE:+--non-interactive}
  "$DIMOS_DIR/.venv/bin/python" -c "import dimos" && echo "dimos is installed in $DIMOS_DIR"
# The /dimos HTTP API the dimos server serves: its semver (a breaking change is a major bump) and its OpenAPI document,
# which Desktop can read per tag without running anything. Regenerate it with `python -m dimos.server --write-openapi`.
api:
  version: "1.11.0"
  openapi: dimos/server/openapi.json
# Every robot dimos supports and what each blueprint is for (title, description, tags, modes and their essential args,
# the app to install): read per tag like the OpenAPI document. CI keeps it in step with the code
# (dimos/server/robots.py); the server serves it resolved at GET /dimos/robots.
robots: dimos/server/robots.json
# The dimos server (blueprints, runs, logs, events, global config, cloud uploads at /dimos/): dimos/server/, in
# Python. Before it, Desktop's Rust served the same API: "$DESKTOP_BIN" dimos-server --detach --dimos-dir ... --socket ...
# env: DESKTOP_BIN, DIMOS_DIR, DIMOS_SERVER_SOCKET, DIMOS_ZENOH_NAMESPACE (Desktop's <ns>), ZENOH_CONNECT,
# DIMOS_RECORDINGS_DIR (Desktop's recordings folder). Desktop reads start:/socket: from the checkout in dimos.dir.
start: |
  "$DIMOS_DIR/.venv/bin/python" -m dimos.server --detach --dimos-dir "$DIMOS_DIR" --socket "$DIMOS_SERVER_SOCKET"
socket: |
  echo "$DIMOS_SERVER_SOCKET"
