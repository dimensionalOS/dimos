[tool.uv]
required-version = ">=0.9.25"
exclude-newer = "7 days"
exclude-newer-package = { dimos-viewer = false, dimos-lcm = false, lcm-dimos-fork = false, roboplan = false, md-babel-py = false, can-motor-control = false, edgetam-dimos = false, dim-odom = false, eclipse-zenoh = false }
override-dependencies = [
    # ultralytics, unitree-sdk2py-dimos and unitree-webrtc-connect depend on
    # opencv-python, which ships the same cv2/ tree as our opencv-contrib-python
    # core dep and clobbers it. Contrib is a superset, so never install plain.
    "opencv-python; sys_platform == 'never'",
    # moondream pins pillow<11 but we need >=12.2.0 for security fixes
    # (CVE-2026-25990, CVE-2026-40192, CVE-2026-42311).
    "pillow>=12.2.0",
    "pytest==8.3.5", # because gtsam screwed up their dev dependencies
    # langgraph-prebuilt>=1.0.9 imports ExecutionInfo from langgraph.runtime,
    # which only exists in langgraph>=1.1; langchain==1.2.3 caps langgraph<1.1.
    "langgraph-prebuilt<=1.0.8",
    # opentelemetry-api>=1.39 requires importlib-metadata<8.8; without this cap
    # uv picks importlib-metadata>=9 and cascades the otel stack down to 1.11.1,
    # whose stale _pb2.py files crash with protobuf>=6.
    "importlib-metadata<8.8.0",
    # GraspGenX pins older versions that conflict with the current DimOS stack.
    # These versions were validated with the pinned GraspGenX source revision.
    "yourdfpy>=0.0.60",
    "trimesh>=4.12",
    "numpy>=2",
    "timm>=1.0.17",
    "huggingface-hub>=0.30,<1",
    "diffusers>=0.29",
    "pyopengl>=3.1.5",
    # Force the torch 2.7 line even if a transitive dep asks for newer.
    "torch>=2.1,<2.8",
    "torchvision>=0.16,<0.23",
]

[tool.uv.sources]
graspgenx = { git = "https://github.com/NVlabs/GraspGenX.git", rev = "b9429097728cb1c430dd78b92edf17ba318aad03" }
# CUDA builds are not published for macOS or non-x86_64 Linux. Those platforms
# fall back to PyPI.
torch = [
    { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
