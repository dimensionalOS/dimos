[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dimup"
version = "0.1.0"
description = "Prepare a machine and create DimOS SDK applications"
requires-python = ">=3.12"
dependencies = ["tomli-w>=1,<2"]

[project.scripts]
dimup = "dimup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.test_*"]

[tool.setuptools.package-data]
dimup = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "--import-mode=importlib"
norecursedirs = ["templates"]
