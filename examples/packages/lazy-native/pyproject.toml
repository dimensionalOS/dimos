[build-system]
requires = ["scikit-build-core>=1.0,<2", "dimos-build-config"]
build-backend = "scikit_build_core.build"

[project]
name = "dimos-lazy-native"
version = "0.1.0"
dynamic = ["entry-points"]
requires-python = ">=3.10,<3.13"
# Requires a host containing NativeModuleConfig.source_package (not released yet).
dependencies = ["dimos>=0.0.14,<0.1"]

[tool.dimos]
package = "src/dimos_lazy_native"

[tool.dimos.blueprints]
probe = "dimos_lazy_native.module:PackageProbe"
other = "dimos_lazy_native.module:OtherProbe"

[[tool.dynamic-metadata]]
provider = "dimos"
