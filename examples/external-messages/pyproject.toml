[build-system]
requires = ["setuptools>=70", "wheel", "dimos>=0.0.15"]
build-backend = "dimos.message_codegen.backend"

[project]
name = "acme-telemetry"
version = "0.1.0"
description = "An external message reusing the installed DimOS Header"
requires-python = ">=3.12"
dependencies = ["dimos>=0.0.15"]

[tool.dimos.messages]
source = "interfaces"

[tool.setuptools.package-data]
acme_telemetry = ["py.typed", "*.pyi", "**/*.pyi"]
acme_telemetry_schemas = ["schemas.json", "schemas/**/*", "package/**/*"]

[project.entry-points."dimos.messages"]
acme_telemetry = "acme_telemetry_schemas.provider"
