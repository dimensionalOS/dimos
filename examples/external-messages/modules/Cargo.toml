[package]
name = "acme-telemetry-module"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
acme-telemetry-messages = { version = "=0.1.0", path = ".." }
dimos-module = { version = "=0.1.0", features = ["cdr"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "telemetry_module"
path = "rust.rs"
