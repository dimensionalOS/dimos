[package]
name = "dimos-native-module-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ping"
path = "src/ping.rs"

[[bin]]
name = "pong"
path = "src/pong.rs"

[[bin]]
name = "tf_listener"
path = "src/tf_listener.rs"

[[bin]]
name = "tf_broadcaster"
path = "src/tf_broadcaster.rs"

[dependencies]
dimos-module = { git = "https://github.com/dimensionalOS/dimos", branch = "main" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
