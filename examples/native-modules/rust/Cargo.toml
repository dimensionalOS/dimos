[package]
name = "dimos-native-module-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ping"
path = "src/ping.rs"

[[bin]]
name = "pong"
path = "src/pong.rs"

[[bin]]
name = "tf_listener"
path = "src/tf_listener.rs"

[[bin]]
name = "tf_broadcaster"
path = "src/tf_broadcaster.rs"

[dependencies]
dimos-module.workspace = true
lcm-msgs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde.workspace = true
tracing.workspace = true
validator.workspace = true
