[package]
name = "dimos-native-module-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ping"
path = "src/ping.rs"

[[bin]]
name = "pong"
path = "src/pong.rs"

[[bin]]
name = "tf_listener"
path = "src/tf_listener.rs"

[[bin]]
name = "tf_broadcaster"
path = "src/tf_broadcaster.rs"

[dependencies]
dimos-module = { path = "../../../native/rust/dimos-module", version = "=0.2.0" }
dimos-generated-messages = { path = "../../../build/message-source/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
