# Overlay for hardware WebGL: the host runs one Xorg on the GPU (DISPLAY=:0 by
# default) and every worker renders through its socket, as the self-hosted CI
# runner does. Usage, before `dimos evals run --docker ...`:
#   export COMPOSE_FILE=docker/evals/compose.yaml:docker/evals/compose.gpu.yaml
services:
  worker:
    gpus: all
    environment:
      DIMSIM_RENDER: gpu
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
