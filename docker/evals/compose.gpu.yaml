# Overlay: render through the host's Xorg on the GPU (README.md, EC2 runbook).
#   export COMPOSE_FILE=docker/evals/compose.yaml:docker/evals/compose.gpu.yaml
services:
  worker:
    gpus: all
    environment:
      DIMSIM_RENDER: gpu
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
