name: CDR native interoperability

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIMOS_ALLOW_MISSING_COCKPIT: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.10
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang libclang-dev portaudio19-dev libturbojpeg ffmpeg
      - name: Install Python project and test dependencies
        run: uv sync --frozen --group tests
      - name: Test generated value adapters
        run: |
          uv run --no-sync pytest --noconftest --import-mode=importlib -o addopts='' -q \
            dimos/message_utils/test_image_views.py \
            dimos/message_utils/test_image_compression.py \
            dimos/message_utils/test_camera_info.py \
            dimos/message_utils/test_time.py \
            dimos/message_utils/test_geometry.py \
            dimos/message_utils/test_pointcloud.py \
            dimos/message_utils/test_pointcloud_colors.py \
            dimos/protocol/tf/test_buffer.py
      - name: Test SDK and build native consumers
        run: |
          cargo test --locked --manifest-path native/rust/dimos-module/Cargo.toml
          cargo test --locked --manifest-path native/rust/dimos-module-macros/Cargo.toml
          cargo test --locked --manifest-path dimos/mapping/ray_tracing/rust/Cargo.toml --lib
          cargo test --locked --manifest-path dimos/navigation/global_planner/mls_planner/rust/Cargo.toml --lib
          cargo test --locked --manifest-path dimos/navigation/local_planner/rust/Cargo.toml --features module,test-bodies
          cargo test --locked --manifest-path dimos/navigation/trajectory_follower/fancy/rust/Cargo.toml --features module
          cargo test --locked --manifest-path dimos/hardware/sensors/camera/v4l2/rust/Cargo.toml --lib
          cargo check --locked --manifest-path dimos/perception/depth2depth_cloud/rust/Cargo.toml --lib
          cargo check --locked --manifest-path dimos/hardware/sensors/camera/realsense/rust/Cargo.toml --all-targets --features docs-only
          cargo build --locked --manifest-path dimos/mapping/ray_tracing/rust/Cargo.toml --bin voxel_ray_tracing
          cargo build --locked --manifest-path dimos/navigation/global_planner/mls_planner/rust/Cargo.toml --bin mls_planner
          cargo build --locked --manifest-path dimos/navigation/local_planner/rust/Cargo.toml --features module --bin local_planner
          cargo build --locked --manifest-path dimos/navigation/trajectory_follower/fancy/rust/Cargo.toml --features module --bin trajectory_follower
      - name: Prepare DimSim dependencies
        working-directory: misc/DimSim/cli
        run: deno install --node-modules-dir=auto --entrypoint bridge/cdr_test.ts
      - name: Exchange generated messages with real native and TypeScript consumers
        run: |
          export DIMOS_NATIVE_RAY_TRACING_BINARY="$CARGO_TARGET_DIR/debug/voxel_ray_tracing"
          export DIMOS_NATIVE_MLS_BINARY="$CARGO_TARGET_DIR/debug/mls_planner"
          export DIMOS_NATIVE_LOCAL_PLANNER_BINARY="$CARGO_TARGET_DIR/debug/local_planner"
          export DIMOS_NATIVE_FOLLOWER_BINARY="$CARGO_TARGET_DIR/debug/trajectory_follower"
          export DIMOS_DIMSIM_DENO="$(command -v deno)"
          uv run --no-sync pytest --noconftest --import-mode=importlib -o addopts='' -q \
            dimos/mapping/ray_tracing/test_generated_native.py \
            dimos/navigation/global_planner/mls_planner/test_generated_native.py \
            dimos/navigation/local_planner/test_generated_native.py \
            dimos/robot/unitree/test_dimsim_connection.py \
            dimos/navigation/trajectory_follower/fancy/test_generated_native.py \
            dimos/hardware/sensors/camera/realsense/test_camera.py \
            dimos/perception/depth2depth_cloud/test_depth2depth_cloud_config.py
