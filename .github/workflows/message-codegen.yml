name: message-codegen

on:
  pull_request:
    paths:
      - dimos/message_codegen/**
      - examples/message-codegen/**
      - examples/message-project/**
      - packages/dimos-generated/**
      - docs/development/messages*.md
      - docs/development/message-reference.md
      - scripts/*message*codegen*
      - scripts/test_message_packages.sh
      - scripts/package_messages.sh
      - scripts/test_message_mcap.sh
      - dimos/protocol/cdr_mcap.py
      - dimos/protocol/test_cdr_mcap.py
      - dimos/protocol/pubsub/impl/*ros*.py
      - scripts/vendor_message_definitions.py
      - scripts/generate_builtin_messages.py
      - scripts/test_builtin_message_source.sh
      - .github/workflows/message-codegen.yml
      - .github/docker/message-codegen-reference.Dockerfile
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up a ROS-free Python environment
        run: |
          test ! -d /opt/ros
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python ruff==0.14.3 rosbags==0.11.0 numpy PyYAML==6.0.3 pytest pytest-asyncio pytest-env lcm-dimos-fork setuptools wheel mcap==1.4.0 rerun-sdk==0.32.0 pillow mypy==1.19.0
          .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('rclpy') is None"
      - name: Reject checked-in generated source drift
        run: .venv/bin/python -m scripts.generate_builtin_messages --check
      - name: Install built-in source without message compilers
        run: bash scripts/test_builtin_message_source.sh
      - name: Build the pinned standalone CDR library
        run: bash scripts/setup_message_codegen.sh
      - name: Generate, build, test, and demonstrate all three languages
        run: bash scripts/test_message_codegen.sh
      - name: Build and consume wheel, sdist, CMake, and Cargo packages
        run: bash scripts/test_message_packages.sh
      - name: Build standalone message authoring and built-in packages
        run: |
          uv build dimos/message_codegen --out-dir build/message-codegen/ux-wheelhouse
          uv build packages/dimos-generated --out-dir build/message-codegen/ux-wheelhouse
          uv venv --seed build/message-codegen/download-env
          build/message-codegen/download-env/bin/python -m pip download --only-binary=:all: --dest build/message-codegen/ux-wheelhouse setuptools wheel packaging numpy rosbags==0.11.0
      - name: Verify custom package ownership, rebuilds, and isolated pip installs
        env:
          DIMOS_FASTCDR_PREFIX: ${{ github.workspace }}/build/message-codegen/install
          DIMOS_MESSAGE_WHEELHOUSE: ${{ github.workspace }}/build/message-codegen/ux-wheelhouse
        run: |
          .venv/bin/python -m pytest -o addopts="" --noconftest -q \
            dimos/message_codegen/test_project.py \
            dimos/message_codegen/test_repository_tutorial.py \
            dimos/message_codegen/test_ownership.py \
            dimos/message_codegen/test_ownership_native.py \
            dimos/message_codegen/test_project_install.py
      - name: Package matching built-in CMake and Rust artifacts
        run: bash scripts/package_messages.sh
      - name: Consume relocated built-in native packages
        env:
          DIMOS_BUILTIN_PACKAGE: ${{ github.workspace }}/build/message-codegen/release
          DIMOS_FASTCDR_PREFIX: ${{ github.workspace }}/build/message-codegen/install
        run: .venv/bin/python -m pytest -o addopts="" --noconftest -q dimos/message_codegen/test_builtin_artifacts.py
      - name: Retain standalone message build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: message-authoring-packages
          path: |
            build/message-codegen/ux-wheelhouse/dimos*
            build/message-codegen/release/dist/*
      - name: Record generated CDR and verify both viewer decoders
        run: bash scripts/test_message_mcap.sh
      - name: Retain self-contained recording and viewer evidence
        uses: actions/upload-artifact@v7
        with:
          name: message-mcap-evidence
          path: |
            build/message-codegen/viewers/demo.mcap
            build/message-codegen/viewers/demo.rrd
            build/message-codegen/viewers/evidence/
      - name: Retain external application and packages
        uses: actions/upload-artifact@v7
        with:
          name: message-package-evidence
          path: |
            build/message-codegen/external-app/evidence/
            build/message-codegen/external-app/dist/
            build/message-codegen/external-app/generated/rust/target/package/*.crate
      - name: Retain the standalone Python source for ROS bridge verification
        uses: actions/upload-artifact@v7
        with:
          name: message-codegen-python-source
          path: build/message-codegen/demo/python/
          if-no-files-found: error
      - name: Retain executable demo evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: message-codegen-evidence
          path: build/message-codegen/demo/evidence/
          if-no-files-found: error

  jazzy-reference:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: message-codegen-evidence
          path: build/message-codegen/demo/evidence/
      - uses: actions/download-artifact@v8
        with:
          name: message-codegen-python-source
          path: build/message-codegen/demo/python/
      - name: Build independent ROS2 reference environment
        run: docker build -f .github/docker/message-codegen-reference.Dockerfile -t dimos-cdr-jazzy-reference .github/docker
      - name: Compare native payloads with independently generated ROS2 types
        run: |
          docker run --rm \
            -v "$PWD:/source:ro" \
            -v "$PWD/build/message-codegen/demo:/demo" \
            dimos-cdr-jazzy-reference '
              set -e
              source /opt/ros/jazzy/setup.bash
              mkdir -p /tmp/reference/src
              cp -r /source/examples/message-codegen/demo_msgs /tmp/reference/src/
              cd /tmp/reference
              colcon build --packages-select demo_msgs --event-handlers console_direct+
              source install/setup.bash
              python3 /source/examples/message-codegen/demo_ros_reference.py --build /demo
            ' | tee build/message-codegen/demo/evidence/jazzy-reference.txt
      - uses: actions/upload-artifact@v7
        with:
          name: message-codegen-jazzy-reference
          path: build/message-codegen/demo/evidence/
