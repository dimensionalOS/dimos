name: message-codegen

on:
  pull_request:
    paths:
      - setup.py
      - MANIFEST.in
      - packages/dimos-generated/**
      - scripts/*builtin*
      - examples/message-package/**
      - dimos/message_codegen/**
      - dimos/experimental/memory/**
      - dimos/memory/codecs/cdr.py
      - docs/development/cdr-recording.md
      - native/cpp/include/dimos/native/cdr_codec.hpp
      - docs/development/message-source-packages.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/message-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12 --seed
          uv pip install --python .venv/bin/python 'dimos-cdrgen[native,prepare]==0.1.1' numpy build pybind11 'deno==2.6.10' pytest pytest-mock pytest-asyncio pytest-env
      - name: Verify DimOS SDK, installed Python consumer and C++ consumer
        run: |
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' -q dimos/message_codegen/test_integration.py dimos/message_codegen/test_build.py
      - name: Build main wheel and self-contained sdist
        run: |
          source .venv/bin/activate
          python -m build --no-isolation
      - name: Prepare offline acceptance wheelhouse
        run: .venv/bin/python -m pip wheel 'dimos-cdrgen[prepare]==0.1.1' 'deno==2.6.10' 'setuptools>=70' wheel pybind11 --wheel-dir build/bundle-wheelhouse
      - name: Verify installed main wheel, source, editable and external type identity
        env:
          DIMOS_BUNDLE_DIST: ${{ github.workspace }}/dist
          DIMOS_BUNDLE_WHEELHOUSE: ${{ github.workspace }}/build/bundle-wheelhouse
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_bundled.py

  native-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install native recording test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm pkg-config libsqlite3-dev
          uv venv .record-review --python 3.12 --seed
          .record-review/bin/python -m pip install -e . mcap pytest pytest-mock pytest-env pytest-asyncio
      - name: Verify schema planning and wrapper compatibility
        run: .record-review/bin/python -m pytest --noconftest -o addopts='' -q dimos/experimental/memory/test_cdr_schema.py dimos/experimental/memory/test_rust_recorder.py
      - name: Verify native CDR storage and legacy codec tests
        run: |
          cargo test --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --lib --jobs 2
          cargo clippy --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --lib --no-deps --jobs 2 -- -D warnings
          cargo build --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --bin dimos-memory-recorder --jobs 2
      - name: Verify actual native recording and Python replay
        env:
          DIMOS_MEMORY_RECORDER_TEST_EXECUTABLE: ${{ github.workspace }}/target/debug/dimos-memory-recorder
        run: |
          .record-review/bin/python -m pytest --noconftest -o addopts='' -o 'markers=self_hosted: native recording acceptance' -q dimos/experimental/memory/test_rust_recorder_e2e.py -k cdr_native
