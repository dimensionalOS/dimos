name: message-codegen

on:
  pull_request:
    paths:
      - setup.py
      - MANIFEST.in
      - packages/dimos-generated/**
      - scripts/*builtin*
      - dimos/msgs/*.py
      - dimos/msgs/nav_msgs/OccupancyGrid.py
      - examples/message-package/**
      - dimos/message_codegen/**
      - native/cpp/include/dimos/native/cdr_codec.hpp
      - docs/development/message-source-packages.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/message-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12 --seed
          uv pip install --python .venv/bin/python 'dimos-cdrgen[native,prepare]==0.1.1' numpy build pybind11 'deno==2.6.10' pytest pytest-mock pytest-asyncio pytest-env
      - name: Verify DimOS SDK, installed Python consumer and C++ consumer
        run: |
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' -q dimos/message_codegen/test_integration.py dimos/message_codegen/test_build.py
      - name: Build main wheel and self-contained sdist
        run: |
          source .venv/bin/activate
          python -m build --no-isolation
      - name: Prepare offline acceptance wheelhouse
        run: .venv/bin/python -m pip wheel 'dimos-cdrgen[prepare]==0.1.1' 'deno==2.6.10' 'setuptools>=70' wheel pybind11 --wheel-dir build/bundle-wheelhouse
      - name: Verify installed main wheel, source, editable and external type identity
        env:
          DIMOS_BUNDLE_DIST: ${{ github.workspace }}/dist
          DIMOS_BUNDLE_WHEELHOUSE: ${{ github.workspace }}/build/bundle-wheelhouse
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_bundled.py


      - name: Verify installed generated-value utilities
        run: |
          uv venv .values-review --python 3.12 --seed
          .values-review/bin/python -m pip install dist/*.whl pytest pytest-mock pytest-env
          .values-review/bin/python -I -m pytest --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/msgs/test_time.py" "$PWD/dimos/msgs/test_geometry.py" "$PWD/dimos/msgs/test_camera_info.py" "$PWD/dimos/msgs/test_image_views.py" "$PWD/dimos/msgs/test_image_compression.py" "$PWD/dimos/msgs/test_pointcloud.py" "$PWD/dimos/msgs/test_pointcloud_colors.py" "$PWD/dimos/msgs/test_occupancy.py"

  clean-generator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python 'dimos-cdrgen==0.1.1' numpy build pytest pytest-asyncio pytest-env
      - name: Verify SDK discovery and installed Python consumer without pip
        run: |
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("pip") is None'
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m 'not native_e2e' -q dimos/message_codegen/test_integration.py
      - name: Verify compiled C++ consumer
        run: |
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m native_e2e -q dimos/message_codegen/test_integration.py
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("catkin_pkg") is None'
