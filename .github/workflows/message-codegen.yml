name: message-codegen
# CI integration check for the CDR message codegen layer. It runs the one test
# file under dimos/message_codegen/ against the published dimos-cdrgen library,
# on Linux and macOS, in a clean virtualenv without the dimOS dev environment.

on:
  pull_request:
    paths:
      - dimos/message_codegen/**
      - native/cpp/include/dimos/native/cdr_codec.hpp
      - docs/development/message-source-packages.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/message-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python 'dimos-cdrgen==0.1.0' numpy build pytest pytest-asyncio pytest-env
      - name: Verify SDK discovery and installed Python consumer without pip
        run: |
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("pip") is None'
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m 'not native_e2e' -q dimos/message_codegen/test_integration.py
      - name: Verify compiled C++ consumer
        run: |
          uv pip install --python .venv/bin/python 'dimos-cdrgen[native]==0.1.0'
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m native_e2e -q dimos/message_codegen/test_integration.py
