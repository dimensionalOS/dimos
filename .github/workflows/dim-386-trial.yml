name: DIM-386 macOS trial

on:
  push:
    branches: [paul/fix/enable-macos-tests]

permissions:
  contents: read

jobs:
  trial:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
      UV_PYTHON_PREFERENCE: only-managed
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/pyo3
          key: pyo3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: pyo3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          brew install portaudio
          uv sync --group tests --frozen
          uv run python bin/pyo3-extensions --build
      - name: Disable only the macOS collection skip condition
        run: |
          cat > "$RUNNER_TEMP/dim386_trial.py" <<'PY'
          from unittest.mock import patch

          import pytest


          @pytest.hookimpl(wrapper=True, tryfirst=True)
          def pytest_collection_modifyitems(config, items):
              with patch("dimos.conftest._is_macos", return_value=False):
                  yield
          PY
      - name: Trial the skipped tests
        run: |
          PYTHONPATH="$RUNNER_TEMP:$PWD" uv run pytest -p dim386_trial --no-cov \
            --error-for-skips -m 'skipif_macos or skipif_macos_bug' \
            dimos/core/coordination/test_worker.py \
            dimos/utils/test_reactive.py \
            dimos/mapping/ray_tracing/utils/test_loaded_map.py \
            dimos/mapping/ray_tracing/test_transformer.py \
            dimos/mapping/relocalization/lidar/test_replay.py \
            dimos/imitation/collection/test_recorder.py
