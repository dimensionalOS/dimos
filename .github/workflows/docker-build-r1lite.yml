name: docker-build-r1lite

# Development image for the Galaxea R1 Lite, built on the org's
# self-hosted runners and pushed with the workflow token, so no personal
# credential is involved.
#
# workflow_dispatch only registers once this file reaches the default
# branch; until then the registered docker-build workflow calls this one
# (workflow_call) and is dispatched with --ref on the feature branch.

on:
  workflow_dispatch:
    inputs:
      dev-number:
        description: "N in the <version>-r1lite-dev.N tag (digits only)"
        required: false
        default: "0"
  workflow_call:
    inputs:
      dev-number:
        type: string
        required: false
        default: "0"

jobs:
  build:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    # Job-level so it applies on both the dispatch and workflow_call
    # paths: one publisher per dev tag at a time, so a second run with
    # the same input waits instead of racing the first between push and
    # digest capture.
    concurrency:
      group: docker-build-r1lite-publish-${{ inputs.dev-number || '0' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEV_NUMBER: ${{ inputs.dev-number || '0' }}

    steps:
      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true

      - uses: actions/checkout@v7

      # The image builds release-grade wheels (CIBUILDWHEEL=1), which
      # require web/cockpit/dist in the build context — same step the
      # release workflow runs.
      - name: Build the Cockpit
        uses: ./.github/actions/build-cockpit

      - name: Compute tags
        id: tag
        run: |
          if ! printf '%s' "$DEV_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "dev-number must be digits only, got: $DEV_NUMBER" >&2
            exit 1
          fi
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          IMAGE=ghcr.io/dimensionalos/dimos-r1lite
          {
            echo "version=${VERSION}-r1lite-dev.${DEV_NUMBER}"
            echo "dev_tag=${IMAGE}:${VERSION}-r1lite-dev.${DEV_NUMBER}"
            echo "sha_tag=${IMAGE}:sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # required for github cache of docker layers
      - uses: crazy-max/ghaction-github-runtime@v4

      # required for github cache of docker layers
      - uses: docker/setup-buildx-action@v4.2.0
        with:
          driver: docker-container
          use: true

      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          push: true
          context: .
          file: docker/galaxea-r1lite/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.dev_tag }}
            ${{ steps.tag.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/dimensionalOS/dimos
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=galaxea-r1lite
          cache-to: type=gha,mode=max,scope=galaxea-r1lite

      # A pushed image that cannot discover its own publisher is dead on a
      # robot; the 2026-07-28 factory-fresh session lost its last half hour
      # to exactly that symptom. Pull the pushed artifact (buildx keeps no
      # local copy) and prove pub/echo discovery before calling the build
      # good.
      - name: DDS discovery self-test
        run: |
          IMG="ghcr.io/dimensionalos/dimos-r1lite@${{ steps.build.outputs.digest }}"
          docker pull -q "$IMG"
          docker run --rm --network host --entrypoint dds-selftest "$IMG"

      # The import gate cannot see module-START failures (missing runtime
      # deps, unwritable paths, absent data files): the 2026-08-04
      # rehearsal found five of those in a row. Boot the sim blueprint —
      # ungated, no vendor stack — and require every module to reach
      # 'started' with the process still alive afterward. Root + NET_ADMIN
      # lets the LCM configurator fix lo multicast inside the container's
      # own netns.
      - name: Sim blueprint boot test
        run: |
          IMG="ghcr.io/dimensionalos/dimos-r1lite@${{ steps.build.outputs.digest }}"
          docker rm -f r1lite-sim-boot 2>/dev/null || true
          docker run -d --name r1lite-sim-boot --user root --cap-add NET_ADMIN \
            "$IMG" run r1lite-quest-teleop-sim
          sleep 90
          docker logs r1lite-sim-boot > sim_boot.log 2>&1 || true
          alive=$(docker inspect -f '{{.State.Running}}' r1lite-sim-boot 2>/dev/null || echo false)
          docker rm -f r1lite-sim-boot >/dev/null 2>&1 || true
          grep -q "Quest Teleoperation Module started" sim_boot.log \
            && grep -q "ManipulationModule started" sim_boot.log \
            && grep -q "ControlCoordinator started" sim_boot.log \
            || { echo "sim boot did not reach started modules"; tail -40 sim_boot.log; exit 1; }
          [ "$alive" = "true" ] || { echo "sim exited early"; tail -40 sim_boot.log; exit 1; }
          echo "sim blueprint boot: PASS"

      - name: Record immutable identity
        run: |
          {
            echo "## dimos-r1lite image"
            echo "- revision: \`${GITHUB_SHA}\`"
            echo "- dev tag: \`${{ steps.tag.outputs.dev_tag }}\`"
            echo "- sha tag: \`${{ steps.tag.outputs.sha_tag }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- dds-selftest: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}"
