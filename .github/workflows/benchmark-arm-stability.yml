name: benchmark-arm-stability

# TEMPORARY: how repeatable are the instruction counts on the arm runners?
# Five runners, two runs each, all on the same code. The steps mirror the
# `benchmark` job in ci.yml. Delete once answered.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/benchmark-arm-stability.yml'

permissions: {}

jobs:
  measure:
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read  # For checkout
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5]
    env:
      RUNNER: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache the replay dataset archive
        uses: actions/cache@v6
        with:
          path: data/.lfs/go2_short.db.tar.gz
          key: lfs-go2-short-${{ hashFiles('data/.lfs/go2_short.db.tar.gz') }}
      - name: Fetch the replay dataset from LFS if not cached
        run: |
          if git lfs pointer --check --file data/.lfs/go2_short.db.tar.gz; then
            git lfs pull --include="data/.lfs/go2_short.db.tar.gz" --exclude=""
          else
            echo "archive already smudged"
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libturbojpeg
      - name: Raise UDP receive buffers for LCM
        run: sudo sysctl -w net.core.rmem_max=67108864 net.core.rmem_default=67108864
      - name: Install perf
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" ||
            sudo apt-get install -y linux-tools-generic
          sudo ln -sfn "$(ls /usr/lib/linux-tools/*/perf | head -1)" /usr/local/bin/perf
          sudo sysctl -w kernel.perf_event_paranoid=2
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group tests --frozen
        env:
          UV_COMPILE_BYTECODE: "1"
      - name: Compile the dimos bytecode
        run: uv run python -m compileall -q dimos
      - name: Pre-extract the replay database
        run: uv run python -c "from dimos.utils.data import get_data; print(get_data('go2_short.db'))"
      - name: Precompile the numba kernels
        run: |
          uv run python -c "
          import numpy as np
          from dimos.mapping.pointclouds.occupancy import height_cost_occupancy
          from dimos.msgs.sensor_msgs.PointCloud2 import PointCloud2

          points = np.array([[0.0, 0.0, 0.0], [1.0, 1.0, 1.0]], dtype=np.float32)
          height_cost_occupancy(PointCloud2.from_numpy(points, timestamp=1.0))
          "
      - name: Flush pending writeback
        run: sync
      - name: Run the replay twice
        run: |
          for i in 1 2; do
            DIMOS_BENCH_METRICS="metrics-$RUNNER-$i.json" \
              uv run pytest -m '' --no-cov dimos/robot/unitree/go2/test_replay_benchmark.py
          done
        env:
          DIMOS_BENCH_PERF_EVENTS: instructions:u,cycles:u
          PYTHONHASHSEED: "0"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-${{ matrix.runner }}
          path: |
            metrics-*.json
            metrics-*.perf.csv

  summarise:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: metrics-*
          merge-multiple: true
      - name: Spread per series
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, statistics as st
          from pathlib import Path
          runs = {p.stem: {b["name"]: b["value"] for b in json.loads(p.read_text())} for p in sorted(Path().glob("metrics-*.json"))}
          print(f"{len(runs)} runs: {', '.join(runs)}\n")
          print("| series | min | median | max | CV | range/median | within-runner |")
          print("|---|---|---|---|---|---|---|")
          for name in runs[next(iter(runs))]:
              v = [r[name] for r in runs.values() if name in r]
              med, mean = st.median(v), st.fmean(v)
              cv = 100 * st.stdev(v) / mean if len(v) > 1 and mean else 0
              spread = 100 * (max(v) - min(v)) / med if med else 0
              # the two runs on the same runner, as a % of their mean
              pairs = [(runs[f"metrics-{n}-1"][name], runs[f"metrics-{n}-2"][name]) for n in range(1, 6)
                       if f"metrics-{n}-1" in runs and f"metrics-{n}-2" in runs and name in runs[f"metrics-{n}-1"]]
              within = max((200 * abs(a - b) / (a + b) for a, b in pairs if a + b), default=0)
              print(f"| {name} | {min(v):.3f} | {med:.3f} | {max(v):.3f} | {cv:.2f}% | {spread:.2f}% | ≤{within:.2f}% |")
          EOF
