name: Deploy docs

# The rendered site is served straight from the working tree of the pages
# repo, so deploying is a build and a sync. bin/docs-deploy does exactly what
# it does locally; this workflow only supplies the checkout and the key.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "misc/mkdocs/**"
      - "README.md"
      - "assets/readme/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs media is LFS-tracked. Without this the build copies 130
          # byte pointer files where the images should be, and every diagram
          # on the site is quietly broken.
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Check out the pages repo
        uses: actions/checkout@v7
        with:
          repository: dimensionalOS/dimensionalOS.github.io
          path: pages
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Build, stage and commit
        run: |
          git -C pages config user.name "dimos-docs-bot"
          git -C pages config user.email "noreply@dimensionalos.com"
          bin/docs-deploy --pages-repo pages --target . --commit

      # docs-deploy exits without committing when the build is byte-identical,
      # so an unchanged run pushes nothing rather than failing.
      - name: Push
        working-directory: pages
        run: git push
