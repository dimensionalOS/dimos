name: deployment-profile

# Records what a full dimos deployment costs -- CPU time and peak memory across
# the whole process tree -- and pushes the numbers to Bencher for a trend line.
# Record-only on purpose: no thresholds, so this never fails a build. Watch the
# noise band on real runs first, then decide whether any of it deserves a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run the deployment
        default: "180"
      blueprint:
        description: Blueprint to run under replay
        default: unitree-go2
      db:
        description: Recording to replay
        default: go2_short

permissions:
  contents: read
  pull-requests: write # Bencher posts the results table as a PR comment

# A superseded profile is wasted runner time, and its numbers are stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # The CLI rejects a project key passed as --token; it wants BENCHER_API_KEY.
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
      PROFILE_SECONDS: ${{ inputs.seconds || '180' }}
      PROFILE_BLUEPRINT: ${{ inputs.blueprint || 'unitree-go2' }}
      PROFILE_DB: ${{ inputs.db || 'go2_short' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      # Pinned: a moving interpreter would move the numbers this job exists to
      # compare. Same version the cockpit e2e runs a real deployment on.
      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libturbojpeg
      # What a go2 install pulls, not what a test env pulls: default-groups is
      # ['tests'], so a plain `uv sync` would add pytest we never run.
      - name: Install dimos
        run: uv sync --frozen --no-default-groups --extra unitree

      # Out of the measured window on purpose: an LFS pull inside it would show
      # up as system time and wall, and the recording is not what we profile.
      - name: Fetch the replay recording
        run: |
          uv run python -c "
          from dimos.memory2.replay import resolve_db_path
          print(resolve_db_path('$PROFILE_DB'))
          "

      # Its own benchmark, so the comment gets a second row instead of five
      # more columns. Safe with percentage thresholds, which compare each
      # benchmark to its own history rather than to one shared limit.
      - name: Profile cold start
        run: |
          bin/rusage --name "$PROFILE_BLUEPRINT-coldstart" --out coldstart.json -- \
            timeout --kill-after=60s 300 \
            uv run dimos --replay --replay-db "$PROFILE_DB" --viewer none \
            --run-for 0 run "$PROFILE_BLUEPRINT"

      - name: Measure install size
        run: |
          printf '{"venv": {"install-size-mib": {"value": %s}}}\n' \
            "$(du -sm .venv | cut -f1)" >size.json

      - name: Profile a replay deployment
        run: |
          # --run-for ends the run cleanly; the outer timeout is a backstop, so
          # reaching it (124) is a hung teardown and should fail the job.
          bin/rusage --name "$PROFILE_BLUEPRINT-replay" --out rusage.json -- \
            timeout --kill-after=60s "$((PROFILE_SECONDS + 120))" \
            uv run dimos --replay --replay-db "$PROFILE_DB" --viewer none \
            --run-for "$PROFILE_SECONDS" run "$PROFILE_BLUEPRINT"

      # One BMF object, one benchmark per top-level key. Tolerant of a missing
      # file so a failed run still reports whatever it did measure.
      - name: Merge metrics
        if: always()
        run: |
          files=$(ls rusage.json coldstart.json size.json 2>/dev/null) || true
          [ -n "$files" ] || exit 0
          jq -s 'reduce .[] as $x ({}; . * $x)' $files >metrics.json
          cat metrics.json
          # The user/sys split is diagnostic -- worth having in the artifact
          # when a number moves, not worth two more columns on every comment.
          jq 'map_values(del(."cpu-user-seconds", ."cpu-system-seconds"))' \
            metrics.json >bencher.json

      - name: Job summary
        if: always()
        run: |
          [ -f metrics.json ] || exit 0
          {
            echo '### Deployment resource footprint'
            echo '```json'
            cat metrics.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rusage
          path: metrics.json

      - name: Record in Bencher
        if: always() && env.BENCHER_API_KEY != ''
        uses: bencherdev/bencher@main
      - name: Push metrics
        if: always() && env.BENCHER_API_KEY != ''
        run: |
          bencher run \
            --project dimos \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --testbed ubuntu-latest \
            --adapter json \
            --github-actions "${{ secrets.GITHUB_TOKEN }}" \
            --file bencher.json
