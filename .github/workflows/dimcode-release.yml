name: dimcode prerelease

on:
  push:
    tags: ['dimcode-v*-next.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimcode-prerelease
  cancel-in-progress: false

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/npm-shrinkwrap.json
      - run: npm ci
      - run: npm run check
      - run: sh -n install.sh

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Validate release identity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json"));
            if (p.name !== "@spomichter/dimcode" || !/^\d+\.\d+\.\d+-next\.\d+$/.test(p.version) || process.env.GITHUB_REF !== `refs/tags/dimcode-v${p.version}`) process.exit(1);
          '
      - run: npm ci && npm run build
      - run: npm pack
      - name: Publish npm next
        run: npm publish ./spomichter-dimcode-*.tgz --tag next --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DIMCODE_NPM_TOKEN }}
      - name: Publish installer and package
        run: |
          gh release create "$GITHUB_REF_NAME" ./spomichter-dimcode-*.tgz install.sh \
            --title "dimcode ${GITHUB_REF_NAME#dimcode-v}" --prerelease \
            --notes 'Dimcode test release: private Node bootstrap, agent-led DimOS installation, persistent Pi sessions and inline memory visualization. Linux x64/arm64 and Apple Silicon installer; Linux and macOS package checks run before publication.'
        env:
          GH_TOKEN: ${{ github.token }}
