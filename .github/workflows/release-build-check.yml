# release.yml is dispatch-only, so changes to it (including dependabot bumps of
# pypa/cibuildwheel) merge without ever being executed. This smoke-builds one wheel
# and the sdist at PR time so release-build breakage surfaces before release day.
name: release-build-check

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-build-check.yml
      - .github/actions/build-cockpit/action.yml
      - .github/scripts/check_sdist.py
      - .github/scripts/wheel_smoke.py
      - .github/scripts/native_wheel_smoke.py
      - dimos/experimental/memory/**
      - dimos/memory/**
      - dimos/core/native_module.py
      - dimos/core/transport.py
      - native/rust/**
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - web/cockpit/**
      - web/sdk/**
      - web/shared/**
      - web/deno.json
      - web/deno.lock
      - dimos/utils/deno.py
      - dimos/native_packages.json
      - dimos/core/native_package.py

permissions: {}

jobs:
  build-one-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep in sync with the build-wheels env in release.yml
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
      CIBW_TEST_COMMAND: "python {project}/.github/scripts/wheel_smoke.py"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build cockpit dist
        uses: ./.github/actions/build-cockpit
      - name: Build one wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ENVIRONMENT: DIMOS_BUILD_REVISION=${{ github.sha }}
        with:
          only: cp312-manylinux_x86_64

      - name: Upload wheel for installed native integration
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke-wheel
          path: wheelhouse/*.whl

  native-wheel-smoke:
    needs: build-one-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: native-smoke-wheel
          path: wheelhouse
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install Nix
        env:
          INPUT_EXTRA_NIX_CONFIG: |
            extra-substituters = https://dimensionalos.cachix.org
            extra-trusted-public-keys = dimensionalos.cachix.org-1:20ynj6TjpoD3qTxkdNoeHtgs2G2pNvgAq1EQYLTHJXI=
        run: bash docker/ros/install-nix.sh
      - name: Install core wheel outside the checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/native-wheel-env"
          uv pip install --python "$RUNNER_TEMP/native-wheel-env/bin/python" wheelhouse/*.whl
      - name: Prepare, record, reopen, and inspect SQLite and MCAP
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/native-wheel-env/bin/python" "$GITHUB_WORKSPACE/.github/scripts/native_wheel_smoke.py"

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build cockpit dist
        uses: ./.github/actions/build-cockpit
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Build sdist
        run: uv build --sdist
      - name: Check sdist contents
        run: python3 .github/scripts/check_sdist.py dist/*.tar.gz
