<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dimensional cloud login</title>
        <style>
            :root {
                --bg: #0b0d10;
                --panel: #11151a;
                --line: #262c34;
                --text: #e6e8eb;
                --dim: #8a929c;
                --accent: #3d7bff;
                --bad: #ff6b6b;
                --good: #3ecf8e;
                --radius: 0;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                padding: 16px;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.45 Inter, system-ui, sans-serif;
            }
            .panel {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: var(--radius);
                padding: 16px;
                max-width: 420px;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--dim);
            }
            p { margin: 8px 0; }
            .code {
                font: 600 28px/1.2 "IBM Plex Mono", ui-monospace, monospace;
                letter-spacing: 0.12em;
                margin: 12px 0;
                user-select: all;
            }
            button, a.button {
                display: inline-block;
                font: inherit;
                font-weight: 500;
                padding: 8px 14px;
                border-radius: var(--radius);
                cursor: pointer;
                text-decoration: none;
                border: 1px solid var(--accent);
                background: var(--accent);
                color: #fff;
            }
            button.quiet { background: transparent; color: var(--text); border-color: var(--line); }
            .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
            .dim { color: var(--dim); font-size: 12px; }
            .bad { color: var(--bad); }
            .good { color: var(--good); }
            [hidden] { display: none !important; }
        </style>
        <!-- the light theme: the OS's choice, unless ?theme=light|dark picks one (the script sets media) -->
        <style id="light-theme" media="(prefers-color-scheme: light)">
            :root {
                --bg: #f5f4ef;
                --panel: #ffffff;
                --line: #dcdad2;
                --text: #1b1c1f;
                --dim: #6b6d72;
                --accent: #293ce4;
                --bad: #c62828;
                --good: #1b7f4f;
                --radius: 6px;
            }
        </style>
    </head>
    <body>
        <div class="panel">
            <h1>Dimensional cloud</h1>
            <div id="checking"><p class="dim">Checking the login…</p></div>
            <div id="in" hidden>
                <p class="good">Logged in as <b id="email"></b>.</p>
                <div class="row"><button class="quiet" id="logout">Log out</button></div>
            </div>
            <div id="out" hidden>
                <p>Uploading needs a Dimensional cloud login.</p>
                <div class="row"><button id="start">Log in</button></div>
            </div>
            <div id="pending" hidden>
                <p>Open the Dimensional console, sign in, and approve this code:</p>
                <div class="code" id="code"></div>
                <div class="row">
                    <a class="button" id="open" target="_blank" rel="noopener">Open the console</a>
                    <button class="quiet" id="cancel">Cancel</button>
                </div>
                <p class="dim">
                    Any signed-in browser works (a phone too): <span id="url"></span>. Waiting for the approval…
                    <span id="left"></span>
                </p>
            </div>
            <p id="error" class="bad" hidden></p>
        </div>
        <script>
            const $ = (id) => document.getElementById(id)
            const theme = new URLSearchParams(location.search).get("theme")
            if (theme === "light" || theme === "dark") {
                $("light-theme").media = theme === "light" ? "all" : "not all"
            }
            const base = location.pathname.replace(/\/login\/page\/?$/, "")
            let poll = null

            const show = (which) => ["checking", "in", "out", "pending"].forEach((id) => ($(id).hidden = id !== which))
            const fail = (message) => {
                $("error").textContent = message
                $("error").hidden = !message
            }
            const failWith = (error) => fail(String(error.message || error))
            const tell = (state, email) =>
                window.parent !== window &&
                window.parent.postMessage({ type: "dimos-cloud-login", state, email: email || null }, "*")
            const loggedIn = (email, state) => {
                $("email").textContent = email || "(unknown)"
                show("in")
                tell(state, email)
            }

            async function call(method, path) {
                const response = await fetch(base + path, { method })
                const body = await response.json().catch(() => ({}))
                if (!response.ok) {
                    throw new Error(body.error || `${method} ${path}: ${response.status}`)
                }
                return body
            }

            async function check(fresh) {
                try {
                    const account = await call("GET", "/account" + (fresh ? "?fresh=1" : ""))
                    fail(account.error || "")
                    if (account.loggedIn) {
                        loggedIn(account.email, "loggedIn")
                    } else {
                        show("out")
                        tell("loggedOut")
                    }
                } catch (error) {
                    show("out")
                    failWith(error)
                }
            }

            /** Shows a login attempt; true while it's still waiting for approval. */
            function render(login) {
                if (login.state === "pending") {
                    show("pending")
                    $("code").textContent = login.code || ""
                    $("url").textContent = login.url || ""
                    $("open").href = login.urlComplete || login.url || "#"
                    const seconds = login.expiresAt ? Math.max(0, Math.round((login.expiresAt - Date.now()) / 1000)) : null
                    const minSec = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`
                    $("left").textContent = seconds == null ? "" : `(code expires in ${minSec})`
                    return true
                }
                clearInterval(poll)
                if (login.state === "approved") {
                    fail("")
                    loggedIn(login.email, "approved")
                } else if (["denied", "expired", "failed"].includes(login.state)) {
                    show("out")
                    fail(login.state === "failed" ? login.error || "The login failed." : `The login was ${login.state}. Try again.`)
                    tell(login.state)
                }
                return false
            }

            function watch() {
                clearInterval(poll)
                poll = setInterval(() => call("GET", "/login").then(render, failWith), 1500)
            }

            $("start").onclick = async () => {
                fail("")
                $("start").disabled = true
                try {
                    if (render(await call("POST", "/login"))) {
                        watch()
                    }
                } catch (error) {
                    failWith(error)
                } finally {
                    $("start").disabled = false
                }
            }
            $("cancel").onclick = async () => {
                clearInterval(poll)
                await call("DELETE", "/login").catch(() => {})
                show("out")
                tell("cancelled")
            }
            $("logout").onclick = async () => {
                await call("POST", "/logout").catch(failWith)
                check(true)
            }

            call("GET", "/login").then((login) => (render(login) ? watch() : check(false))).catch(() => check(false))
        </script>
    </body>
</html>
