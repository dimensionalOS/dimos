            streams: [[color_image], [realsense_depth_image], [realsense_camera_info], [tf]]
        unitree-g1-teleop:
          title: G1 VR teleop + recording
          description: GR00T whole-body control, WebXR arm teleop, manipulation and episode recording.
    r1pro:
      name: Galaxea R1 Pro
      description: Galaxea's wheeled two-arm robot, over ROS.
      type: wheeled
      manufacturer: Galaxea
      dirs: [dimos/robot/galaxea/r1pro]
      blueprints:
        r1pro-nav:
          title: R1 Pro click-to-drive
          description: 'Ray-traced costmap and A* replanning: click where the R1 Pro should go.'
          starter: 11
        r1pro-teleop:
          title: R1 Pro driving
