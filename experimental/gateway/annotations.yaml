          starter: 12
        r1pro-coordinator:
          title: R1 Pro control coordinator
          description: The R1 Pro's ROS connection behind a ControlCoordinator.
        r1pro-manipulation:
          title: R1 Pro manipulation (experimental)
          description: Upper-body manipulation planning on the R1 Pro.
        r1pro-planar-preview:
          title: R1 Pro planning preview
