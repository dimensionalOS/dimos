          hidden: true
    spot:
      name: Boston Dynamics Spot
      description: Boston Dynamics' quadruped (experimental support).
      type: dog
      manufacturer: Boston Dynamics
      dirs: [dimos/experimental/robot/bosdyn/spot]
      defaults:
        recommended_config:
