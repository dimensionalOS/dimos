          description: 'The basic G1 stack against a simulated G1: no robot needed.'
          starter: 8
          recommended_config: []
        unitree-g1:
          title: G1 with perception + memory
          description: The basic G1 stack plus spatial memory and object tracking.
          starter: 9
        unitree-g1-agentic:
          title: G1 with an agent
          description: G1 with perception and memory, plus an AI agent with G1 skills (move, observe, speak).
          starter: 10
        unitree-g1-agentic-sim:
          title: G1 agent in simulation
          description: 'The G1 agent against a simulated G1: no robot needed.'
          recommended_config: []
        unitree-g1-sim:
          title: G1 perception in simulation
          description: G1 perception and memory against a simulated G1.
          recommended_config: []
        unitree-g1-coordinator:
          title: G1 control coordinator
          description: The G1's whole-body connection behind a ControlCoordinator servo task.
        unitree-g1-detection:
          title: G1 with 3D detection
          description: The basic G1 stack plus person tracking and 3D detection.
        unitree-g1-full:
          title: G1 full
          description: 'Everything: perception, memory, the agent with G1 skills, and keyboard driving.'
        unitree-g1-groot-wbc:
          title: G1 GR00T whole-body control
          description: GR00T whole-body control with a Mid-360, costmap and A* navigation; on the robot or in MuJoCo.
          recommended_config:
          - &robot_or_simulator
            label: Run it on
            choices:
            - {label: Robot, set: {simulation: ''}}
            - {label: Simulator, set: {simulation: mujoco}}
