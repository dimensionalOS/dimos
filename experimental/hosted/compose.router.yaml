name: dimos-host-discovery-router

x-dimos-common: &dimos-common
  ZENOH_MODE: client
  ZENOH_CONNECT_TIMEOUT: "10"
  ZENOH_SCOUTING: "false"
  ZENOH_MULTICAST: "false"
  ZENOH_GOSSIP: "false"
  DIMOS_ZENOH_MODE: client
  DIMOS_ZENOH_CONNECT_TIMEOUT: "10"
  DIMOS_ZENOH_SCOUTING: "false"
  DIMOS_ZENOH_MULTICAST: "false"
  DIMOS_ZENOH_GOSSIP: "false"
  DIMOS_LOG_LEVEL: WARNING
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"

x-dimos-environment-a: &dimos-environment-a
  <<: *dimos-common
  ZENOH_CONNECT: tcp/router-a:7447
  DIMOS_ZENOH_CONNECT: tcp/router-a:7447

x-dimos-environment-b: &dimos-environment-b
  <<: *dimos-common
  ZENOH_CONNECT: tcp/router-b:7447
  DIMOS_ZENOH_CONNECT: tcp/router-b:7447

services:
  router-a:
    image: eclipse/zenoh:1.9.0
    command:
      - -l
      - tcp/0.0.0.0:7447
      - -e
      - tcp/router-b:7447
      - --no-multicast-scouting
    depends_on:
      - router-b
    networks:
      - network-a
      - router-transit

  router-b:
    image: eclipse/zenoh:1.9.0
    command: ["-l", "tcp/0.0.0.0:7447", "--no-multicast-scouting"]
    networks:
      - network-b
      - router-transit

  host-a:
    image: dimos-host-discovery:compose
    build:
      context: ../..
      dockerfile: experimental/hosted/Dockerfile
    command: ["dimos", "host", "serve", "--tag", "network-a"]
    environment: *dimos-environment-a
    depends_on:
      - router-a
    deploy:
      replicas: 5
    init: true
    restart: on-failure
    stop_grace_period: 10s
    networks:
      - network-a

  host-b:
    image: dimos-host-discovery:compose
    build:
      context: ../..
      dockerfile: experimental/hosted/Dockerfile
    command: ["dimos", "host", "serve", "--tag", "network-b"]
    environment: *dimos-environment-b
    depends_on:
      - router-b
    deploy:
      replicas: 5
    init: true
    restart: on-failure
    stop_grace_period: 10s
    networks:
      - network-b

  discovery:
    image: dimos-host-discovery:compose
    build:
      context: ../..
      dockerfile: experimental/hosted/Dockerfile
    command: ["dimos", "host", "list", "--json", "--timeout", "5"]
    environment: *dimos-environment-a
    depends_on:
      - router-a
    networks:
      - network-a
    profiles:
      - tools

  remote-execution:
    image: dimos-host-discovery:compose
    build:
      context: ../..
      dockerfile: experimental/hosted/Dockerfile
    command: ["python", "-m", "experimental.hosted.run_remote_execution"]
    environment: *dimos-environment-a
    depends_on:
      - router-a
    networks:
      - network-a
    profiles:
      - tools

  sandbox:
    image: dimos-host-discovery:compose
    build:
      context: ../..
      dockerfile: experimental/hosted/Dockerfile
    command: ["sleep", "infinity"]
    environment: *dimos-environment-a
    depends_on:
      - router-a
    stdin_open: true
    tty: true
    networks:
      - network-a

networks:
  network-a:
    internal: true
  network-b:
    internal: true
  router-transit:
    internal: true
